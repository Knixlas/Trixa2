# Löppass — Snabbhetsfärdigheter (SS)
#
# SS1 — Strides: korta fartökningar 20-30 sek på platt mark.
# SS2 — Pickups: gradvis stigande pace över en kontinuerlig löprunda.
#
# Båda är parametriserade mallar — strides är så enkla att konkreta
# varianter knappast ger värde.

workouts:

  # ─────────────────────────────────────────────────────────────
  # SS1 — Strides (parametriserad mall)
  # ─────────────────────────────────────────────────────────────

  - code: SS1_run_template
    discipline: run
    category: SS
    type_code: SS1
    name: "Stegringar — korta, snabba, snygga"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2, peak, race]
    parameterized: true
    parameters:
      reps:
        default: 6
        range: [4, 10]
        description: "Antal strides — vanligast 6, fler i peak/race-prep"
      stride_sec:
        default: 20
        range: [15, 30]
        description: "Längd per stride i sekunder"
      rest_sec:
        default: 60
        range: [45, 90]
        description: "Aktiv vila (lugn jogg eller gång) mellan strides"
    intent: |
      Stegringar är korta, kontrollerade fartökningar — inte spurter.
      Farten är snabb men avspänd, cirka 90 % av maxfart, med fin
      teknik: lätta steg, mjuka knän, avslappnade axlar.
      
      Syftet är att hålla benen vana vid fart, öva rätt teknik när det
      går fort och väcka kroppen. De bygger inte uthållighet och gör
      inte veckan tyngre.
    main_set:
      - segment: warmup
        duration_min: 15
        zone: 1
        description: "Lugn jogg, eller gör stegringarna direkt efter ett lugnt distanspass"
      - segment: main
        sets: 6
        duration_sec: 20
        zone: 5
        effort_descriptor: "snabbt men avspänt — cirka 90 % av maxfart, kontrollerade steg, inte så hårt att du blir andfådd"
        rest_sec: 60
        description: "Vila: jogga lugnt tillbaka eller gå"
      - segment: cooldown
        duration_min: 5
        zone: 1
    total_duration_min:
      estimated: 30
      flexible_range: [25, 45]
    zone_refs: [Z1]
    terrain: flat
    surface: road
    equipment: []
    abort_conditions:
      - "Om tekniken släpper (sneda axlar, fötterna slår i marken) → hoppa över resten av stegringarna"
    coach_notes: |
      Bästa appliceringen: påsläpp i slutet av ett AE2-pass, eller
      som fristående mikro-pass när dagsformen inte räcker till
      kvalitet men inte motiverar full vila. 2-3 gånger/vecka över
      lag — billigt och högt värde.

  # ─────────────────────────────────────────────────────────────
  # SS2 — Pickups (parametriserad mall)
  # ─────────────────────────────────────────────────────────────

  - code: SS2_run_template
    discipline: run
    category: SS
    type_code: SS2
    name: "Fartväxlingar mitt i rundan"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 50
        range: [30, 70]
      pickup_count:
        default: 8
        range: [6, 12]
        description: "Antal pickups jämnt fördelade över hela passet"
      pickup_sec:
        default: 30
        range: [20, 45]
    intent: |
      Fartökningar mitt i en vanlig löprunda. Du ökar farten gradvis,
      från lugnt (Z2) till ganska jobbigt (Z3–Z4), under 20–45 s —
      ingen rivstart. Sedan springer du lugnt (Z2) igen, utan att
      stanna eller gå.

      Du lär dig lyfta tempot när du vill — bra på tävling när du
      behöver svara på en attack eller ta dig förbi en grupp.
    main_set:
      - segment: warmup
        duration_min: 10
        zone: 1
      - segment: continuous
        duration_min: 35
        zone: 2
        description: "Jämn, lugn löpning (Z2) — fartökningarna kommer jämnt utspridda"
        embedded_pickups:
          count: 8
          duration_sec: 30
          effort_descriptor: "build från Z2 till övre Z3 över 30 sek, snabb retur till Z2"
          spacing_min: 4
      - segment: cooldown
        duration_min: 5
        zone: 1
    total_duration_min:
      estimated: 50
      flexible_range: [30, 70]
    zone_refs: [Z1, Z2, Z3]
    terrain: flat
    surface: road
    equipment: []
    coach_notes: |
      Renderaren plockar fram pickup-schema: "Pickup vid 14, 18, 22…
      min in i passet." Bättre än "var 4:e minut" för adepten i fält.
