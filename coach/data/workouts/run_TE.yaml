# Löppass — Tempo (TE)
#
# TE1 — Tempo Endurance: löpning i Z3, "bekvämt obekvämt".
#
# Tempoblock + intervalldelar är FASTA (det är de som definierar passet).
# Warmup, build och cooldown skalas med budget.

workouts:

  - code: TE1_run_01
    discipline: run
    category: TE
    type_code: TE1
    name: "Klassiskt tempo — 20 min i sträck"
    phase_appropriate: [base_2, base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 50
        range: [45, 60]
        description: "Tempoblock + build = 23 min FAST. Resten är wu/cd."
    intent: |
      Ett sammanhängande block i Z3. Det ska kännas "bekvämt obekvämt"
      — du jobbar, men du tar inte slut. Andningen är djup men under
      kontroll, och du kan prata i korta meningar.
    main_set:
      - segment: warmup
        duration_pct: 0.56
        zone: 1
        description: "Börja lugnt och öka lite, sista 2 min i Z2"
      - segment: build
        duration_min: 3
        zone: 2
        description: "Öka från Z2 till nedre Z3 — vänj dig vid tempot"
      - segment: main
        duration_min: 20
        zone: 3
        description: "Jämnt i Z3. Hitta en andningsrytm tidigt och håll den."
      - segment: cooldown
        duration_pct: 0.44
        zone: 1
    total_duration_min:
      estimated: 50
      flexible_range: [45, 60]
    zone_refs: [Z1, Z2, Z3]
    terrain: flat
    surface: road
    equipment: []
    abort_conditions:
      - "Om pulsen kryper upp över Z3 fast farten är densamma — sakta in 10 s per km och fortsätt"
      - "Om Z3-farten ger puls i Z4 redan från start → dålig dag; avbryt tempot och spring lugnt (Z2)"
    coach_notes: |
      Klassiker. Ska kunna upprepas vecka efter vecka i base/build
      utan att tröttna ut nervsystemet.

  - code: TE1_run_02
    discipline: run
    category: TE
    type_code: TE1
    name: "Tempo i två bitar — 2×12 min"
    phase_appropriate: [base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 55
        range: [50, 65]
        description: "Tempoblock + vila + build = 30 min FAST"
    intent: |
      Två tempoblock med kort vila. Lättare för huvudet än 24 minuter
      i ett sträck, men samma träning för kroppen. Bra om du har svårt
      att hålla farten länge utan avbrott.
    main_set:
      - segment: warmup
        duration_pct: 0.55
        zone: 1
      - segment: build
        duration_min: 3
        zone: 2
      - segment: main
        sets: 2
        duration_min: 12
        zone: 3
        rest_sec: 180
        description: "Jämnt i Z3. Vila med mycket lugn jogg (Z1)."
      - segment: cooldown
        duration_pct: 0.45
        zone: 1
    total_duration_min:
      estimated: 55
      flexible_range: [50, 65]
    zone_refs: [Z1, Z2, Z3]
    terrain: flat
    surface: road
    equipment: []

  - code: TE1_run_03
    discipline: run
    category: TE
    type_code: TE1
    name: "Tempotrappa — 3×8 min, stigande"
    phase_appropriate: [build_1, build_2, peak]
    parameterized: true
    parameters:
      duration_min:
        default: 60
        range: [55, 70]
        description: "3×8 min tempo + 2×120s vila = 28 min FAST"
    intent: |
      Tre block på 8 minuter, vart och ett lite snabbare än det förra:
      nedre, mitten och övre Z3. Du övar på att öka farten när du redan
      är trött — precis det du behöver i ett halvmaraton och i slutet
      av ett maraton.
    main_set:
      - segment: warmup
        duration_pct: 0.56
        zone: 1
      - segment: main
        duration_min: 8
        zone: 3
        rest_sec: 120
        description: "Nedre Z3 — försiktigt"
      - segment: main
        duration_min: 8
        zone: 3
        rest_sec: 120
        description: "Mitten av Z3 — 5 s snabbare per km"
      - segment: main
        duration_min: 8
        zone: 3
        description: "Övre Z3 — strax under tröskeln, den fart du orkar hålla i ungefär en timme"
      - segment: cooldown
        duration_pct: 0.44
        zone: 1
    total_duration_min:
      estimated: 60
      flexible_range: [55, 70]
    zone_refs: [Z1, Z3]
    terrain: flat
    surface: road
    equipment: []
    abort_conditions:
      - "Om pulsen når Z4 redan i block 2 → spring block 3 i samma fart, inte snabbare"
