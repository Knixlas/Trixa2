# Simpass — Snabbhetsfärdigheter (SS)
#
# SS1 — Fast Forms 25s: korta sprintar med teknikfokus, full återhämtning
# SS2 — Toys Sets: fenor, snorkel, kickboard — verktyg för teknik och snabbhet
#
# Gemensamt: hög kvalitet per repetition. Aldrig trötta upp. När
# tekniken bryts är passet slut.
#
# Skalning: fler reps + lugn absorbtion i Z1. Aldrig "fler all-out" på
# bekostnad av återhämtningen — då blir det trötthet, inte snabbhet.

workouts:

  # ─────────────────────────────────────────────────────────────
  # SS1 — Fast Forms 25s
  # ─────────────────────────────────────────────────────────────

  - code: SS1_swim_01
    discipline: swim
    category: SS
    type_code: SS1
    name: "Korta spurter — 16 × 25 m med gott om vila"
    parameterized: true
    parameters:
      duration_min:
        default: 45
        range: [30, 65]
        description: "Skala till veckans budget"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2, peak]
    intent: |
      Klassisk snabbhetsträning: korta spurter på 25 m, och vila tills du
      är pigg igen. Poängen är fart utan trötthet — varje 25 m ska se ut
      som den första. Släpp aldrig tekniken för att ta dig i mål.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 15
        drills: [single_arm, six_kick_switch, fast_swim_focus]
      - segment: build
        sets: {default: 4, range: [3, 5]}
        distance_m: 25
        rest_sec: 30
        description: "Öka farten från lugnt (Z2) till ganska hårt (Z4). Kroppen vaknar inför spurterna."
      - segment: sprint
        sets: {default: 16, range: [10, 24]}
        distance_m: 25
        zone: 5
        rest_sec: 30
        description: "Så fort du kan från frånskjutet vid väggen. Hämta dig helt innan nästa."
        notes: "Andas så lite som möjligt — helst inte alls på 25m"
      - segment: continuous
        duration_pct: 0.10
        zone: 1
        description: "Lugn frisim, så att du hämtar dig efter spurterna"
      - segment: cooldown
        duration_pct: 0.15
        zone: 1
    total_distance_m: 1500
    total_duration_min:
      estimated: 45
      flexible_range: [30, 65]
    zone_refs: [Z1, Z2, Z4, Z5]
    equipment: []
    abort_conditions:
      - "När en 25 m går mer än 2 s långsammare än din snabbaste hittills: sluta. Då tränar du trötthet, inte snabbhet"

  - code: SS1_swim_02
    discipline: swim
    category: SS
    type_code: SS1
    name: "Under ytan — delfinspark från väggen"
    parameterized: true
    parameters:
      duration_min:
        default: 30
        range: [25, 45]
        description: "Smal range — undervattenarbete har riskdimension"
    phase_appropriate: [base_2, base_3, build_1, build_2, peak]
    intent: |
      Spurter med fokus på biten under vattnet ut från väggen. Varje
      25 m börjar med 5 delfinsparkar under ytan innan första armtaget.
      Du bygger kraft i starten och vänjer benen vid sparkarbetet.
    main_set:
      - segment: warmup
        duration_pct: 0.20
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 25
        rest_sec: 20
        description: "Bara delfinspark under vattnet från frånskjutet — kom sedan upp och stå"
      - segment: sprint
        sets: {default: 8, range: [6, 12]}
        distance_m: 25
        zone: 5
        rest_sec: 45
        description: "5 delfinsparkar under vattnet ut från väggen, sedan full fart till andra änden"
      - segment: continuous
        duration_pct: 0.15
        zone: 1
        description: "Lugn frisim, så att du hämtar dig efter spurterna"
      - segment: cooldown
        duration_pct: 0.15
        zone: 1
    total_distance_m: 900
    total_duration_min:
      estimated: 30
      flexible_range: [25, 45]
    zone_refs: [Z1, Z5]
    equipment: []
    coach_notes: |
      Korta pass — undervattenarbete är belastande på lungor och kropp.
      Aldrig stretcha gränsen för att hålla andan, det är farligt.
      Smal range — det här är inte ett "längre om budget medger"-pass.

  - code: SS1_swim_03
    discipline: swim
    category: SS
    type_code: SS1
    name: "Växla upp — 12 × 25 m i tre steg"
    parameterized: true
    parameters:
      duration_min:
        default: 35
        range: [25, 55]
        description: "Skala till veckans budget"
    phase_appropriate: [base_2, base_3, build_1, build_2, peak]
    intent: |
      Spurter där farten ökar steg för steg. De första går inte för
      fullt — du bygger upp till högsta fart på de sista. Kroppen lär
      sig öka farten utan att tekniken faller isär.
    main_set:
      - segment: warmup
        duration_pct: 0.18
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 15
      - segment: sprint
        sets: {default: 4, range: [3, 6]}
        distance_m: 25
        zone: 4
        rest_sec: 30
        description: "Steg 1: snabbt, men inte för fullt"
      - segment: sprint
        sets: {default: 4, range: [3, 6]}
        distance_m: 25
        zone: 4
        rest_sec: 35
        description: "Steg 2: snabbare än steg 1"
      - segment: sprint
        sets: {default: 4, range: [3, 6]}
        distance_m: 25
        zone: 5
        rest_sec: 40
        description: "Steg 3: så fort du kan"
      - segment: continuous
        duration_pct: 0.15
        zone: 1
        description: "Lugn frisim, så att du hämtar dig efter spurterna"
      - segment: cooldown
        duration_pct: 0.12
        zone: 1
    total_distance_m: 1300
    total_duration_min:
      estimated: 35
      flexible_range: [25, 55]
    zone_refs: [Z1, Z4, Z5]
    equipment: []

  # ─────────────────────────────────────────────────────────────
  # SS2 — Toys Sets
  # ─────────────────────────────────────────────────────────────

  - code: SS2_swim_01
    discipline: swim
    category: SS
    type_code: SS2
    name: "Fenor på — snabbt och flytande"
    parameterized: true
    parameters:
      duration_min:
        default: 32
        range: [22, 55]
        description: "Skala till veckans budget"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2, peak]
    intent: |
      Med fenor får du mer kraft och fart utan att slita lika hårt på
      axlarna. Kroppen vänjer sig vid att simma fortare än din tröskelfart
      (CSS) — en känsla du sedan vill kunna hitta utan fenor.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: kick
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
        equipment: [fins, kickboard]
        description: "På rygg eller med sparkbräda, snabba fötter"
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
        equipment: [fins]
        drills: [six_kick_switch, side_kick]
      - segment: main
        sets: {default: 8, range: [5, 14]}
        distance_m: 50
        zone: 3
        rest_sec: 20
        equipment: [fins]
        description: "Snabb frisim med fenor — en fart du annars inte når"
      - segment: continuous
        duration_pct: 0.15
        zone: 1
        description: "Lugn frisim, så att du hämtar dig efter intervallerna"
      - segment: cooldown
        duration_pct: 0.07
        zone: 1
        equipment: []
        description: "Utan fenor, så att du känner skillnaden"
    total_distance_m: 1800
    total_duration_min:
      estimated: 32
      flexible_range: [22, 55]
    zone_refs: [Z1, Z3]
    equipment: [fins, kickboard]

  - code: SS2_swim_02
    discipline: swim
    category: SS
    type_code: SS2
    name: "Snorkel på — teknik utan andningsstrul"
    parameterized: true
    parameters:
      duration_min:
        default: 32
        range: [22, 55]
        description: "Skala till veckans budget"
    phase_appropriate: [prep, base_1, base_2, base_3]
    intent: |
      Med snorkel behöver du inte vrida huvudet för att andas. Då kan du
      lägga all uppmärksamhet på hur kroppen ligger och hur armtagen går.
      Långsamt och noggrant.
    main_set:
      - segment: warmup
        duration_pct: 0.10
        zone: 1
        equipment: []
      - segment: drills
        sets: {default: 6, range: [4, 10]}
        distance_m: 50
        rest_sec: 20
        equipment: [snorkel]
        drills: [sculling_front, catch_drill, fingertip_drag]
        description: "Snorkel på — fokusera helt på vad armarna gör"
      - segment: main
        sets: {default: 4, range: [3, 7]}
        distance_m: 100
        zone: 2
        rest_sec: 20
        equipment: [snorkel]
        description: "Lugn frisim med snorkel — behåll känslan från teknikövningarna"
      - segment: main
        sets: {default: 4, range: [3, 7]}
        distance_m: 50
        zone: 2
        rest_sec: 15
        equipment: []
        description: "Utan snorkel — försök ligga i vattnet som du gjorde med snorkeln"
      - segment: continuous
        duration_pct: 0.10
        zone: 1
        description: "Lugn frisim utan snorkel, så att du hämtar dig"
      - segment: cooldown
        duration_pct: 0.08
        zone: 1
    total_distance_m: 1500
    total_duration_min:
      estimated: 32
      flexible_range: [22, 55]
    zone_refs: [Z1, Z2]
    equipment: [snorkel]

  - code: SS2_swim_03
    discipline: swim
    category: SS
    type_code: SS2
    name: "Leksakslådan — fenor, snorkel, sparkbräda"
    parameterized: true
    parameters:
      duration_min:
        default: 30
        range: [22, 50]
        description: "Skala till veckans budget"
    phase_appropriate: [base_1, base_2, base_3]
    intent: |
      Du växlar mellan fenor, snorkel och sparkbräda. Varje hjälpmedel
      lyfter fram en del av tekniken, så passet täcker mycket på en gång.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: kick
        sets: {default: 6, range: [4, 9]}
        distance_m: 50
        rest_sec: 15
        equipment: [kickboard, fins]
        zone: 2
        description: "Snabb benspark med små, smala sparkar"
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
        equipment: [snorkel]
        drills: [catch_drill, sculling_front]
      - segment: main
        sets: {default: 4, range: [3, 7]}
        distance_m: 75
        zone: 2
        rest_sec: 20
        equipment: [fins]
        description: "Frisim med fenor, känn farten"
      - segment: continuous
        duration_pct: 0.15
        zone: 1
        description: "Lugn frisim utan hjälpmedel, så att du hämtar dig"
      - segment: cooldown
        duration_pct: 0.07
        zone: 1
        equipment: []
    total_distance_m: 1500
    total_duration_min:
      estimated: 30
      flexible_range: [22, 50]
    zone_refs: [Z1, Z2]
    equipment: [fins, snorkel, kickboard]
    coach_notes: |
      Passet är variation-tungt — bra som veckans 'teknik-pass'
      när det inte finns plats för specifikt tekniktema.

  - code: SS2_swim_04
    discipline: swim
    category: SS
    type_code: SS2
    name: "Överfart med fenor — snabbare än du är"
    parameterized: true
    parameters:
      duration_min:
        default: 33
        range: [25, 50]
        description: "Skala till veckans budget"
    phase_appropriate: [base_3, build_1, build_2, peak]
    intent: |
      Med fenor kan du simma fortare än din egen tröskelfart (CSS)
      tillåter. Du får KÄNNA hur den farten är. Forskningen om
      sådan överfartsträning är blandad, men i praktiken får du en
      känsla för hur snabb frisim ska kännas.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
      - segment: build
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 15
        equipment: [fins]
        description: "Öka farten gradvis, med fenor"
      - segment: sprint
        sets: {default: 12, range: [8, 18]}
        distance_m: 25
        zone: 5
        rest_sec: 30
        equipment: [fins]
        description: "Full fart med fenor — fortare än du någonsin simmar utan"
      - segment: main
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        zone: 4
        rest_sec: 20
        equipment: []
        description: "Utan fenor — försök behålla känslan av fart"
      - segment: continuous
        duration_pct: 0.10
        zone: 1
        description: "Lugn frisim, så att du hämtar dig efter spurterna"
      - segment: cooldown
        duration_pct: 0.07
        zone: 1
    total_distance_m: 1400
    total_duration_min:
      estimated: 33
      flexible_range: [25, 50]
    zone_refs: [Z1, Z4, Z5]
    equipment: [fins]
