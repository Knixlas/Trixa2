# Löppass — Muskulär Uthållighet (ME)
#
# Tröskelfamiljen. Alla huvudset är fasta — intervalldelen är poängen.
# Bara warmup/cooldown skalas med budget.

workouts:

  # ─────────────────────────────────────────────────────────────
  # ME1 — Cruise Intervals
  # ─────────────────────────────────────────────────────────────

  - code: ME1_run_01
    discipline: run
    category: ME
    type_code: ME1
    name: "Tröskel-kilometrar — 5×1 km"
    phase_appropriate: [base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 65
        range: [60, 75]
        description: "Stridor + main = ~37 min FAST (5 km @ ~4:45/km + viltimmar)"
    intent: |
      Klassiska kilometerintervaller i tröskelfart — den fart du orkar
      hålla i ungefär en timme. Vilan räcker för att du ska orka samma
      fart i alla fem, men är kort nog för att det ska bli ordentlig
      träning.
    main_set:
      - segment: warmup
        duration_pct: 0.55
        zone: 1
      - segment: build
        sets: 4
        duration_sec: 20
        zone: 4
        effort_descriptor: "stegringar"
        rest_sec: 40
      - segment: main
        sets: 5
        distance_m: 1000
        zone: 4
        rest_sec: 90
        description: "Jämnt i Z4. Farten får skilja högst 5 s per km mellan de fem."
      - segment: cooldown
        duration_pct: 0.45
        zone: 1
    total_duration_min:
      estimated: 65
      flexible_range: [60, 75]
    zone_refs: [Z1, Z4]
    terrain: flat
    surface: track
    equipment: []
    abort_conditions:
      - "Om pulsen når Z5 redan på första eller andra → sakta in till nedre Z4"
      - "Om du är mer än 10 s per km långsammare på fjärde → spring femte i Z3, men hoppa inte över den"
    coach_notes: |
      Funkar bäst på bana eller helt platt asfalt — splits ska vara
      jämförbara. Indikator-pass: om pace är klart bättre eller sämre
      än tidigare cykler — testvärdena kan behöva uppdateras.

  - code: ME1_run_02
    discipline: run
    category: ME
    type_code: ME1
    name: "Långa tröskelintervaller — 4×1500 m"
    phase_appropriate: [build_1, build_2, peak]
    parameterized: true
    parameters:
      duration_min:
        default: 70
        range: [65, 80]
        description: "Stridor + main = ~42 min FAST"
    intent: |
      Längre tröskelintervaller — mer likt att springa i tröskelfart
      utan avbrott än 1 km-intervaller. Du får bita ihop i sista
      tredjedelen av varje intervall.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        sets: 4
        duration_sec: 20
        zone: 4
        effort_descriptor: "stegringar"
        rest_sec: 40
      - segment: main
        sets: 4
        distance_m: 1500
        zone: 4
        rest_sec: 120
        description: "Nedre Z4. Hitta farten de första 400 m och håll den."
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 70
      flexible_range: [65, 80]
    zone_refs: [Z1, Z4]
    terrain: flat
    surface: track
    equipment: []

  - code: ME1_run_03
    discipline: run
    category: ME
    type_code: ME1
    name: "Korta tröskelintervaller — 8×600 m"
    phase_appropriate: [base_3, build_1]
    parameterized: true
    parameters:
      duration_min:
        default: 60
        range: [55, 70]
        description: "Stridor + main = ~35 min FAST"
    intent: |
      Kortare tröskelintervaller med kort vila. Varje intervall är
      lättare, men de är fler. Ett bra första steg mot tröskelträning
      efter grundträningens två första block.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        sets: 4
        duration_sec: 20
        zone: 4
        effort_descriptor: "stegringar"
        rest_sec: 40
      - segment: main
        sets: 8
        distance_m: 600
        zone: 4
        rest_sec: 60
        description: "Nedre Z4. Kort vila — alla åtta ska kännas som ett enda långt block."
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 60
      flexible_range: [55, 70]
    zone_refs: [Z1, Z4]
    terrain: flat
    surface: track
    equipment: []

  # ─────────────────────────────────────────────────────────────
  # ME2 — Hill Cruise Intervals
  # ─────────────────────────────────────────────────────────────

  - code: ME2_run_01
    discipline: run
    category: ME
    type_code: ME2
    name: "Tröskel i backe — 5×2 min"
    phase_appropriate: [base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 60
        range: [55, 70]
        description: "Stridor + main = ~22 min FAST"
    intent: |
      Tröskelintervaller uppför. I backen når pulsen Z4 utan att du
      behöver springa så fort, och det är skonsammare för lederna när
      det går hårt.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        sets: 3
        duration_sec: 20
        zone: 4
        effort_descriptor: "stegringar"
        rest_sec: 40
      - segment: main
        sets: 5
        duration_min: 2
        zone: 4
        pace_unreliable: true
        rest_sec: 120
        description: "Z4 uppför 3–5 % lutning. Gå eller jogga ner i vilan."
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 60
      flexible_range: [55, 70]
    zone_refs: [Z1, Z4]
    terrain: hilly
    surface: road
    equipment: []

  - code: ME2_run_02
    discipline: run
    category: ME
    type_code: ME2
    name: "Tröskel på stig — 4×3 min uppför"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 65
        range: [60, 75]
        description: "Main = ~21 min FAST (4×3 + 3×3 viltimmar)"
    intent: |
      Längre intervaller uppför på stig. Mjukt och ojämnt underlag där
      du får tänka på var du sätter fötterna, och jobbigt länge (Z4).
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
        pace_unreliable: true
      - segment: main
        sets: 4
        duration_min: 3
        zone: 4
        pace_unreliable: true
        rest_sec: 180
        description: "Nedre Z4. Jämn kraft, och titta var du sätter fötterna."
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
        pace_unreliable: true
    total_duration_min:
      estimated: 65
      flexible_range: [60, 75]
    zone_refs: [Z1, Z4]
    terrain: hilly
    surface: trail
    equipment: []

  # ─────────────────────────────────────────────────────────────
  # ME3 — Crisscross Intervals
  # ─────────────────────────────────────────────────────────────

  - code: ME3_run_01
    discipline: run
    category: ME
    type_code: ME3
    name: "Växeltröskel — två på, en nästan av"
    phase_appropriate: [build_1, build_2, peak]
    parameterized: true
    parameters:
      duration_min:
        default: 60
        range: [55, 70]
        description: "Stridor + 18 min crisscross = ~21 min FAST"
    intent: |
      Du växlar mellan Z3 och Z4 i 18 minuter utan paus. Övre Z3 är
      din "vila" — men du hinner aldrig återhämta dig riktigt. Därför
      får du mer tröskelträning än i ett lika långt pass med bara Z4.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        sets: 3
        duration_sec: 20
        zone: 4
        effort_descriptor: "stegringar"
        rest_sec: 40
      - segment: main
        sets: 6
        pattern:
          - { duration_min: 2, zone: 4 }
          - { duration_min: 1, zone: 3 }
        description: "Ingen vila mellan — gå direkt från Z4 till Z3 och tillbaka till Z4. Övre Z3 är ingen paus."
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 60
      flexible_range: [55, 70]
    zone_refs: [Z1, Z3, Z4]
    terrain: flat
    surface: road
    equipment: []
    abort_conditions:
      - "Om de lugnare minuterna (Z3) glider upp i Z4 fast du inte vill → avbryt, eller hoppa över ett par växlingar på slutet"
    coach_notes: |
      Mentalt krävande. Inte ett "test-och-se-hur-det-går"-pass —
      adepten ska vara välbenägen och utvilad.

  - code: ME3_run_02
    discipline: run
    category: ME
    type_code: ME3
    name: "Växeltröskel XL — 20 min utan paus"
    phase_appropriate: [build_2, peak]
    parameterized: true
    parameters:
      duration_min:
        default: 65
        range: [60, 75]
        description: "Stridor + 20 min crisscross = ~23 min FAST"
    intent: |
      Längre växelpass: 20 min utan paus på eller strax under
      tröskeln. Ett tufft pass för slutet av uppbyggnaden och
      toppningen.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        sets: 3
        duration_sec: 20
        zone: 4
        effort_descriptor: "stegringar"
        rest_sec: 40
      - segment: main
        sets: 4
        pattern:
          - { duration_min: 3, zone: 4 }
          - { duration_min: 2, zone: 3 }
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 65
      flexible_range: [60, 75]
    zone_refs: [Z1, Z3, Z4]
    terrain: flat
    surface: road
    equipment: []

  # ─────────────────────────────────────────────────────────────
  # ME4 — Threshold Run (kontinuerligt block — main FAST)
  # ─────────────────────────────────────────────────────────────

  - code: ME4_run_01
    discipline: run
    category: ME
    type_code: ME4
    name: "Tröskel i ett svep — 30 min"
    phase_appropriate: [build_2, peak]
    parameterized: true
    parameters:
      duration_min:
        default: 65
        range: [60, 70]
        description: "Build + 30 min tröskel = 35 min FAST"
    intent: |
      Ett block med halvmaratonet i sikte: 30 min strax UNDER tröskeln
      (nedre Z4) — den fart du orkar hålla i ungefär en timme. Jobbigt
      för huvudet, men farten är inte extrem — är kroppen redo så går
      det.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        duration_min: 5
        zone: 3
        description: "Öka från Z2 upp mot Z4 — sista minuten i nedre Z4"
      - segment: main
        duration_min: 30
        zone: 4
        description: "Nedre Z4. Hitta rytmen tidigt — samma andning sista minuten som första."
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 65
      flexible_range: [60, 70]
    zone_refs: [Z1, Z3, Z4]
    terrain: flat
    surface: road
    equipment: []
    abort_conditions:
      - "Om pulsen redan efter 10 min ligger i övre Z4 eller nedre Z5 → sakta in 10 s per km, eller avbryt efter 20 min"
    coach_notes: |
      Inte ett indikator-pass utan benchmark-pass: 30 sammanhängande
      tröskelminuter syns i HRV-svaret 24-48h efteråt. Räkna in det
      i veckans samlade kvalitetsstress.

  - code: ME4_run_02
    discipline: run
    category: ME
    type_code: ME4
    name: "Tröskel i två block — 2×20 min"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 70
        range: [65, 80]
        description: "Build + 2×20 min + 3 min vila = 46 min FAST"
    intent: |
      40 min i tröskelfart, uppdelat i två block. Lättare för huvudet,
      men samma träning för kroppen.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        duration_min: 3
        zone: 3
      - segment: main
        sets: 2
        duration_min: 20
        zone: 4
        rest_sec: 180
        description: "Nedre Z4. Vila med mycket lugn jogg (Z1)."
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 70
      flexible_range: [65, 80]
    zone_refs: [Z1, Z3, Z4]
    terrain: flat
    surface: road
    equipment: []
