# Cykelpass — Muskulär Styrka (MF)
#
# MF1 — Force Reps: korta intensiva intervaller med LÅG kadens (50-60 rpm)
#                   och hög watt. Rekryterar snabba muskelfibrer och
#                   bygger pedalkraft. Trainer eller långsam backe.
#
# MF2 — Hilly Ride: lång åktur i kuperad terräng. Naturligt varierande
#                   belastning i Z2-Z3 med Z4-spikar i backar. Bygger
#                   styrka under aerob bas.
#
# MF3 — Hill Repeats: upprepade backintervaller, 3-8 min per backe i Z4.
#                     Kombinerar styrka och tröskelarbete.

workouts:

  # ─────────────────────────────────────────────────────────────
  # MF1 — Force Reps
  # ─────────────────────────────────────────────────────────────

  - code: MF1_bike_01
    discipline: bike
    category: MF
    type_code: MF1
    name: "Tunga tramp — 8×30 sek på seg växel"
    phase_appropriate: [base_1, base_2, base_3]
    parameterized: true
    parameters:
      duration_min:
        default: 45
        range: [35, 60]
        description: "8 × 30 sek + 7 × 90 sek vila = 14 min fasta reps."
    intent: |
      Intervaller med långsam trampfrekvens som bygger kraft i benen. Det
      är trampfrekvensen du styr på: håll 50-60 varv/min. När du trampar
      färre varv måste du trycka hårdare i varje tramp, och det är det som
      gör det tungt. Det ska kännas i lårens framsida och i rumpan, INTE i
      knäna. Börjar knäna protestera: trampa 5 varv/min snabbare och lätta
      på trycket.
    setting: either
    terrain: flat
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.33
        zone: 1
        erg_mode: false
        description: "Lägg in 2-3 korta ökningar upp mot lugnt (Z2) så att benen vaknar"
      - segment: main
        sets: 8
        duration_min: 0.5
        zone: 4
        cadence_rpm: [50, 60]
        rest_sec: 90
        description: |
          Hårt, nära tröskeln — den ansträngning du orkar hålla i ungefär en
          timme (Z4) — på tung växel med 50-60 varv/min. Sitt kvar i sadeln
          och trampa runt. Vila genom att cykla lätt (Z1) i naturlig takt.
      - segment: cooldown
        duration_pct: 0.22
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 45
      flexible_range: [35, 60]
    zone_refs: [Z1, Z4]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Smärta i knäna → avbryt direkt och trampa snabbare nästa gång"
      - "Du orkar inte hålla trycket (watten mer än 15 % lägre än i första intervallen) → hoppa över resten av intervallerna"
    coach_notes: |
      Klassiskt MF1-pass. Trainer rekommenderas (ERG ger exakt watt-kontroll
      vid låg kadens — utomhus blir det svårt att inte glida upp i kadens
      när det börjar svida). Utomhus kräver det en lång svag uppförsbacke.

  - code: MF1_bike_02
    discipline: bike
    category: MF
    type_code: MF1
    name: "Tunga tramp 6×1 min — stigande tryck"
    phase_appropriate: [base_2, base_3, build_1]
    parameterized: true
    parameters:
      duration_min:
        default: 50
        range: [40, 65]
        description: "6 × 1 min + 5 × 3 min vila = 21 min fasta reps."
    intent: |
      Längre kraftintervaller där trycket ökar under minuten. Varje
      intervall börjar strax under tröskeln — den ansträngning du orkar
      hålla i ungefär en timme (nedre Z4) — och växer till mitten/övre Z4
      under 60 sekunder. Trampfrekvensen ligger på 55-65 varv/min, lite
      högre än i 30-sekundersvarianten eftersom intervallerna är längre.
      Mer tröskelträning än det första passet, men fortfarande styrka tack
      vare den långsamma trampfrekvensen.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.30
        zone: 1
        erg_mode: false
      - segment: main
        sets: 6
        duration_min: 1
        zone: 4
        effort_descriptor: "Öka trycket under minuten: börja strax under tröskeln (nedre Z4, ≈95 % av FTP) och sluta strax över (mitten/övre Z4, ≈103 % av FTP). Håll 55-65 varv/min hela intervallen."
        cadence_rpm: [55, 65]
        rest_sec: 180
      - segment: cooldown
        duration_pct: 0.20
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 50
      flexible_range: [40, 65]
    zone_refs: [Z1, Z4]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Smärta i knäna → avbryt"
      - "Trampfrekvensen glider över 70 varv/min när det är som tyngst → intervallen räknas inte"
    coach_notes: |
      Effort_descriptor används pga stegringen — passet är inte fast
      watt-target. ERG-läge med "ramp" inom varje rep är idealt men kräver
      manuell utdesign i Garmin Connect; alternativt kör fast watt (97% FTP)
      hela repet.

  - code: MF1_bike_03
    discipline: bike
    category: MF
    type_code: MF1
    name: "Seg växel i backe — 5×3 min"
    phase_appropriate: [base_2, base_3, build_1]
    parameterized: true
    parameters:
      duration_min:
        default: 60
        range: [50, 80]
        description: "5 × 3 min + 4 × 4 min vila = 31 min fasta reps."
    intent: |
      Kraftintervaller utomhus. Hitta en lång, flack uppförsbacke (3-6 %
      lutning, 3-5 min lång). Trampa upp hårt (Z3-Z4) med medvetet långsam
      trampfrekvens. Styrkan märks direkt på vägen, eftersom du sitter och
      spänner bålen precis som när du cyklar annars.
    setting: outdoor
    terrain: hilly
    outdoor_only: true
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.25
        zone: 1
        description: "Räkna in turen till backens fot"
      - segment: main
        sets: 5
        duration_min: 3
        zone: 4
        cadence_rpm: [55, 65]
        rest_sec: 240
        description: |
          Uppför hårt, nära tröskeln (Z4), med 55-65 varv/min. Sitt kvar i
          sadeln — att stå upp är inte poängen. Rulla ned igen; det ger 4 min
          vila före nästa.
      - segment: cooldown
        duration_pct: 0.17
        zone: 1
    total_duration_min:
      estimated: 60
      flexible_range: [50, 80]
    zone_refs: [Z1, Z4]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Smärta i knäna → avbryt"
      - "Trampfrekvensen går över 75 varv/min fast du försöker hålla den nere → trampa lite lättare eller välj en brantare backe"
    coach_notes: |
      Mer realistisk styrkeöverföring än trainer-versionen — men kräver
      rätt backe: 1-3 min lång, jämn lutning på 5-8 %. Backens längd avgör
      vilken kadens som faktiskt går att hålla i Z4-watt.

  # ─────────────────────────────────────────────────────────────
  # MF2 — Hilly Ride
  # ─────────────────────────────────────────────────────────────

  - code: MF2_bike_01
    discipline: bike
    category: MF
    type_code: MF2
    name: "Kuperad runda — backarna gör jobbet"
    phase_appropriate: [base_2, base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 90
        range: [60, 240]
        description: "Helt continuous-pass — totalen styr volymen direkt. Lågvolym-adept: 60-75."
    intent: |
      Lång tur i kuperad terräng. Backarna ger benen styrketräning av sig
      själva — du behöver inte räkna intervaller. Över hela passet blir det
      lugnt till lätt tempo i snitt (Z2-nedre Z3); enskilda backar blir
      hårdare (Z3-Z4). Du bygger både styrka och uthållighet — två flugor i
      en smäll.
    setting: outdoor
    terrain: hilly
    outdoor_only: true
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.17
        zone: 1
        description: "Välj platta vägar om det går"
      - segment: continuous
        duration_pct: 0.72
        zone: 2
        cadence_rpm: [75, 95]
        description: |
          Kuperad runda med 5-10 backar (1-4 min styck). I backarna får det
          bli hårt (Z3-Z4) och trampfrekvensen sjunka mot 70-75 varv/min.
          Mellan backarna: cykla lugnt (Z2) och hämta dig.
      - segment: cooldown
        duration_pct: 0.11
        zone: 1
    total_duration_min:
      estimated: 90
      flexible_range: [60, 240]
    zone_refs: [Z1, Z2, Z3, Z4]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Backarna tvingar dig upp i maxansträngning (Z5) gång på gång → välj en plattare runda eller ta backarna lugnare"
    coach_notes: |
      Bättre verkligheten än indoor MF1 — naturlig variation i kadens, hr,
      watt. Kräver tillgång till kuperad terräng (rullande rutt med
      återkommande 1-5 min-backar). Är tävlingsbanan platt är passet inte
      tävlingsspecifikt, men styrkeadaptionen överförs.

  - code: MF2_bike_02
    discipline: bike
    category: MF
    type_code: MF2
    name: "Kuperad långtur — jaga backarna i mitten"
    phase_appropriate: [base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 120
        range: [90, 180]
        description: |
          Helt continuous. 30-min-blocket är en pct-andel — om totalen
          krymper proportionellt så krymper det. Bevara strukturen.
    intent: |
      Lång tur i kuperad terräng med ett 30-minutersblock där du kör
      backarna hårt. Första timmen är en vanlig kuperad tur och fungerar som
      uppvärmning. Under andra timmen letar du upp backarna och kör dem
      hårdare; de sista 30 min tar du det lugnt. Lika mycket träning för
      huvudet som för benen: hur orkar du trycka på i backe 5 av 8?
    setting: outdoor
    terrain: hilly
    outdoor_only: true
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: continuous
        duration_pct: 0.38
        zone: 2
        cadence_rpm: [80, 95]
        description: "Lugnt i kuperad terräng — i backarna får det bli tyngre, upp till Z3"
      - segment: continuous
        duration_pct: 0.25
        zone: 3
        effort_descriptor: "Tempo i snitt (Z3), hårdare (Z4) en kort stund i backarna. Hitta 4-6 backar på 1-3 min styck — tryck på."
        cadence_rpm: [70, 90]
        description: "Här jagar du backarna i stället för att bara rulla över dem"
      - segment: continuous
        duration_pct: 0.16
        zone: 2
        cadence_rpm: [85, 95]
        description: "Varva ned lugnt, gärna på plattare vägar"
      - segment: cooldown
        duration_pct: 0.08
        zone: 1
    total_duration_min:
      estimated: 120
      flexible_range: [90, 180]
    zone_refs: [Z1, Z2, Z3, Z4]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Du orkar inte hålla trycket de sista 10 min av blocket (snittwatten mer än 10 % lägre) → avsluta blocket tidigt och fortsätt lugnt (Z2)"
    coach_notes: |
      För adepter som redan har MF2_bike_01 inkört. Stoppat block tvingar
      fram styrke-fokus tydligare än bara "kupperad rutt". Bra build_1-pass.

  # ─────────────────────────────────────────────────────────────
  # MF3 — Hill Repeats
  # ─────────────────────────────────────────────────────────────

  - code: MF3_bike_01
    discipline: bike
    category: MF
    type_code: MF3
    name: "Backintervaller 5×4 min"
    phase_appropriate: [base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 75
        range: [60, 100]
        description: "5 × 4 min + 4 × 5 min vila = 40 min fasta reps."
    intent: |
      Backintervaller. Hitta en backe som tar ungefär 4 min att cykla upp
      (oftast 1-1,5 km, 4-7 % i snitt). Trampa upp på tröskeln — den
      ansträngning du orkar hålla i ungefär en timme (mitten av Z4).
      Lutningen ger styrka och tiden på tröskeln ger uthållighet i hög
      fart. Ett av de bästa cykelpassen när du bygger upp inför en Ironman.
    setting: outdoor
    terrain: hilly
    outdoor_only: true
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.20
        zone: 1
        description: "Räkna in turen till backens fot; lägg in 2 min lugnt (Z2) mot slutet"
      - segment: main
        sets: 5
        duration_min: 4
        zone: 4
        cadence_rpm: [70, 85]
        rest_sec: 300
        description: |
          På tröskeln, mitt i Z4 (≈100 % av FTP). Trampfrekvensen får sjunka
          mot 70 varv/min om backen är brant. Sitt kvar i sadeln så mycket du
          kan. Vila: rulla ned och cykla lugnt innan nästa.
      - segment: cooldown
        duration_pct: 0.13
        zone: 1
    total_duration_min:
      estimated: 75
      flexible_range: [60, 100]
    zone_refs: [Z1, Z4]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Du orkar inte hålla nivån i intervall 4-5 (watten mer än 15 % lägre än i första) → hoppa över resten"
      - "Pulsen har inte sjunkit till Z2 inom 4 min efter en intervall → vila längre eller avbryt"
    coach_notes: |
      MF3 är ME-träning i förklädnad — backens lutning lägger på styrke-
      momentum. Bra för adepter som behöver bygga både kraft och tröskel
      utan att dubblera pass. Kräver rätt backe: 6-8 min i jämn lutning.

  - code: MF3_bike_02
    discipline: bike
    category: MF
    type_code: MF3
    name: "Backintervaller 8×3 — sitt och stå"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 80
        range: [70, 100]
        description: "8 × 3 min + 7 × 4 min vila = 52 min fasta reps."
    intent: |
      Backintervaller där du medvetet växlar mellan att sitta och stå. Det
      bygger både uthållighet i musklerna och teknik — på en Ironman
      behöver du ibland stå upp för att avlasta sätet och ryggen. Sitt
      mest; stå 20-30 sek per intervall.
    setting: outdoor
    terrain: hilly
    outdoor_only: true
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.19
        zone: 1
      - segment: main
        sets: 8
        duration_min: 3
        zone: 4
        cadence_rpm: [70, 90]
        rest_sec: 240
        description: |
          Hårt, nära tröskeln (nedre-mitten Z4). Stå upp 2 × 30 sek i varje
          intervall — t.ex. 30 sek sitt, 30 sek stå, 60 sek sitt, 30 sek stå,
          30 sek sitt. Håll samma ansträngning hela intervallen trots bytena.
      - segment: cooldown
        duration_pct: 0.13
        zone: 1
    total_duration_min:
      estimated: 80
      flexible_range: [70, 100]
    zone_refs: [Z1, Z4]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Ont i ryggen när du sitter och trampar → byt till en lugn tur utan backar"
      - "Det blir maxhårt (Z5) när du står → du trycker för hårt, ta det lugnare"
    coach_notes: |
      Kombinerar MF3 med teknisk variation. Bra för adepter som redan har
      MF3_bike_01 inkört och behöver progression. OBS: vid pågående
      ryggrehab — stäm av stå-tramp med fysio innan passet väljs.

  - code: MF3_bike_03
    discipline: bike
    category: MF
    type_code: MF3
    name: "Långa klättringar 3×8 min"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 75
        range: [60, 100]
        description: "3 × 8 min + 2 × 6 min vila = 36 min fasta reps."
    intent: |
      Längre backintervaller strax under tröskeln — den ansträngning du
      orkar hålla i ungefär en timme (övre Z3 / nedre Z4). Du lär dig hålla
      en jämn, hög ansträngning länge i 6-8 % lutning — precis det du
      behöver i branta partier på tävlingen. I en lång backe gäller det att
      hålla huvudet kallt; det är lätt att rusa iväg de första 2 minuterna.
    setting: outdoor
    terrain: hilly
    outdoor_only: true
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.20
        zone: 1
      - segment: main
        sets: 3
        duration_min: 8
        zone: 4
        effort_descriptor: "Strax under tröskeln (88-93 % av FTP, övre Z3 / nedre Z4) i backen. Hitta nivån och håll den. Du andas kontrollerat och kan prata i korta meningar."
        cadence_rpm: [70, 85]
        rest_sec: 360
        description: "Vila: rulla ned och cykla 2-3 min lätt (Z1-Z2) på platten innan nästa"
      - segment: cooldown
        duration_pct: 0.13
        zone: 1
    total_duration_min:
      estimated: 75
      flexible_range: [60, 100]
    zone_refs: [Z1, Z2, Z3, Z4]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Du orkar inte hålla nivån i intervall 3 (snittwatten mer än 10 % lägre än i första) → avbryt intervallen"
    coach_notes: |
      Mer aerobt än MF3_bike_01 (Sweet Spot vs ren tröskel). Bra "stark
      build_2-pass" som inte är fullt tröskelarbete men tar styrke-dosen.
      Kräver lång backe (minst 2 km) — saknas sådan lokalt: kör ramp på
      trainer (men då tappar man backe-realismen).
