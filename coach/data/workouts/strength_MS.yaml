# Styrkepass — Max Strength (MS)
#
# Protokoll MS enligt strength.yaml. Passar base_1 (andra halvan),
# base_2, base_3. A/B-split: alternera 01 och 02 inom veckan.
#
# LAST-MODELL (fork 2, bekräftad): ingen absolut kg i banken. Varje block
# anger reps + RIR (reps in reserve). Adepten väljer vikt som matchar
# RIR:et, loggar den, och progredierar nästa gång samma RIR nås vid lägre
# ansträngning. Detta ÄR autoreglering — dålig dagsform → kör med högre RIR
# (lättare), aldrig hoppat pass. load_pct anges som referens mot loggad
# arbetsvikt, inte mot 1RM.
#
# KONTRAINDIKATIONS-SWAP (fork 3, bekräftad): varje block kan ha `alt` —
# en ersättningsövning som renderaren byter in om primärövningens flagga
# matchar adeptens aktiva tillstånd. Exempel: en adept med
# biceps_tendon, shoulder eller overhead_loading flaggad får tunga
# vertikaldrag och overhead-press utbytta automatiskt.
#
# READINESS-GATE: samma regel som övriga banken. readiness < 30 →
# rendera RIR +1 (lättare) eller dra ett block. Loggas som manual_override
# om coachen ändrar manuellt.

workouts:

  # ─────────────────────────────────────────────────────────────
  # MS_strength_01 — Helkropp A (knädominant + horisontell drag/press)
  # ─────────────────────────────────────────────────────────────

  - code: MS_strength_01
    discipline: strength
    category: ST
    type_code: MS
    name: "Tung styrka — hela kroppen A"
    parametrized: true
    parameters:
      sets:
        default: 3
        range: [2, 4]
        description: "Arbetsset per huvudövning; skala mot veckans volym och dagsform"
      reps:
        default: 6
        range: [5, 8]
        description: "MS-spann. Base-fas kan vidgas mot 8–10 för mer styrkeuthållighet"
      rir:
        default: 2
        range: [1, 4]
        description: "Reps in reserve. Lägre = tyngre. Readiness-gate höjer RIR vid låg form"
    phase_appropriate: [base_1, base_2, base_3]
    intent: |
      Tung styrka för hela kroppen: ben, rodd och bröstpress. Mest
      maskiner, så att du kan ta i nära gränsen utan risk. Kvalitet före
      vikt — välj vikten efter hur många du ska orka till, inte tvärtom.
      Bålen sist.
    main_set:
      - segment: warmup
        type: general
        duration_min: 8
        description: "Lätt cykling eller rodd, dynamisk höftböjarstretch och diagonallyft på alla fyra, 2 omgångar à 8 per sida"

      - segment: strength_block
        order: 1
        exercise: leg_press_machine
        prescription: {sets: 3, reps: 6, rir: 2, rest_sec: 150}
        load_pct: "tung arbetsvikt"
        alt: goblet_squat
        note: "Passets viktigaste övning. Hela rörelsen, men inte så djupt att ländryggen släpper från dynan."

      - segment: strength_block
        order: 2
        exercise: seated_row_machine
        prescription: {sets: 3, reps: 8, rir: 2, rest_sec: 120}
        load_pct: "måttlig–tung"
        alt: chest_press_machine
        note: "Handflatorna mot varandra, det skonar bicepssenan. Känns senan av: byt till bröstpress."

      - segment: strength_block
        order: 3
        exercise: chest_press_machine
        prescription: {sets: 3, reps: 8, rir: 2, rest_sec: 120}
        load_pct: "måttlig–tung"
        note: "Sänk handtagen eller sätet om det skaver i axeln. Har du ont i axeln: hoppa över övningen."

      - segment: strength_block
        order: 4
        exercise: pallof_press
        prescription: {sets: 2, reps: 10, rir: 3, rest_sec: 60}
        load_pct: "lätt–måttlig"
        note: "Håll bålen stilla när kabeln drar dig åt sidan. 10 per sida."

      - segment: cooldown
        type: mobility
        duration_min: 5
        description: "Bröstryggsrotation, 8 per sida, och lätt rörlighet"

    total_duration_min:
      estimated: 45
      flexible_range: [35, 55]
    zone_refs: []
    load_model: rir
    equipment: [leg_press, seated_row, chest_press, cable, dumbbell]
    abort_conditions:
      - "Känns det i bicepssenan: avbryt rodden och byt till bröstpress."
      - "Nyper det i axeln i pressen: gå inte lika djupt, eller hoppa över övningen."
      - "Låg dagsform (readiness under 30): välj så lätt vikt att du orkar en till utöver det som står, eller hoppa över bröstpressen."
    coach_notes: |
      I aktuell rebuild-vecka: kör övre delen av RIR-spannet (3–4) och
      2 set. Tyngsta MS-uttaget sparas till du är stabilt grön. Latsdrag
      och overhead saknas medvetet i A-passet — de bor i B och gate:as
      ändå bort just nu.

  # ─────────────────────────────────────────────────────────────
  # MS_strength_02 — Helkropp B (höftfällning + enben + vertikaldrag)
  # ─────────────────────────────────────────────────────────────

  - code: MS_strength_02
    discipline: strength
    category: ST
    type_code: MS
    name: "Tung styrka — hela kroppen B"
    parametrized: true
    parameters:
      sets:
        default: 3
        range: [2, 4]
        description: "Arbetsset per huvudövning"
      reps:
        default: 6
        range: [5, 8]
        description: "MS-spann"
      rir:
        default: 2
        range: [1, 4]
        description: "Reps in reserve; readiness-gate höjer vid låg form"
    phase_appropriate: [base_1, base_2, base_3]
    intent: |
      Kompletterar pass A. Baksida lår och säte, ett ben i taget och drag
      uppifrån. Stark baksida och jämna sidor skyddar mot löpskador. Har
      du besvär i bicepssenan byts latsdraget ut.
    main_set:
      - segment: warmup
        type: general
        duration_min: 8
        description: "Lätt rodd, dynamisk höftböjarstretch och dead bug, 2 omgångar à 8 per sida"

      - segment: strength_block
        order: 1
        exercise: romanian_deadlift
        prescription: {sets: 3, reps: 6, rir: 2, rest_sec: 150}
        load_pct: "tung arbetsvikt"
        alt: leg_curl_machine
        note: "Passets viktigaste övning. Har du besvär i ryggen eller bröstryggen: byt till bencurl."

      - segment: strength_block
        order: 2
        exercise: lat_pulldown_machine
        prescription: {sets: 3, reps: 8, rir: 2, rest_sec: 120}
        load_pct: "måttlig"
        alt: straight_arm_pulldown
        note: "Känns det i bicepsen: byt till latsdrag med raka armar, som inte tar på bicepsen."

      - segment: strength_block
        order: 3
        exercise: bulgarian_split_squat
        prescription: {sets: 3, reps: 8, rir: 3, rest_sec: 90}
        load_pct: "måttlig"
        alt: step_up
        note: "8 per ben. Här jämnar du ut skillnader mellan sidorna."

      - segment: strength_block
        order: 4
        exercise: side_plank
        prescription: {sets: 2, reps: 1, rir: 2, rest_sec: 45}
        load_pct: "kroppsvikt, isometrisk hålltid"
        alt: dead_bug
        note: "Håll 20–40 s per sida. Känns det i axeln: byt till dead bug."

      - segment: cooldown
        type: mobility
        duration_min: 5
        description: "Bröstryggsrotation och höftböjarstretch"

    total_duration_min:
      estimated: 45
      flexible_range: [35, 55]
    zone_refs: []
    load_model: rir
    equipment: [barbell, dumbbell, leg_curl, lat_pulldown, bench]
    abort_conditions:
      - "Känns det i ländryggen i marklyftet: byt till bencurl och se över tekniken."
      - "Känns det i bicepssenan: byt latsdraget mot rodd."
      - "Låg dagsform (readiness under 30): välj så lätt vikt att du orkar en till utöver det som står, eller hoppa över bulgarisk utfallsknäböj."
    coach_notes: |
      RDL är flaggad för ländrygg/bröstrygg — i din nuvarande thorakala
      situation, börja med leg curl-varianten tills naprapaten gett klartecken.
      Landmine_press kan läggas till som valfritt block om du vill ha press
      över huvud säkert — overhead-maskinen gör vi inte nu.
