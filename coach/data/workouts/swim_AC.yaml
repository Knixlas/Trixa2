# Simpass — Aerob Kapacitet (AC)
#
# AC1 — VO2Max Intervals: korta hårda intervaller på Z5
# AC2 — Aerobic Capacity Intervals: något längre intervaller på Z5/Z4-gräns
#
# Detta är passen som lyfter taket. Hårt, kort, högkvalitativt.
# Vid större budget: fler intervaller + längre aktiv recovery i Z1
# efter setet. Aldrig "mer Z5" som absorberare — det är vägen till överträning.

workouts:

  # ─────────────────────────────────────────────────────────────
  # AC1 — VO2Max Intervals
  # ─────────────────────────────────────────────────────────────

  - code: AC1_swim_01
    discipline: swim
    category: AC
    type_code: AC1
    name: "16 × 50 m stenhårt — pulsen i taket"
    parameterized: true
    parameters:
      duration_min:
        default: 50
        range: [35, 75]
        description: "Skala till veckans budget"
    phase_appropriate: [build_1, build_2, peak]
    intent: |
      Maxintervaller. 50 m är kort nog för att du kan ta i så hårt det
      går (Z5) och lång nog för att pulsen hinner upp ordentligt. Den
      korta vilan håller pulsen hög genom alla intervaller.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: build
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
        description: "Öka farten under varje 50 m, från lugnt (Z2) till hårt (Z4). Väck kroppen."
      - segment: sprint
        sets: {default: 16, range: [10, 24]}
        distance_m: 50
        zone: 5
        rest_sec: 20
        description: "Mycket hårt (Z5), fortare än du skulle simma 200 m på tävling. Andas så sällan du kan."
      - segment: continuous
        duration_pct: 0.10
        zone: 1
        description: "Mycket lugn frisim (Z1), låt pulsen sjunka"
      - segment: cooldown
        duration_pct: 0.15
        zone: 1
    total_distance_m: 2000
    total_duration_min:
      estimated: 50
      flexible_range: [35, 75]
    zone_refs: [Z1, Z2, Z4, Z5]
    equipment: []
    abort_conditions:
      - "Går en 50 m mer än 3 s per 100 m långsammare än din snabbaste: simma resten lugnare (Z3). Då är det inte maxintervaller längre."

  - code: AC1_swim_02
    discipline: swim
    category: AC
    type_code: AC1
    name: "Halvgrymma 75:or — tolv stycken"
    parameterized: true
    parameters:
      duration_min:
        default: 50
        range: [35, 75]
        description: "Skala till veckans budget"
    phase_appropriate: [build_2, peak]
    intent: |
      75 m är halvgrymt: längre än 50 m men kort nog för att du orkar
      hålla mycket hårt (Z5) hela vägen. Du bygger förmågan att orka
      nära max lite längre.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: build
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 10
      - segment: sprint
        sets: {default: 12, range: [8, 18]}
        distance_m: 75
        zone: 5
        rest_sec: 30
        description: "Mycket hårt (Z5), de sista 25 m ska kosta. Andas på vart femte tag de första 50 m, sedan på vart tredje."
      - segment: continuous
        duration_pct: 0.08
        zone: 1
        description: "Lugn simning efter intervallerna, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.12
        zone: 1
    total_distance_m: 2000
    total_duration_min:
      estimated: 50
      flexible_range: [35, 75]
    zone_refs: [Z1, Z2, Z4, Z5]
    equipment: []

  - code: AC1_swim_03
    discipline: swim
    category: AC
    type_code: AC1
    name: "Tabata i bassängen — korta smällar"
    parameterized: true
    parameters:
      duration_min:
        default: 40
        range: [30, 55]
        description: "Smal range — protokollet med två set + mellanvila är hjärtat i passet"
    phase_appropriate: [build_2, peak]
    intent: |
      Mycket korta, mycket hårda intervaller. Inte riktig Tabata (det
      fyra minuter långa upplägget fungerar inte i bassäng), men samma
      tanke: allt du har i varje intervall och väldigt kort vila.
    main_set:
      - segment: warmup
        duration_pct: 0.18
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: sprint
        sets: {default: 8, range: [6, 10]}
        distance_m: 25
        zone: 5
        rest_sec: 15
        description: "Allt du har, 15 s vila. Bara 8, det räcker."
      - segment: main
        sets: 1
        distance_m: 200
        zone: 1
        rest_sec: 90
        description: "Mycket lugnt, som vila. Pulsen ska ner innan nästa omgång."
      - segment: sprint
        sets: {default: 8, range: [6, 10]}
        distance_m: 25
        zone: 5
        rest_sec: 15
        description: "Omgång 2: lika hårt fast du är trött"
      - segment: cooldown
        duration_pct: 0.20
        zone: 1
    total_distance_m: 1400
    total_duration_min:
      estimated: 40
      flexible_range: [30, 55]
    zone_refs: [Z1, Z5]
    equipment: []
    abort_conditions:
      - "Går början av omgång 2 mer än 2 s per 100 m långsammare än början av omgång 1: hoppa över omgång 2"

  # ─────────────────────────────────────────────────────────────
  # AC2 — Aerobic Capacity Intervals
  # ─────────────────────────────────────────────────────────────

  - code: AC2_swim_01
    discipline: swim
    category: AC
    type_code: AC2
    name: "8 × 100 m max — vila lika länge som du simmar"
    parameterized: true
    parameters:
      duration_min:
        default: 55
        range: [40, 80]
        description: "Skala till veckans budget"
    phase_appropriate: [build_1, build_2, peak]
    intent: |
      Längre maxintervaller: 100 m med lika lång vila som det tar att
      simma dem. Den långa vilan gör att du orkar mycket hårt (Z5) på
      alla åtta. Med kortare vila skulle det spricka efter fyra–fem.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: build
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 10
      - segment: sprint
        sets: {default: 8, range: [6, 12]}
        distance_m: 100
        zone: 5
        rest_sec: 90
        description: "Mycket hårt (Z5), ungefär den fart du skulle simma 400 m på tävling. Vila lika länge som du simmar."
      - segment: continuous
        duration_pct: 0.08
        zone: 1
        description: "Lugn simning efter intervallerna, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.12
        zone: 1
    total_distance_m: 2100
    total_duration_min:
      estimated: 55
      flexible_range: [40, 80]
    zone_refs: [Z1, Z5]
    equipment: []

  - code: AC2_swim_02
    discipline: swim
    category: AC
    type_code: AC2
    name: "6 × 150 m — långa hårda, precis på gränsen"
    parameterized: true
    parameters:
      duration_min:
        default: 55
        range: [40, 80]
        description: "Skala till veckans budget"
    phase_appropriate: [build_2, peak]
    intent: |
      Längre maxintervaller. 150 m är ungefär så långt du kan hålla
      mycket hårt (Z5) när du är tränad. Kortare och du får inte ut
      allt av passet, längre och du halkar ner i Z4.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: build
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 10
      - segment: sprint
        sets: {default: 6, range: [4, 9]}
        distance_m: 150
        zone: 5
        rest_sec: 90
      - segment: continuous
        duration_pct: 0.08
        zone: 1
        description: "Lugn simning efter intervallerna, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.12
        zone: 1
    total_distance_m: 2000
    total_duration_min:
      estimated: 55
      flexible_range: [40, 80]
    zone_refs: [Z1, Z5]
    equipment: []

  - code: AC2_swim_03
    discipline: swim
    category: AC
    type_code: AC2
    name: "10 × 100 m i två block — hårt, sen hårdare"
    parameterized: true
    parameters:
      duration_min:
        default: 55
        range: [40, 80]
        description: "Skala till veckans budget"
    phase_appropriate: [build_1, build_2]
    intent: |
      Från hårt (Z4) till mycket hårt (Z5). Du lär dig öka farten
      kontrollerat. Det hjälper på tävling, där det är lätt att gå ut
      för hårt.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: main
        sets: {default: 5, range: [3, 7]}
        distance_m: 100
        rest_sec: 30
        zones_per_set: [4, 4, 4, 4, 4]
        description: "Block 1: alla hårt (Z4)"
      - segment: main
        sets: {default: 5, range: [3, 7]}
        distance_m: 100
        rest_sec: 45
        zones_per_set: [5, 5, 5, 5, 5]
        description: "Block 2: alla mycket hårt (Z5). Känn skillnaden mot block 1."
      - segment: continuous
        duration_pct: 0.20
        zone: 1
        description: "Lugn simning efter intervallerna, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.15
        zone: 1
    total_distance_m: 2100
    total_duration_min:
      estimated: 55
      flexible_range: [40, 80]
    zone_refs: [Z1, Z4, Z5]
    equipment: []
    coach_notes: |
      Bra som indikator-pass. Splits berättar om Z4-Z5-gränsen
      är kalibrerad rätt mot adeptens CSS.
