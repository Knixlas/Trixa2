# Simpass — Muskulär Styrka (MF)
#
# MF1 — Muscular Force Reps: kraft i armtag, ofta med paddles/band/buoy
# MF2 — Open Water Current Intervals: simning mot motstånd i öppet vatten
# MF3 — Paddles: tunga paddel-set
#
# Gemensamt: fokus är att producera kraft per tag, inte hög stroke-rate.
# Stroke-count räknas ofta för att hålla effektivitet. MF2-passen har
# kortare default-tid då yttre faktorer (ström, vågor) styr passets längd.

workouts:

  # ─────────────────────────────────────────────────────────────
  # MF1 — Muscular Force Reps
  # ─────────────────────────────────────────────────────────────

  - code: MF1_swim_01
    discipline: swim
    category: MF
    type_code: MF1
    name: "Teknik-50:or — hitta taget"
    parameterized: true
    parameters:
      duration_min:
        default: 26
        range: [22, 55]
        description: "Skala till veckans budget"
    phase_appropriate: [base_2, base_3, build_1]
    intent: |
      Kraft i varje tag. Ta få, långa tag och greppa vattnet tidigt,
      direkt när handen gått i. Farten är inte målet, kraften är det.
      Räkna tag per längd och försök få ner antalet under passet.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
        drills: [sculling_front, fist_swim, catch_drill]
        description: "Vänj dig vid känslan av att ta tag i vattnet tidigt"
      - segment: main
        sets: {default: 8, range: [6, 14]}
        distance_m: 50
        zone: 2
        rest_sec: 25
        description: "Greppa vattnet ordentligt och ta få tag. Räkna tagen och försök hålla eller minska antalet."
        notes: "Pace ska INTE pressas. Fokus på kraften per tag."
      - segment: continuous
        duration_pct: 0.10
        zone: 1
        description: "Lugn frisim, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
    total_distance_m: 1800
    total_duration_min:
      estimated: 26
      flexible_range: [22, 55]
    zone_refs: [Z1, Z2]
    equipment: []
    coach_notes: |
      Bra som komplement till tempo-pass i samma vecka — bygger den
      styrkan som tempon kommer att kräva utan ackumulerad belastning.

  - code: MF1_swim_02
    discipline: swim
    category: MF
    type_code: MF1
    name: "Styrkepass med handpaddlar och dolme"
    parameterized: true
    parameters:
      duration_min:
        default: 35
        range: [30, 65]
        description: "Skala till veckans budget"
    phase_appropriate: [base_2, base_3, build_1, build_2]
    intent: |
      Styrkepass för armarna: bara armtag med dolme och handpaddlar.
      Dolmen håller benen uppe och paddlarna ger mycket mer motstånd.
      Lugn fart, fokus på kraften i draget.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
        drills: [sculling_front, catch_drill]
      - segment: pull
        sets: {default: 6, range: [4, 10]}
        distance_m: 100
        zone: 2
        rest_sec: 25
        equipment: [pull_buoy, paddles]
        description: "Bara armtag med dolme och handpaddlar. Långa drag, ta tag i vattnet. Farten ska kännas långsam, det är meningen."
      - segment: main
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        zone: 2
        rest_sec: 15
        description: "Utan utrustning. Försök behålla känslan av långa drag."
      - segment: continuous
        duration_pct: 0.08
        zone: 1
        description: "Lugn simning, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
    total_distance_m: 2000
    total_duration_min:
      estimated: 35
      flexible_range: [30, 65]
    zone_refs: [Z1, Z2]
    equipment: [pull_buoy, paddles]
    abort_conditions:
      - "Gör det ont i axeln eller armbågen: ta av handpaddlarna och fortsätt utan utrustning, eller avsluta passet"

  - code: MF1_swim_03
    discipline: swim
    category: MF
    type_code: MF1
    name: "Bara armar — sim med ankelband"
    parameterized: true
    parameters:
      duration_min:
        default: 28
        range: [22, 50]
        description: "Skala till veckans budget"
    phase_appropriate: [base_3, build_1, build_2]
    intent: |
      Med band runt anklarna kan du inte använda benspark. Armarna
      måste ta dig framåt och hålla höften uppe. Bygger styrka i både
      bål och armtag. Hårt men kort.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 15
      - segment: pull
        sets: {default: 8, range: [5, 14]}
        distance_m: 50
        zone: 2
        rest_sec: 20
        equipment: [band]
        description: "Bara ankelband, ingen dolme och inga handpaddlar. Håll kroppen spänd och ta snabba tag."
      - segment: continuous
        duration_pct: 0.10
        zone: 1
        description: "Lugn simning utan utrustning"
      - segment: cooldown
        duration_pct: 0.13
        zone: 1
        description: "Lugn frisim utan utrustning. Känn vad bensparken gör nu."
    total_distance_m: 1500
    total_duration_min:
      estimated: 28
      flexible_range: [22, 50]
    zone_refs: [Z1, Z2]
    equipment: [band]
    coach_notes: |
      Det här passet är hårdare än det ser ut. Att simma utan kick är
      core-arbete i förklädnad. Stoppa om höften börjar sjunka och
      tekniken bryts.

  # ─────────────────────────────────────────────────────────────
  # MF2 — Open Water Current Intervals
  # ─────────────────────────────────────────────────────────────

  - code: MF2_swim_01
    discipline: swim
    category: MF
    type_code: MF2
    name: "Motströms — sim i älv eller å"
    parameterized: true
    parameters:
      duration_min:
        default: 24
        range: [22, 55]
        description: "Skala till veckans budget"
    phase_appropriate: [base_2, base_3, build_1, build_2]
    intent: |
      Du simmar mot strömmen. Den ger ett naturligt motstånd som
      tvingar fram kraftigare tag. Det du kan mäta är sträckan; tid
      och fart säger inget i strömmande vatten.
    main_set:
      - segment: warmup
        duration_pct: 0.10
        zone: 1
        description: "Lugnt med strömmen, så att kroppen mjuknar"
      - segment: main
        sets: {default: 6, range: [4, 12]}
        distance_m: 100
        zone: 3
        rest_sec: 45
        description: "Simma 100 m mot strömmen. Vila genom att flyta tillbaka."
      - segment: continuous
        duration_pct: 0.10
        zone: 1
        description: "Lugnt, flyt med strömmen"
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
        description: "Med strömmen, lugnt"
    total_distance_m: 1000
    total_duration_min:
      estimated: 24
      flexible_range: [22, 55]
    zone_refs: [Z1, Z3]
    equipment: []
    abort_conditions:
      - "Är strömmen starkare än 0,5 m/s blir passet ineffektivt. Välj en plats där det flyter lagom."
      - "Är vattnet kallare än 14 °C: simma bara med våtdräkt"
    coach_notes: |
      Bra säsongsöppning för öppet-vatten-känsla. Säkerhet:
      simma med sällskap, känn till platsen, ha plan för utstigning.

  - code: MF2_swim_02
    discipline: swim
    category: MF
    type_code: MF2
    name: "Vågsim — lär dig gilla krabb sjö"
    parameterized: true
    parameters:
      duration_min:
        default: 28
        range: [22, 50]
        description: "Skala till veckans budget"
    phase_appropriate: [build_1, build_2, peak]
    intent: |
      Simning i sjö eller hav när det är vågor. Inte bara styrka: du
      lär dig anpassa tekniken till hur det kan vara på en tävling.
      Ta kortare och snabbare tag.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
        description: "Lugnt, längs stranden om det går"
      - segment: main
        sets: {default: 4, range: [3, 8]}
        distance_m: 200
        zone: 3
        rest_sec: 60
        description: "Byt riktning: två gånger mot vågorna, två med. Anpassa tagen och andningen."
      - segment: continuous
        duration_pct: 0.08
        zone: 1
        description: "Lugn simning med vågorna"
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
    total_distance_m: 1300
    total_duration_min:
      estimated: 28
      flexible_range: [22, 50]
    zone_refs: [Z1, Z3]
    equipment: []
    abort_conditions:
      - "Blir sjön grövre än du räknat med: avbryt"
      - "Simma aldrig ensam i öppet vatten"

  - code: MF2_swim_03
    discipline: swim
    category: MF
    type_code: MF2
    name: "Sim på stället — band i bassängkanten"
    parameterized: true
    parameters:
      duration_min:
        default: 20
        range: [22, 50]
        description: "Skala till veckans budget"
    phase_appropriate: [base_2, base_3, build_1]
    intent: |
      När du inte kan simma i öppet vatten: skapa motstånd genom att
      simma i en motströmsbassäng, eller med ett band fäst i
      bassängkanten.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
      - segment: main
        sets: {default: 8, range: [5, 14]}
        distance_m: 50
        zone: 3
        rest_sec: 30
        equipment: [band]
        description: "Bandet fäst i kanten. Simma på stället så långt bandet låter dig, lika länge som du brukar simma 50 m."
      - segment: continuous
        duration_pct: 0.10
        zone: 1
        description: "Lugn simning utan band"
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
    total_distance_m: 1000
    total_duration_min:
      estimated: 20
      flexible_range: [22, 50]
    zone_refs: [Z1, Z3]
    equipment: [band]
    coach_notes: |
      Substitut för MF2_swim_01/02 vinterhalvåret. Inte lika
      effektivt som riktigt strömvatten men bättre än ingenting.

  # ─────────────────────────────────────────────────────────────
  # MF3 — Paddles
  # ─────────────────────────────────────────────────────────────

  - code: MF3_swim_01
    discipline: swim
    category: MF
    type_code: MF3
    name: "8 × 100 m med handpaddlar — tunga drag"
    parameterized: true
    parameters:
      duration_min:
        default: 36
        range: [28, 60]
        description: "Skala till veckans budget"
    phase_appropriate: [base_2, base_3, build_1, build_2]
    intent: |
      Intervaller med handpaddlar. Tunga drag: ta tag i vattnet tidigt
      och dra hela vägen. Det här är styrketräning, så farten ska inte
      vara hög trots att motståndet ökar.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 15
        drills: [sculling_front, catch_drill]
      - segment: pull
        sets: {default: 8, range: [5, 14]}
        distance_m: 100
        zone: 2
        rest_sec: 25
        equipment: [paddles]
        description: "Stora handpaddlar, ingen dolme. Långa, kraftfulla tag. Andas på vart tredje tag."
      - segment: continuous
        duration_pct: 0.07
        zone: 1
        description: "Lugn simning utan handpaddlar"
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
    total_distance_m: 1800
    total_duration_min:
      estimated: 36
      flexible_range: [28, 60]
    zone_refs: [Z1, Z2]
    equipment: [paddles]
    abort_conditions:
      - "Gör det ont i axeln: sluta direkt, inte 'en till och se'"
      - "Du behöver inte ta många tag. Snurrar armarna fort har du för små handpaddlar eller fel teknik."

  - code: MF3_swim_02
    discipline: swim
    category: MF
    type_code: MF3
    name: "Handpaddlar och dolme — allt snabbare"
    parameterized: true
    parameters:
      duration_min:
        default: 37
        range: [32, 65]
        description: "Skala till veckans budget"
    phase_appropriate: [base_3, build_1, build_2]
    intent: |
      Bara armtag med dolme och handpaddlar, så att armarna gör allt
      jobb. Du ökar farten steg för steg, och det kräver både kraft och
      kontroll. De sista ska kännas tunga, inte snabba.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 15
      - segment: pull
        sets: 5
        distance_m: 200
        rest_sec: 30
        equipment: [pull_buoy, paddles]
        pace_pattern: descending
        zones_per_set: [2, 2, 2, 3, 3]
        description: "Öka farten: två lugnt (Z2), två lite fortare (gränsen Z2–Z3), den sista hårdast (Z3)"
      - segment: continuous
        duration_pct: 0.07
        zone: 1
        description: "Lugn simning utan utrustning"
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
        description: "Utan utrustning"
    total_distance_m: 2100
    total_duration_min:
      estimated: 37
      flexible_range: [32, 65]
    zone_refs: [Z1, Z2, Z3]
    equipment: [pull_buoy, paddles]
    coach_notes: |
      Det här är passet som producerar mest styrkeökning per minut för
      simmare som redan tål paddles. Skala paddel-storlek individuellt.

  - code: MF3_swim_03
    discipline: swim
    category: MF
    type_code: MF3
    name: "Paddelstegen — upp till 200 m och ner"
    parameterized: true
    parameters:
      duration_min:
        default: 33
        range: [30, 55]
        description: "Skala till veckans budget — smal range, stegen är passet"
    phase_appropriate: [base_3, build_1, build_2]
    intent: |
      Handpaddlar på olika långa sträckor, upp till 200 m och ner igen.
      De längre sträckorna tar mer på krafterna och testar hur länge du
      orkar dra med extra motstånd.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 15
      - segment: pull
        sets: 1
        distance_m: 50
        zone: 2
        rest_sec: 15
        equipment: [paddles]
      - segment: pull
        sets: 1
        distance_m: 100
        zone: 2
        rest_sec: 20
        equipment: [paddles]
      - segment: pull
        sets: 1
        distance_m: 150
        zone: 2
        rest_sec: 25
        equipment: [paddles]
      - segment: pull
        sets: 1
        distance_m: 200
        zone: 2
        rest_sec: 30
        equipment: [paddles]
      - segment: pull
        sets: 1
        distance_m: 150
        zone: 2
        rest_sec: 25
        equipment: [paddles]
      - segment: pull
        sets: 1
        distance_m: 100
        zone: 2
        rest_sec: 20
        equipment: [paddles]
      - segment: pull
        sets: 1
        distance_m: 50
        zone: 2
        rest_sec: 0
        equipment: [paddles]
      - segment: continuous
        duration_pct: 0.07
        zone: 1
        description: "Lugn simning utan handpaddlar"
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
    total_distance_m: 2000
    total_duration_min:
      estimated: 33
      flexible_range: [30, 55]
    zone_refs: [Z1, Z2]
    equipment: [paddles]
