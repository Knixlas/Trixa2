# Simpass — Tempo (TE)
#
# TE1 — Tempo Intervals: intervaller i Z3, högre fart än Z2 men sustainable.
# Bygger förmågan att hålla "lite-snabbare-än-IM-pace" över längre samlade set.
#
# Skalning vid större budget: fler intervaller eller längre absorbtion i Z1-Z2.
# Aldrig "mer Z3" som absorberare — då blir det glidning, inte tempoträning.

workouts:

  - code: TE1_swim_01
    discipline: swim
    category: TE
    type_code: TE1
    name: "Tempo på 300 m — bekvämt obekvämt"
    parameterized: true
    parameters:
      duration_min:
        default: 45
        range: [30, 70]
        description: "Skala till veckans budget"
    phase_appropriate: [base_2, base_3, build_1, build_2]
    intent: |
      Klassiskt tempopass (Z3). Tempot är "bekvämt obekvämt" — du vet att
      du jobbar, men du behöver inte bita ihop. Du lär dig hålla farten
      jämn även när tröttheten byggs på.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
        description: "Lugnt igång. De sista 100 m lite piggare (nedre Z2)."
      - segment: drills
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 15
        drills: [single_arm, fingertip_drag, six_kick_switch]
      - segment: build
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 10
        description: "Börja mycket lugnt (Z1) och öka till tempo (Z3). Du hittar tempokänslan."
      - segment: main
        sets: {default: 4, range: [3, 6]}
        distance_m: 300
        zone: 3
        rest_sec: 30
        description: "Jämnt tempo (Z3), bekvämt obekvämt. Andas på vart tredje armtag. Samma fart på alla."
      - segment: continuous
        duration_pct: 0.05
        zone: 1
        description: "Lugn frisim, så att du hämtar dig efter intervallerna"
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
    total_distance_m: 2400
    total_duration_min:
      estimated: 45
      flexible_range: [30, 70]
    zone_refs: [Z1, Z2, Z3]
    equipment: []
    abort_conditions:
      - "Är intervall 3 mer än 3 s per 100 m långsammare än intervall 1: simma intervall 4 lugnt (Z2)"

  - code: TE1_swim_02
    discipline: swim
    category: TE
    type_code: TE1
    name: "6 × 200 m i tempo — vilan är snål"
    parameterized: true
    parameters:
      duration_min:
        default: 40
        range: [30, 65]
        description: "Skala till veckans budget"
    phase_appropriate: [base_3, build_1, build_2]
    intent: |
      Kortare intervaller i tempo (Z3) med kort vila. Pulsen hinner
      aldrig gå ner helt, så du tränar både att hålla tempot och att
      hämta dig snabbt.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 15
        drills: [single_arm, six_kick_switch]
      - segment: main
        sets: {default: 6, range: [4, 10]}
        distance_m: 200
        zone: 3
        rest_sec: 20
        description: "Håll farten jämn. Öka inte på de sista 50 m."
      - segment: continuous
        duration_pct: 0.05
        zone: 1
        description: "Lugn frisim, så att du hämtar dig efter intervallerna"
      - segment: cooldown
        duration_pct: 0.08
        zone: 1
    total_distance_m: 2400
    total_duration_min:
      estimated: 40
      flexible_range: [30, 65]
    zone_refs: [Z1, Z3]
    equipment: []

  - code: TE1_swim_03
    discipline: swim
    category: TE
    type_code: TE1
    name: "Tempopyramiden — upp till 400 m och ner"
    parameterized: true
    parameters:
      duration_min:
        default: 50
        range: [40, 65]
        description: "Skala till veckans budget — smal range då pyramidens struktur är poängen"
    phase_appropriate: [base_3, build_1, build_2]
    intent: |
      Pyramid i tempo (Z3): 100, 200, 300, 400 m och ner igen. Omväxlande
      för både kropp och huvud — 400 m är toppen, och allt efter är
      lättare, åtminstone på papperet. Bra för att hitta tempokänslan
      inför längre tävlingar.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 15
      - segment: main
        sets: 1
        distance_m: 100
        zone: 3
        rest_sec: 20
      - segment: main
        sets: 1
        distance_m: 200
        zone: 3
        rest_sec: 25
      - segment: main
        sets: 1
        distance_m: 300
        zone: 3
        rest_sec: 30
      - segment: main
        sets: 1
        distance_m: 400
        zone: 3
        rest_sec: 35
      - segment: main
        sets: 1
        distance_m: 300
        zone: 3
        rest_sec: 30
      - segment: main
        sets: 1
        distance_m: 200
        zone: 3
        rest_sec: 25
      - segment: main
        sets: 1
        distance_m: 100
        zone: 3
        rest_sec: 0
      - segment: cooldown
        duration_pct: 0.08
        zone: 1
    total_distance_m: 2400
    total_duration_min:
      estimated: 50
      flexible_range: [40, 65]
    zone_refs: [Z1, Z3]
    equipment: []
    coach_notes: |
      Håll noga koll på att 100:orna inte skenar in i Z4. Lockelsen är
      stor när det känns lätt. Pyramidens poäng är jämn Z3 hela vägen.
      Smal range — pyramidens struktur är passet. Kan inte skalas brett.

  - code: TE1_swim_04
    discipline: swim
    category: TE
    type_code: TE1
    name: "2 × 800 m — långt och tålmodigt tempo"
    parameterized: true
    parameters:
      duration_min:
        default: 50
        range: [40, 75]
        description: "Skala till veckans budget"
    phase_appropriate: [build_1, build_2]
    intent: |
      Längre intervaller i tempo (Z3). Simningen på en Ironman ligger
      nära Z2, men du behöver marginal för att kunna gå upp i Z3 i
      strömmande vatten eller när du ligger tätt bakom andra simmare.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
      - segment: build
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 15
        description: "Börja lugnt (Z1) och öka till tempo (Z3)"
      - segment: main
        sets: {default: 2, range: [1, 3]}
        distance_m: 800
        zone: 3
        rest_sec: 60
        description: "Långt och tålmodigt. Gärna andra halvan lite snabbare än den första."
      - segment: continuous
        duration_pct: 0.05
        zone: 1
        description: "Lugn frisim, så att du hämtar dig efter intervallerna"
      - segment: cooldown
        duration_pct: 0.08
        zone: 1
    total_distance_m: 2400
    total_duration_min:
      estimated: 50
      flexible_range: [40, 75]
    zone_refs: [Z1, Z3]
    equipment: []
    abort_conditions:
      - "Är andra halvan av första 800 m mer än 5 s per 100 m långsammare än första halvan: korta andra 800 m till 500 m"
