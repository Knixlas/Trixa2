# Simpass — Muskulär Uthållighet (ME)
#
# ME1 — Long Cruise Intervals: längre intervaller nära tröskel (Z3-Z4)
# ME2 — Short Cruise Intervals: kortare intervaller på CSS-pace
# ME3 — Threshold: ren CSS/tröskel-arbete
#
# Detta är "race-specific" kvalitetsarbete. Bygger den uthålliga
# fart-toleransen som tävlingar kräver. Vid större budget: fler reps
# i main-blocket + längre warmup/cooldown. Inte "mer Z3" i absorption —
# absorptionssegmentet är Z1 active recovery, inte mer kvalitet.

workouts:

  # ─────────────────────────────────────────────────────────────
  # ME1 — Long Cruise Intervals
  # ─────────────────────────────────────────────────────────────

  - code: ME1_swim_01
    discipline: swim
    category: ME
    type_code: ME1
    name: "Tröskel-800:or — jämn och stark"
    parameterized: true
    parameters:
      duration_min:
        default: 75
        range: [55, 110]
        description: "Skala till veckans budget"
    phase_appropriate: [base_3, build_1, build_2]
    intent: |
      Långa intervaller strax långsammare än din tröskelfart i simning
      (CSS). Nära nog för att det ska kännas, lugnt nog för att du orkar
      tre. Bygger uthållighet i den fart du vill hålla på simningen i en
      halv eller hel Ironman.
    main_set:
      - segment: warmup
        duration_pct: 0.10
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: build
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 10
        description: "Öka farten under varje 50 m, från lugnt (Z2) till hårt (Z4). Väck tävlingskänslan."
      - segment: main
        sets: {default: 3, range: [2, 5]}
        distance_m: 800
        zone: 3
        rest_sec: 90
        description: "Jämn fart, sista 800 m ska gå lika fort som första. Orkar du: simma andra halvan lite snabbare, upp mot tröskelfarten (CSS)."
      - segment: continuous
        duration_pct: 0.05
        zone: 1
        description: "Lugn simning efter intervallerna, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
    total_distance_m: 3300
    total_duration_min:
      estimated: 75
      flexible_range: [55, 110]
    zone_refs: [Z1, Z2, Z3]
    equipment: []
    abort_conditions:
      - "Går början av andra 800 m mer än 5 s per 100 m långsammare än första 800 m: korta den tredje till 500 m"

  - code: ME1_swim_02
    discipline: swim
    category: ME
    type_code: ME1
    name: "4 × 500 m i tröskelfart — håll farten jämn"
    parameterized: true
    parameters:
      duration_min:
        default: 60
        range: [45, 90]
        description: "Skala till veckans budget"
    phase_appropriate: [build_1, build_2]
    intent: |
      Fyra 500 m i din tröskelfart i simning (CSS), hårt men jämnt.
      Passet fungerar som ett längre test: tiden per 100 m ska ligga
      inom ±2 s på alla fyra. Skiljer det mer stämmer antingen din
      tröskelfart eller dagsformen inte.
    main_set:
      - segment: warmup
        duration_pct: 0.12
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: main
        sets: {default: 4, range: [3, 6]}
        distance_m: 500
        zone: 3
        rest_sec: 45
        description: "Tröskelfart (CSS). Andas på vart tredje tag om du kan."
      - segment: continuous
        duration_pct: 0.05
        zone: 1
        description: "Lugn simning efter intervallerna, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.08
        zone: 1
    total_distance_m: 2800
    total_duration_min:
      estimated: 60
      flexible_range: [45, 90]
    zone_refs: [Z1, Z3]
    equipment: []
    coach_notes: |
      Bra som indikator-pass. Loggade splits berättar om CSS behöver
      uppdateras (för lätt) eller om kropp/återhämtning behöver fokus (svårt).

  - code: ME1_swim_03
    discipline: swim
    category: ME
    type_code: ME1
    name: "2 × 1000 m — den andra ska gå fortare"
    parameterized: true
    parameters:
      duration_min:
        default: 65
        range: [55, 85]
        description: "Skala till veckans budget — strukturen håller, men sista pieces blir längre vid större budget"
    phase_appropriate: [build_1, build_2, peak]
    intent: |
      Två långa intervaller, den andra snabbare än den första. Du
      tränar på att ha något kvar när det redan har börjat ta emot.
    main_set:
      - segment: warmup
        duration_pct: 0.12
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: main
        sets: 1
        distance_m: 1000
        zone: 2
        rest_sec: 90
        description: "Lugnt men bestämt (övre Z2 till nedre Z3). Öka gradvis mot tävlingsfart."
      - segment: main
        sets: 1
        distance_m: 1000
        zone: 3
        rest_sec: 0
        description: "På din tröskelfart (CSS) eller strax långsammare. Orkar du: simma andra halvan snabbare."
      - segment: continuous
        duration_pct: 0.22
        zone: 1
        description: "Lugn simning efter intervallerna, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.07
        zone: 1
    total_distance_m: 2800
    total_duration_min:
      estimated: 65
      flexible_range: [55, 85]
    zone_refs: [Z1, Z2, Z3]
    equipment: []

  # ─────────────────────────────────────────────────────────────
  # ME2 — Short Cruise Intervals
  # ─────────────────────────────────────────────────────────────

  - code: ME2_swim_01
    discipline: swim
    category: ME
    type_code: ME2
    name: "10 × 100 m i tröskelfart — håll linjen"
    parameterized: true
    parameters:
      duration_min:
        default: 45
        range: [35, 70]
        description: "Skala till veckans budget"
    phase_appropriate: [base_3, build_1, build_2]
    intent: |
      Tio 100 m precis i din tröskelfart i simning (CSS). Vilan är så
      kort att du inte hinner hämta dig helt. Det är jämn fart som bär
      dig, inte att du laddar om mellan.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: main
        sets: {default: 10, range: [6, 16]}
        distance_m: 100
        zone: 3
        rest_sec: 15
        description: "Precis tröskelfart (CSS). Inte snabbare på den första, inte långsammare på den sista."
      - segment: continuous
        duration_pct: 0.25
        zone: 1
        description: "Lugn simning efter intervallerna, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
    total_distance_m: 1800
    total_duration_min:
      estimated: 45
      flexible_range: [35, 70]
    zone_refs: [Z1, Z3]
    equipment: []

  - code: ME2_swim_02
    discipline: swim
    category: ME
    type_code: ME2
    name: "Växelfart — 15 × 100 m i tre farter"
    parameterized: true
    parameters:
      duration_min:
        default: 55
        range: [45, 80]
        description: "Skala till veckans budget — fler cykler vid större budget"
    phase_appropriate: [build_1, build_2]
    intent: |
      100 m i tre farter som växlar: lugn uthållighetsfart, tröskelfart
      och strax snabbare än tröskelfarten (CSS). Kroppen lär sig byta
      fart, som på tävling när du ligger bakom någon eller möter vågor.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: main
        sets: {default: 5, range: [3, 8]}
        distance_m: 100
        rest_sec: 15
        zones_per_set: [2, 3, 4, 3, 2]
        pace_pattern: alternating
        description: "Första varvet: lugnt (Z2), tröskel (Z3), hårt (Z4), tröskel (Z3), lugnt (Z2)"
      - segment: main
        sets: {default: 5, range: [3, 8]}
        distance_m: 100
        rest_sec: 15
        zones_per_set: [2, 3, 4, 3, 2]
        pace_pattern: alternating
        description: "Andra varvet, samma mönster"
      - segment: main
        sets: {default: 5, range: [3, 8]}
        distance_m: 100
        rest_sec: 15
        zones_per_set: [2, 3, 4, 3, 2]
        pace_pattern: alternating
        description: "Tredje varvet, samma mönster"
      - segment: continuous
        duration_pct: 0.21
        zone: 1
        description: "Lugn simning efter intervallerna, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.08
        zone: 1
    total_distance_m: 2300
    total_duration_min:
      estimated: 55
      flexible_range: [45, 80]
    zone_refs: [Z1, Z2, Z3, Z4]
    equipment: []

  - code: ME2_swim_03
    discipline: swim
    category: ME
    type_code: ME2
    name: "Storpasset — 20 × 100 m i tröskelfart"
    parameterized: true
    parameters:
      duration_min:
        default: 65
        range: [50, 95]
        description: "Skala till veckans budget — fler reps i main vid större budget"
    phase_appropriate: [build_1, build_2]
    intent: |
      Många 100 m i rad. Den långa sammanlagda sträckan gör passet till
      ett test: orkar du hålla din tröskelfart i simning (CSS) i alla
      20 är du redo för simningen på en halv Ironman.
    main_set:
      - segment: warmup
        duration_pct: 0.10
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: build
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 10
      - segment: main
        sets: {default: 20, range: [12, 30]}
        distance_m: 100
        zone: 3
        rest_sec: 10
        description: "Tröskelfart (CSS). När tiderna börjar glida: håll i, det är det som är poängen."
      - segment: continuous
        duration_pct: 0.05
        zone: 1
        description: "Lugn simning efter intervallerna, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.08
        zone: 1
    total_distance_m: 2900
    total_duration_min:
      estimated: 65
      flexible_range: [50, 95]
    zone_refs: [Z1, Z3]
    equipment: []
    abort_conditions:
      - "Går tiden mer än 5 s per 100 m långsammare än i början och kommer inte tillbaka på två intervaller: simma resten lugnt (Z2)"
    coach_notes: |
      Bra peak-fas-check 4-6 veckor innan IM. Resultatet säger
      om race-pace är realistisk eller behöver justeras.

  # ─────────────────────────────────────────────────────────────
  # ME3 — Threshold
  # ─────────────────────────────────────────────────────────────

  - code: ME3_swim_01
    discipline: swim
    category: ME
    type_code: ME3
    name: "Tröskel-300:or — fem raka"
    parameterized: true
    parameters:
      duration_min:
        default: 50
        range: [40, 75]
        description: "Skala till veckans budget"
    phase_appropriate: [build_1, build_2]
    intent: |
      Intervaller på 300 m i din tröskelfart i simning (CSS), hårt men
      jämnt. Längre än 100 m men kortare än 500 m, så du hinner jobba
      vid tröskeln utan att tappa farten.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: build
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 10
      - segment: main
        sets: {default: 5, range: [3, 8]}
        distance_m: 300
        zone: 3
        rest_sec: 30
        description: "Precis tröskelfart (CSS). Andas på vart tredje tag."
      - segment: continuous
        duration_pct: 0.07
        zone: 1
        description: "Lugn simning efter intervallerna, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
    total_distance_m: 2300
    total_duration_min:
      estimated: 50
      flexible_range: [40, 75]
    zone_refs: [Z1, Z3]
    equipment: []

  - code: ME3_swim_02
    discipline: swim
    category: ME
    type_code: ME3
    name: "8 × 200 m strax över tröskeln — det ska kosta"
    parameterized: true
    parameters:
      duration_min:
        default: 55
        range: [40, 80]
        description: "Skala till veckans budget"
    phase_appropriate: [build_1, build_2, peak]
    intent: |
      Strax snabbare än din tröskelfart i simning (CSS). Åtta 200 m är
      precis vad som går, med nöd och näppe. Du vänjer dig vid att
      hålla farten fast armarna och andningen protesterar.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: main
        sets: {default: 8, range: [5, 12]}
        distance_m: 200
        zone: 4
        rest_sec: 30
        description: "Strax snabbare än tröskelfarten (CSS − 2–3 s per 100 m). Det här ska kosta."
      - segment: continuous
        duration_pct: 0.08
        zone: 1
        description: "Lugn simning efter intervallerna, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.12
        zone: 1
    total_distance_m: 2500
    total_duration_min:
      estimated: 55
      flexible_range: [40, 80]
    zone_refs: [Z1, Z4]
    equipment: []
    abort_conditions:
      - "Blir en 200 m långsammare än din tröskelfart (CSS): sluta med intervallerna och simma den sista lugnt (Z2) som extra nedvarvning"

  - code: ME3_swim_03
    discipline: swim
    category: ME
    type_code: ME3
    name: "Tröskel-400:or med tankepaus"
    parameterized: true
    parameters:
      duration_min:
        default: 55
        range: [45, 80]
        description: "Skala till veckans budget — fler rounds vid stor budget"
    phase_appropriate: [build_1, build_2]
    intent: |
      Tröskelintervaller med 200 m mycket lugn simning (Z1) mellan.
      Under den lugna delen tänker du på tekniken: vad föll isär, och
      vad ska tillbaka?
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
      - segment: main
        sets: {default: 3, range: [2, 5]}
        distance_m: 400
        zone: 3
        rest_sec: 30
        description: "Tröskelfart (CSS), hårt men jämnt. Andas på vart tredje tag. Lägg märke till vad i tekniken som faller isär när det går fort."
      - segment: main
        sets: {default: 2, range: [1, 4]}
        distance_m: 200
        zone: 1
        rest_sec: 0
        description: "Lugn frisim mellan 400:orna. Tänk igenom vad som föll isär. En 200 m efter varje 400 m utom den sista."
      - segment: continuous
        duration_pct: 0.21
        zone: 1
        description: "Lugn simning efter intervallerna, låt pulsen gå ner"
      - segment: cooldown
        duration_pct: 0.08
        zone: 1
    total_distance_m: 2400
    total_duration_min:
      estimated: 55
      flexible_range: [45, 80]
    zone_refs: [Z1, Z3]
    equipment: []
    coach_notes: |
      Bra för adepter som teknik-bryter under fart. Den lugna mellan-200:an
      är ingen vila — den är en lektion.
