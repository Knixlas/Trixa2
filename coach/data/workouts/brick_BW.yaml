# Brickpass (BW) — cykel följt av löpning i samma pass.
#
# Discipline: brick. Varje segment bär ett `sport`-fält (bike|run) som
# renderaren använder för zonuppslag. Brick planeras på long_bike_day
# (brick ÄR veckans stora cykeldag + löpning direkt på).
#
# Nutrition är förstklassigt träningsinnehåll här — bricken är det
# närmaste en race-simulering vi kommer före tävling. Adepter med
# begränsat intag (se athlete_profiles.nutrition_notes) tränar sitt
# FAKTISKA race-intag, inte generella riktvärden.
#
# Nytt 2026-07-02 (expertgranskningen: största enskilda gapet i banken).
# Byggs inkrementellt: tre pass som täcker base_3 → race. Fler varianter
# (hilly brick, run-intervals brick) läggs till efter behov.

workouts:

  # ─────────────────────────────────────────────────────────────
  # BAE1 — Aerobic Endurance Brick (klassikern)
  # ─────────────────────────────────────────────────────────────

  - code: BAE1_brick_01
    discipline: brick
    category: BW
    type_code: BAE1
    name: "Långt kombinationspass — lugn cykel, löpning direkt på"
    phase_appropriate: [base_2, base_3, build_1, build_2]
    parameterized: false
    intent: |
      Veckans stora kombinationspass. Lång, lugn cykling och sedan
      löpning direkt efter — benen lär sig gå från att trampa till att
      springa när de är trötta. Löpningen SKA kännas konstig de första
      10 minuterna; det är just det du tränar. Håll igen när du springer
      — det är växlingen som är målet, inte sträckan.
    setting: outdoor
    terrain: flat
    main_set:
      - segment: warmup
        sport: bike
        duration_min: 15
        zone: 1
        description: "Cykla lugnt igång, hitta sittställningen"
      - segment: main
        sport: bike
        duration_min: 105
        zone: 2
        cadence_rpm: [85, 95]
        description: |
          Jämnt och lugnt (Z2). Öva på att äta och dricka från minut 20:
          kolhydrater var 20:e minut enligt din egen plan — i dag ska du
          inte chansa. Sista 15 min: lite lättare växel och snabbare
          tramptag (95+ varv/min) för att lätta upp benen inför löpningen.
      - segment: transition
        sport: run
        duration_min: 3
        effort_descriptor: "Snabb växling — skor, keps, en klunk. Öva som på tävling."
      - segment: main
        sport: run
        duration_min: 30
        zone: 2
        description: |
          Första 10 min MEDVETET långsamt — kortare och snabbare steg,
          låt benen vänja sig. Resten avspänt och lugnt (Z2). Jaga inte
          farten.
      - segment: cooldown
        sport: run
        duration_min: 5
        zone: 1
        description: "Gå eller jogga lugnt tills pulsen sjunkit"
    total_duration_min:
      estimated: 158
      flexible_range: [110, 210]
    zone_refs: [Z1, Z2]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Yrsel, illamående eller plötsligt helt slut på energi → gå, avbryt löpningen"
      - "Ryggsmärta som ökar efter växlingen → avsluta med promenad, rapportera"
      - "Pulsen går över Z3 när du springer fast det känns som Z2 → du är slut; korta löpningen till 15 min"
    coach_notes: |
      Skalning: cykeldelen följer långpasslogiken (upp mot 3-4 h i sen
      base/build), löpdelen hålls 20-40 min. Det är cykeln som bygger,
      löpningen som lär. Nutrition-utfall loggas — det är data inför
      race-planen.

  # ─────────────────────────────────────────────────────────────
  # BME1 — Race-Pace Brick (tävlingssimulering)
  # ─────────────────────────────────────────────────────────────

  - code: BME1_brick_01
    discipline: brick
    category: BW
    type_code: BME1
    name: "Generalrepetition — tävlingsfart cykel + löp"
    phase_appropriate: [build_1, build_2, peak]
    parameterized: false
    intent: |
      Tävlingen i miniatyr: cykla med den effekt du planerat för
      tävlingen, växla, och spring i din målfart. Passet svarar på den
      enda fråga som betyder något i augusti: håller planen? Ät och
      drick precis som på tävlingen — mage, effekt och fart testas
      tillsammans.
    setting: outdoor
    terrain: flat
    main_set:
      - segment: warmup
        sport: bike
        duration_min: 15
        zone: 1
      - segment: main
        sport: bike
        sets: 2
        duration_min: 30
        rest_sec: 300
        effort_descriptor: "din tävlingseffekt i Ironman — det du ska orka i flera timmar (68-73 % av FTP), liggande på styret om du har aerostyre"
        cadence_rpm: [85, 95]
        description: |
          2 × 30 min på tävlingseffekt med 5 min mycket lätt trampande
          (Z1) emellan. Ät och drick som på tävlingen: kolhydrater enligt
          DIN plan var 15–20:e min. Håll sittställningen — det är den du
          ska sitta i i 180 km.
      - segment: transition
        sport: run
        duration_min: 2
        effort_descriptor: "Växla som på tävlingen: allt förberett, öva bytet från cykel till löpning"
      - segment: main
        sport: run
        duration_min: 20
        effort_descriptor: "målfart i Ironman — farten du tänker öppna maratonet i"
        description: |
          Spring INTE fortare än målfarten, även om det känns lätt. Lätt
          ska det kännas — det är poängen. Titta på farten först efter
          3 min (klockan och adrenalinet efter växlingen lurar dig i
          början).
      - segment: cooldown
        sport: run
        duration_min: 5
        zone: 1
    total_duration_min:
      estimated: 110
      flexible_range: [95, 140]
    zone_refs: [Z1, Z2, Z3]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Magen klarar inte maten och drycken → ta det lugnare och skriv ner vad som hände — det är det viktigaste passet kan lära dig"
      - "Tävlingseffekten ger puls över Z3 efter 20 min → dålig dag eller fel utgångsvärde (FTP); sänk effekten 5 % och rapportera"
      - "Målfarten känns som ett tempopass → släpp farten, jogga hem och säg till tränaren: målet kan behöva ändras"
    coach_notes: |
      Bankens viktigaste pass sista 8 veckorna före IM. Utfallet ska
      jämföras mot race-planen: klarades watten på rätt puls? Höll magen?
      Kändes målpacet uthålligt? Tre nej = race-planen revideras, inte
      adepten. Kör varannan vecka i build, en gång i peak.

  # ─────────────────────────────────────────────────────────────
  # BSS2 — T2 Practice (växlingsfärdighet)
  # ─────────────────────────────────────────────────────────────

  - code: BSS2_brick_01
    discipline: brick
    category: BW
    type_code: BSS2
    name: "Växlingslek — fyra snabba cykel/löp-byten"
    phase_appropriate: [build_2, peak, race]
    parameterized: false
    intent: |
      Här tränar du bara växlingen: fyra korta byten från cykel till
      löpning, där själva bytet är det viktiga. Kroppen hittar löpsteget
      snabbare för varje gång — och du nöter in tävlingens växling från
      cykel till löpning tills den sitter. Passet är lätt och passar
      veckorna före tävlingen, när du drar ner på träningen.
    setting: outdoor
    terrain: flat
    main_set:
      - segment: warmup
        sport: bike
        duration_min: 10
        zone: 1
      - segment: main
        sets: 4
        sport: bike
        duration_min: 8
        effort_descriptor: "Lugnt (Z2), sista 2 min på tävlingseffekt — kom in till växlingen med tävlingskänsla"
      - segment: main
        sets: 4
        sport: run
        duration_min: 5
        rest_sec: 120
        effort_descriptor: "Direkt ut i din målfart för Ironman — hitta steget inom 90 sekunder"
        description: |
          Gör det 4 gånger: cykla 8 min → växla → spring 5 min → tillbaka.
          Vilan är när du går tillbaka till cykeln. Gör exakt samma sak
          vid varje växling (hjälm, skor, nummerlapp — i tävlingens ordning).
      - segment: cooldown
        sport: run
        duration_min: 5
        zone: 1
    total_duration_min:
      estimated: 75
      flexible_range: [55, 90]
    zone_refs: [Z1, Z2]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Yrsel vid växlingen som inte går över → sätt dig ner, avbryt, rapportera"
    coach_notes: |
      Perfekt taper-pass: race-specifikt, låg dos, hög färdighetsavkastning.
      Kräver plats där cykel + löpning kan växlas säkert (parkering,
      motionsspår med cykelställ). I race-veckan: 2-3 cykler räcker.
