# Löppass — Aerob Kapacitet (AC)
#
# AC1 — Group Run: socialt löppass, helt pct.
# AC2/AC3 — VO2max-intervaller: intervalldelar fasta, wu/cd skalas.

workouts:

  # ─────────────────────────────────────────────────────────────
  # AC1 — Group Run (helt pct)
  # ─────────────────────────────────────────────────────────────

  - code: AC1_run_01
    discipline: run
    category: AC
    type_code: AC1
    name: "Klubbrundan — gruppen sätter farten"
    phase_appropriate: [base_2, base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 80
        range: [60, 120]
        description: "Längd och intensitet styrs av gruppen"
    intent: |
      Löpning i grupp där sällskapet bestämmer farten. Du vet inte
      riktigt vad du får — lugna partier (Z2) bryts av jobbigare
      (Z3–Z4) när någon drar på. Räkna det som ett hårt pass om
      gruppen springer fortare än du är van vid.
    main_set:
      - segment: warmup
        duration_pct: 0.125
        zone: 1
        description: "Innan gruppen samlas"
      - segment: continuous
        duration_pct: 0.75
        zone: 3
        effort_descriptor: "Mest lugnt (Z2), jobbigare (Z3–Z4) när gruppen ökar. Släpp gruppen om pulsen går upp i Z5."
        pace_unreliable: true
        description: "Gruppen bestämmer hur långt och hur hårt — oftast 60–90 min med 2–4 hårda partier."
      - segment: cooldown
        duration_pct: 0.125
        zone: 1
    total_duration_min:
      estimated: 80
      flexible_range: [60, 120]
    zone_refs: [Z1, Z2, Z3, Z4]
    terrain: mixed
    surface: any
    equipment: []
    coach_notes: |
      Räknas inte som tillförlitlig kvalitetsenhet — för svår att
      planera för engine eller Trixa. Logga som AC1 om träffat i
      hög-intensitetszon längre än 10 min totalt; annars som AE2.

  # ─────────────────────────────────────────────────────────────
  # AC2 — VO2Max Intervals
  # ─────────────────────────────────────────────────────────────

  - code: AC2_run_01
    discipline: run
    category: AC
    type_code: AC2
    name: "Hårda treor — 6×3 min"
    phase_appropriate: [build_2, peak]
    parameterized: true
    parameters:
      duration_min:
        default: 70
        range: [65, 80]
        description: "Stridor + main = ~38 min FAST"
    intent: |
      Klassiska maxintervaller. 3 minuter är en bra längd för att få
      mycket tid i Z5 — kortare intervaller ger för lite tid nära max,
      längre gör att du tar slut innan den sista minuten är över.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        sets: 4
        duration_sec: 30
        zone: 4
        effort_descriptor: "stegringar, den sista i nedre Z4"
        rest_sec: 60
      - segment: main
        sets: 6
        duration_min: 3
        zone: 5
        rest_sec: 180
        description: "Mycket hårt (Z5). Farten ska vara hård men gå att hålla i precis 3 minuter. Vila med jogg eller gång."
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 70
      flexible_range: [65, 80]
    zone_refs: [Z1, Z4, Z5]
    terrain: flat
    surface: track
    equipment: []
    abort_conditions:
      - "Om du inte kan prata alls efter första eller andra intervallen → farten är för hård, sakta in 10–15 s per km"
      - "Om du är mer än 15 s per km långsammare i fjärde intervallen än i första → spring femte och sjätte i Z4, eller avbryt"
    coach_notes: |
      Mest neuromuskulärt och fysiologiskt krävande av alla
      löppass i banken. Schemalägg minst 48h Z1 efter. Aldrig
      två AC-pass inom samma 5 dagar.

  - code: AC2_run_02
    discipline: run
    category: AC
    type_code: AC2
    name: "Snabba 400-varv — 12×400 m"
    phase_appropriate: [build_2, peak]
    parameterized: true
    parameters:
      duration_min:
        default: 65
        range: [60, 75]
        description: "Stridor + main = ~38 min FAST (12×400m + viltimmar)"
    intent: |
      Kortare maxintervaller med kort vila. Du får mycket tid i Z5 fast
      varje intervall är kort — vilan är så kort att pulsen inte hinner
      gå ner helt.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        sets: 4
        duration_sec: 30
        zone: 5
        effort_descriptor: "stegringar"
        rest_sec: 60
      - segment: main
        sets: 12
        distance_m: 400
        zone: 5
        rest_sec: 90
        description: "Mycket hårt (Z5). Vila: jogga 200 m."
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 65
      flexible_range: [60, 75]
    zone_refs: [Z1, Z5]
    terrain: flat
    surface: track
    equipment: []

  - code: AC2_run_03
    discipline: run
    category: AC
    type_code: AC2
    name: "Pyramiden — upp till 1200 och ner"
    phase_appropriate: [build_2, peak]
    parameterized: true
    parameters:
      duration_min:
        default: 75
        range: [70, 85]
        description: "Stridor + pyramid = ~50 min FAST"
    intent: |
      Pyramid: varje sträcka mycket hårt (Z5), med längre vila efter
      längre sträckor. Växlingen gör det lättare för huvudet än 5
      likadana intervaller. Utmaningen är att hålla samma fart fast
      sträckan ändras.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        sets: 4
        duration_sec: 30
        zone: 5
        effort_descriptor: "stegringar"
        rest_sec: 60
      - segment: main
        sets: 1
        distance_m: 800
        zone: 5
        rest_sec: 120
      - segment: main
        sets: 1
        distance_m: 1000
        zone: 5
        rest_sec: 150
      - segment: main
        sets: 1
        distance_m: 1200
        zone: 5
        rest_sec: 180
      - segment: main
        sets: 1
        distance_m: 1000
        zone: 5
        rest_sec: 150
      - segment: main
        sets: 1
        distance_m: 800
        zone: 5
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 75
      flexible_range: [70, 85]
    zone_refs: [Z1, Z5]
    terrain: flat
    surface: track
    equipment: []

  # ─────────────────────────────────────────────────────────────
  # AC3 — Hill Intervals
  # ─────────────────────────────────────────────────────────────

  - code: AC3_run_01
    discipline: run
    category: AC
    type_code: AC3
    name: "Hårda backdrag — 8×90 sek"
    phase_appropriate: [build_1, build_2, peak]
    parameterized: true
    parameters:
      duration_min:
        default: 65
        range: [60, 75]
        description: "Stridor + main = ~33 min FAST"
    intent: |
      Maxintervaller uppför. Backen tar bort en del av stötarna mot
      benen och tvingar fram kraft i steget. Pulsen når Z5 utan att
      farten behöver vara halsbrytande.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        sets: 3
        duration_sec: 20
        zone: 5
        effort_descriptor: "stegringar"
        rest_sec: 60
      - segment: main
        sets: 8
        duration_sec: 90
        zone: 5
        pace_unreliable: true
        rest_sec: 150
        description: "Mycket hårt (Z5) uppför 4–6 % lutning. Vila: gå tillbaka ner."
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 65
      flexible_range: [60, 75]
    zone_refs: [Z1, Z5]
    terrain: hilly
    surface: road
    equipment: []
    abort_conditions:
      - "Om pulsen inte når Z5 ens första gången → backen är för flack"
      - "Plötslig smärta → sluta direkt"
    coach_notes: |
      Skonsammare alternativ till AC2 för adept med skadehistorik,
      särskilt akilles eller hamstrings — uppförslöpning är mjukare
      mot dessa strukturer även vid hög intensitet.
