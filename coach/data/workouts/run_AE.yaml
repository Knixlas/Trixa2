# Löppass — Aerob Uthållighet (AE)
#
# ALLA pass är budget-drivna (parameterized: true).
# - Mallar AE1/AE2_run_template: rena pct-pass, hela passet skalas.
# - Konkreta varianter: pct-delar + ev. fasta strides-set som behålls.
#
# Pct-segment summerar till 1.0. Fasta delar tas av budgeten först,
# återstoden fördelas enligt pct.

workouts:

  # ─────────────────────────────────────────────────────────────
  # AE1 — Recovery (parametriserad mall)
  # ─────────────────────────────────────────────────────────────

  - code: AE1_run_template
    discipline: run
    category: AE
    type_code: AE1
    name: "Skakapass — lätt jogg"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2, peak, race, recovery]
    parameterized: true
    parameters:
      duration_min:
        default: 40
        range: [20, 60]
        description: "Total tid; skala efter veckans volym och dagsform"
    intent: |
      Ett lätt pass för att återhämta dig. Spring mycket lugnt (nedre
      Z1) — kroppen ska kännas bättre EFTER passet än före. Ingen
      ansträngning alls. Andningen ska vara så lugn att du kan prata i
      hela meningar utan att hacka.
    main_set:
      - segment: warmup
        duration_pct: 0.20
        zone: 1
        description: "Mycket lugn start — gärna 2-3 min rask gång först om kroppen är trög"
      - segment: continuous
        duration_pct: 0.65
        zone: 1
        description: "Jämnt och mycket lugnt (nedre Z1). Går pulsen upp mot Z2 — sakta in eller gå."
      - segment: cooldown
        duration_pct: 0.15
        zone: 1
        description: "Sista 5 min lugn — gärna gå sista minuten"
    total_duration_min:
      estimated: 40
      flexible_range: [20, 60]
    zone_refs: [Z1]
    terrain: flat
    surface: any
    equipment: []
    abort_conditions:
      - "Om pulsen inte går ner till Z1 inom 2 min fast du saktat in → avsluta"
      - "Om benen känns tunga och stela efter 10 min → kort pass, gå hem"
    coach_notes: |
      Funkar dagen efter ett hårdpass, mellan kvalitetspass, eller på
      tröttveckor. Bytbar mot vilodag om sömn-/HRV-signaler säger så.

  # ─────────────────────────────────────────────────────────────
  # AE1 — Gå och jogga (bara nybörjare, docs/13)
  # Planeraren sätter jog_min/walk_min ur levels.yaml::run_walk_steps
  # och flyttar upp ett steg varannan gjord vecka. Texten är skriven
  # för den som aldrig sprungit: inga zoner, ingen pulsklocka.
  # ─────────────────────────────────────────────────────────────

  - code: AE1_run_gajogg
    discipline: run
    category: AE
    type_code: AE1
    levels: [beginner]
    name: "Gå och jogga"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2, peak, race, recovery]
    parameterized: true
    parameters:
      duration_min:
        default: 25
        range: [15, 60]
        description: "Total tid inklusive gång"
      jog_min:
        default: "1"
        description: "Minuter jogg per varv (text, sätts av planeraren)"
      walk_min:
        default: "1,5"
        description: "Minuter gång per varv (text, sätts av planeraren)"
    intent: |
      Du bygger vanan att röra dig och lär kroppen att tåla löpning lite i
      taget. Jogga så lugnt att du kan prata hela tiden. Det ska kännas
      för lätt — det är meningen. Gången är en del av passet, inte ett
      misslyckande.
    main_set:
      - segment: warmup
        duration_pct: 0.20
        zone: 1
        effort_descriptor: "rask promenad"
      - segment: continuous
        duration_pct: 0.65
        zone: 2
        effort_descriptor: "{jog_min} min lugn jogg, {walk_min} min gång — och om igen"
        description: |
          Börja om från jogg efter varje gång. Orkar du inte hela
          joggminuten: gå tidigare. Det räknas ändå.
      - segment: cooldown
        duration_pct: 0.15
        zone: 1
        effort_descriptor: "lugn promenad hem"
    total_duration_min:
      estimated: "{duration_min}"
      flexible_range: [15, 60]
    zone_refs: [Z1, Z2]
    terrain: flat
    surface: any
    equipment: []
    abort_conditions:
      - "Ont i knä, fot eller höft som gör att du haltar → gå hem och vila till nästa pass"
      - "Svimfärdig, ont i bröstet eller mycket andfådd när du går → avbryt"
    coach_notes: |
      Nybörjarens enda löppass tills run_walk_steps är slut (cirka 14
      gjorda veckor). Ersätter 9/1-passet, som var för långt och för
      tätt för den som aldrig sprungit.

  # ─────────────────────────────────────────────────────────────
  # AE2 — Aerobic Endurance (parametriserad mall)
  # ─────────────────────────────────────────────────────────────

  - code: AE2_run_template
    discipline: run
    category: AE
    type_code: AE2
    name: "Lugn distans — veckans grundpass"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 60
        range: [40, 150]
        description: "Skala till veckans långpass eller mellanlångt"
      include_strides:
        default: false
        description: "Om true: lägg 4-6×~20 sek strides på slutet (SS1-mikrodos)"
    intent: |
      Jämn, lugn löpning (Z2). Ingen fart att jaga — bara tid på
      fötterna. Så här bygger du uthållighet, och det är det vanligaste
      passet under grundträningen.
    main_set:
      - segment: warmup
        duration_pct: 0.10
        zone: 1
        description: "Börja lugnt och öka lite, sista minuten i nedre Z2"
      - segment: continuous
        duration_pct: 0.80
        zone: 2
        description: "Jämnt och lugnt (Z2). Kryper pulsen upp mot Z3 fast farten är densamma är passet långt nog."
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
    total_duration_min:
      estimated: 60
      flexible_range: [40, 150]
    zone_refs: [Z1, Z2]
    terrain: flat
    surface: any
    equipment: []
    abort_conditions:
      - "Om du inte kan hålla Z2-farten utan att pulsen går upp i Z3 → avsluta tidigt, dagsformen är inte där"
    coach_notes: |
      Den här mallen är 80% av all löpning i base-fasen. Variera
      durationen och underlaget för variation, men låt zonen vara.

  # ─────────────────────────────────────────────────────────────
  # AE2 — Konkreta varianter (budget-drivna)
  # ─────────────────────────────────────────────────────────────

  - code: AE2_run_01
    discipline: run
    category: AE
    type_code: AE2
    name: "Långpass med lyft på slutet"
    phase_appropriate: [base_2, base_3, build_1]
    parameterized: true
    parameters:
      duration_min:
        default: 100
        range: [90, 120]
        description: "Långpass-budget — skalar samtliga delar proportionellt"
    intent: |
      Långpass där du ökar lite den sista tredjedelen, från nedre till
      övre Z2. Du övar på att hålla steget och tempot när du börjar bli
      trött — mer likt en tävling än ett jämnt långpass.
    main_set:
      - segment: warmup
        duration_pct: 0.10
        zone: 1
      - segment: continuous
        duration_pct: 0.50
        zone: 2
        description: "Nedre Z2 — bekvämt, lugn andning"
      - segment: continuous
        duration_pct: 0.30
        zone: 2
        description: "Övre Z2 — lyft tempot något, känn att det börjar bita"
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
    total_duration_min:
      estimated: 100
      flexible_range: [90, 120]
    zone_refs: [Z1, Z2]
    terrain: flat
    surface: road
    equipment: []
    coach_notes: |
      Sista tredjedelen ska kosta lite. Övergången från nedre till övre Z2
      ska vara märkbar för adepten — annars var första delen för hård.

  - code: AE2_run_02
    discipline: run
    category: AE
    type_code: AE2
    name: "Lugn skogsrunda på stig"
    phase_appropriate: [prep, base_1, base_2, base_3]
    parameterized: true
    parameters:
      duration_min:
        default: 80
        range: [60, 110]
        description: "Trail-budget"
    intent: |
      Lugnt pass (Z2) på mjukt underlag i backig terräng. Skonsamt för
      lederna, och steg och puls varierar av sig själv. Gå efter pulsen
      — farten säger inget på stig.
    main_set:
      - segment: warmup
        duration_pct: 0.125
        zone: 1
        pace_unreliable: true
      - segment: continuous
        duration_pct: 0.75
        zone: 2
        pace_unreliable: true
        description: "Håll pulsen i Z2. Gå i branta backar om pulsen stiger till Z3."
      - segment: cooldown
        duration_pct: 0.125
        zone: 1
        pace_unreliable: true
    total_duration_min:
      estimated: 80
      flexible_range: [60, 110]
    zone_refs: [Z1, Z2]
    terrain: hilly
    surface: trail
    equipment: []
    coach_notes: |
      Bra alternativ för base-fasen eller som rehab-friendly löppass.
      Mjuk yta + variation skonar leder. Lämplig efter hårdvecka.

  - code: AE2_run_03
    discipline: run
    category: AE
    type_code: AE2
    name: "Lugn löpning med stegringar"
    phase_appropriate: [base_1, base_2, base_3, build_1]
    parameterized: true
    parameters:
      duration_min:
        default: 65
        range: [55, 75]
        description: "Total budget; strides-set (~8 min) tas av först"
    intent: |
      Jämn, lugn löpning (Z2) med 6 stegringar på slutet — korta
      fartökningar på 20 s. De håller benen vana vid fart medan du
      bygger uthållighet, utan att passet blir tyngre.
    main_set:
      - segment: warmup
        duration_pct: 0.18
        zone: 1
      - segment: continuous
        duration_pct: 0.73
        zone: 2
      - segment: main
        sets: 6
        duration_sec: 20
        zone: 5
        effort_descriptor: "snabbt men avspänt — cirka 90 % av maxfart, kontrollerade steg, ingen spurt"
        rest_sec: 60
        description: "Vila med lugn jogg eller gång. Alla stegringar tar tillsammans cirka 8 min."
      - segment: cooldown
        duration_pct: 0.09
        zone: 1
    total_duration_min:
      estimated: 65
      flexible_range: [55, 75]
    zone_refs: [Z1, Z2]
    terrain: flat
    surface: road
    equipment: []
    coach_notes: |
      Ett av de mest "billiga" sätten att hålla snabbhetskvaliteter
      i base-fasen. Strides triggar inte träningsstress värd att
      räkna i veckoplaneringen. Strides-blocket är fast — bara Z2-delen,
      uppvärmning och nedvarvning skalas med budgeten.

  - code: AE2_run_04
    discipline: run
    category: AE
    type_code: AE2
    name: "Långpass med block i målfart"
    phase_appropriate: [build_1, build_2, peak]
    parameterized: false
    intent: |
      Långpasset där du övar tävlingens början: lugnt (Z2) med block i
      den fart du tänker öppna maratonet på i Ironman. Målfarten ska
      kännas nästan löjligt lätt när du är pigg — precis så ska de
      första milen kännas på tävlingsdagen också. Passet lär kroppen
      farten OCH huvudet att inte springa fortare.
    main_set:
      - segment: warmup
        duration_min: 15
        zone: 1
        description: "Lugn start, låt pulsen komma upp gradvis"
      - segment: continuous
        duration_min: 20
        zone: 2
      - segment: main
        sets: 3
        duration_min: 20
        rest_sec: 300
        effort_descriptor: "målfart i Ironman — farten du tänker öppna maratonet på"
        description: |
          3 × 20 min i målfart med 5 min avspänt och lugnt (Z2) mellan.
          Titta på klockan var 3–4:e minut, inte hela tiden. Öva på att
          äta och dricka i de lugna pauserna — gel och dryck som du
          planerat för tävlingen.
      - segment: cooldown
        duration_min: 10
        zone: 1
    total_duration_min:
      estimated: 115
      flexible_range: [85, 135]
    zone_refs: [Z1, Z2, Z3]
    terrain: flat
    surface: road
    equipment: [hr_strap]
    abort_conditions:
      - "Yrsel, illamående eller plötsligt helt slut på energi → gå, avbryt"
      - "Målfarten ger puls i Z4 redan i första blocket → dålig dag eller för högt mål; jogga hem, rapportera"
      - "Du tappar farten i tredje blocket → normalt tidigt i uppbyggnaden; notera när det hände"
    coach_notes: |
      Skala via blocken: 2×15 (tidig build) → 3×20 → 2×30 (sen build).
      I peak: 2×15 räcker. Pulsen på målpace är passets facit — driftar
      den upp mot tröskel är målet för ambitiöst satt, och det vill vi
      veta i juli, inte i augusti. Ersätter INTE veckans lugna långpass
      i base — det här är ett build-verktyg.

  - code: AE2_run_05
    discipline: run
    category: AE
    type_code: AE2
    name: "Nio minuter löpa, en minut gå"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2, recovery]
    parameterized: true
    parameters:
      duration_min:
        default: 75
        range: [45, 150]
        description: "Total tid inkl. gångminuter. Skala fritt — belastningen per km är låg."
    intent: |
      Långpass i omgångar: 9 minuter löpning, 1 minut rask gång, om och
      om igen. Gångminuten ger benen vila från stötarna och håller
      pulsen lugn — du kan vara ute längre med mindre risk för skador.
      Det är ingen nödlösning: att varva löpning och gång är ett
      beprövat sätt att klara maratonet i Ironman, och ett bra sätt att
      komma tillbaka efter skada eller öka mängden försiktigt.
    main_set:
      - segment: warmup
        duration_pct: 0.10
        zone: 1
        description: "Första blocket gås delvis — mjuk start"
      - segment: continuous
        duration_pct: 0.85
        zone: 2
        effort_descriptor: "9 min lugn löpning (Z2), 1 min rask gång — och om igen"
        description: |
          Gå varje gångminut, även när du känner dig stark. Det är den
          som gör att du är hel även på säsongens fyrtionde pass. Ät och
          drick när du går.
      - segment: cooldown
        duration_pct: 0.05
        zone: 1
        description: "Sista minuterna gås"
    total_duration_min:
      estimated: 75
      flexible_range: [45, 150]
    zone_refs: [Z1, Z2]
    terrain: flat
    surface: any
    equipment: []
    abort_conditions:
      - "Smärta som gör att du springer annorlunda → gå hem, rapportera"
      - "Pulsen kryper upp över Z2 när du springer, trots gångpauserna → byt till 8 min löpning och 2 min gång, eller avsluta"
    coach_notes: |
      Rehab-vänligaste långpasset i banken — förstahandsval vid
      återuppbyggnad, hög kroppsvikt-historik eller ryggkänslighet.
      Kan även användas som RACE-strategi (gå vätskestationerna):
      då övas exakt samma rytm här. 9/1 är default; 8/2 eller 4/1
      för tyngre dagar.
