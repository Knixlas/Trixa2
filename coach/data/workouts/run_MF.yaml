# Löppass — Muskulär Styrka (MF)
#
# MF1 — Force Reps: korta intensiva backintervaller. Fasta huvudset.
# MF2 — Hill Fartlek: fri intensitet i kuperad terräng. Pct cont.
# MF3 — Hill Repeats: längre uppförsintervaller. Fasta huvudset.

workouts:

  # ─────────────────────────────────────────────────────────────
  # MF1 — Force Reps
  # ─────────────────────────────────────────────────────────────

  - code: MF1_run_01
    discipline: run
    category: MF
    type_code: MF1
    name: "Backsprinter — 8×30 sek full kraft"
    phase_appropriate: [base_2, base_3, build_1]
    parameterized: true
    parameters:
      duration_min:
        default: 50
        range: [45, 60]
        description: "Stridor + main = ~24 min FAST"
    intent: |
      Korta backsprintar med all kraft du har. Tänk på STEGET, inte på
      pulsen: kort tid i marken, kraftigt frånskjut, höga knän. Vila
      tills du är helt återhämtad — det är kraft du tränar, inte att
      hålla ut.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        sets: 4
        duration_sec: 20
        zone: 4
        effort_descriptor: "stegringar — öka farten, väck benen"
        rest_sec: 40
      - segment: main
        sets: 8
        duration_sec: 30
        zone: 5
        effort_descriptor: "All kraft uppför en backe med 5–8 % lutning. Korta, snabba steg eller långa, kraftiga steg — välj ett sätt per pass."
        pace_unreliable: true
        rest_sec: 120
        description: "Vila: gå lugnt tillbaka ner. Poängen är att du hinner återhämta dig helt."
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 50
      flexible_range: [45, 60]
    zone_refs: [Z1]
    terrain: hilly
    surface: road
    equipment: []
    abort_conditions:
      - "Om kraften tydligt sjunker efter 5–6 gånger → avsluta. Kvalitet är viktigare än antal."
      - "Plötslig smärta i hälsenan, knät eller höften → avbryt."
    coach_notes: |
      Hitta en backe på 5-8% lutning där 30 sek tar dig ca 100-150m.

  - code: MF1_run_02
    discipline: run
    category: MF
    type_code: MF1
    name: "Snabba fötter i backen — 12×15 sek"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 45
        range: [40, 55]
        description: "Stridor + main = ~21 min FAST"
    intent: |
      Mycket korta, snabba ruscher uppför en backe. Ger spänst i vader
      och baksida lår — bra när du ska springa direkt efter cykeln.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        sets: 4
        duration_sec: 15
        zone: 4
        effort_descriptor: "lättare stegringar"
        rest_sec: 30
      - segment: main
        sets: 12
        duration_sec: 15
        zone: 5
        effort_descriptor: "snabba steg uppför cirka 6 % lutning — som om marken brände, korta markkontakter"
        pace_unreliable: true
        rest_sec: 75
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 45
      flexible_range: [40, 55]
    zone_refs: [Z1]
    terrain: hilly
    surface: road
    equipment: []

  # ─────────────────────────────────────────────────────────────
  # MF2 — Hill Fartlek (helt pct — inga fasta intervaller)
  # ─────────────────────────────────────────────────────────────

  - code: MF2_run_01
    discipline: run
    category: MF
    type_code: MF2
    name: "Fartlek där backarna bestämmer"
    phase_appropriate: [base_2, base_3, build_1]
    parameterized: true
    parameters:
      duration_min:
        default: 60
        range: [50, 70]
        description: "Hela passet skalar — terrängen bestämmer struktur"
    intent: |
      Fartlek på en backig runda där terrängen bestämmer farten: hårt
      uppför, håll farten över krönet, återhämta dig i lugn löpning
      nedför. Pulsen blir ojämn — det är meningen.
    main_set:
      - segment: warmup
        duration_pct: 0.17
        zone: 1
        pace_unreliable: true
      - segment: continuous
        duration_pct: 0.66
        zone: 3
        effort_descriptor: "Lugnt (Z2) på platten, jobbigt (Z3–Z4) uppför, mycket lugnt (Z1–Z2) nedför. Inga intervalltider — terrängen bestämmer."
        pace_unreliable: true
        description: "Hitta en runda med 4–8 backar och spring 2–3 varv. Eller spring från en plats till en annan i backig terräng."
      - segment: cooldown
        duration_pct: 0.17
        zone: 1
        pace_unreliable: true
    total_duration_min:
      estimated: 60
      flexible_range: [50, 70]
    zone_refs: [Z1, Z2, Z3, Z4]
    terrain: hilly
    surface: trail
    equipment: []
    coach_notes: |
      Bra "kvalitetspass utan strukturkrav" — funkar när Garmin är
      död, när nervsystemet är för trött för exakt intervall-disciplin,
      eller bara som mental variation från klockstyrning.

  # ─────────────────────────────────────────────────────────────
  # MF3 — Hill Repeats
  # ─────────────────────────────────────────────────────────────

  - code: MF3_run_01
    discipline: run
    category: MF
    type_code: MF3
    name: "Backintervaller — kraft i stegen, 6×90 sek"
    phase_appropriate: [base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 60
        range: [55, 70]
        description: "Stridor + main = ~35 min FAST"
    intent: |
      Längre backintervaller. Du får både kraft och uthållighet — något
      platta tempopass inte ger. Benen blir starkare, och du vänjer dig
      vid att springa nära tröskeln, den fart du orkar hålla i ungefär
      en timme.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        sets: 3
        duration_sec: 20
        zone: 4
        effort_descriptor: "stegringar"
        rest_sec: 60
      - segment: main
        sets: 6
        duration_sec: 90
        zone: 4
        pace_unreliable: true
        rest_sec: 150
        description: "Jobbigt (puls i Z4) uppför 4–6 % lutning. Vila: gå tillbaka ner."
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 60
      flexible_range: [55, 70]
    zone_refs: [Z1, Z4]
    terrain: hilly
    surface: road
    equipment: []
    abort_conditions:
      - "Om pulsen inte når Z4 ens första gången → backen är för flack, byt backe"
      - "Om pulsen redan tredje gången ligger i Z5 → vila 60 s extra eller avsluta"

  - code: MF3_run_02
    discipline: run
    category: MF
    type_code: MF3
    name: "Långa backintervaller — 5×3 min"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 65
        range: [60, 75]
        description: "Stridor + main = ~42 min FAST"
    intent: |
      Långa backintervaller. 3 min uppför tar både på musklerna och på
      flåset — du blir starkare och orkar mer. De känns tunga i huvudet,
      men blir lättare för varje gång du gör passet.
    main_set:
      - segment: warmup
        duration_pct: 0.60
        zone: 1
      - segment: build
        sets: 4
        duration_sec: 20
        zone: 4
        effort_descriptor: "stegringar"
        rest_sec: 60
      - segment: main
        sets: 5
        duration_min: 3
        zone: 4
        pace_unreliable: true
        rest_sec: 180
        description: "Övre Z4. Gå eller jogga tillbaka. Är backen kortare: spring 3 min efter klockan ändå, även om backen tar slut."
      - segment: cooldown
        duration_pct: 0.40
        zone: 1
    total_duration_min:
      estimated: 65
      flexible_range: [60, 75]
    zone_refs: [Z1, Z4]
    terrain: hilly
    surface: road
    equipment: []
