# Cykelpass — Aerob Uthållighet (AE)
#
# AE1 — Recovery: parametriserad mall. Lugn cykling för aktiv återhämtning,
#                 blodflöde i benen utan att tillföra träningsstress.
#
# AE2 — Aerobic Endurance: längre lugna pass som bygger aerob bas.
#                          Parametriserad mall + konkreta varianter med
#                          embedded kvalitetsinslag (spin-ups, tempo-pickups).

workouts:

  # ─────────────────────────────────────────────────────────────
  # AE1 — Recovery (parametriserad mall)
  # ─────────────────────────────────────────────────────────────

  - code: AE1_bike_template
    discipline: bike
    category: AE
    type_code: AE1
    name: "Lätt rull — bara snurra på benen"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2, peak, race, recovery]
    parameterized: true
    parameters:
      duration_min:
        default: 45
        range: [20, 75]
        description: "Total tid; skala efter veckans volym och dagsform"
    intent: |
      Återhämtning. Trampa riktigt lätt (Z1) — du ska må bättre EFTER
      passet än före. Inga intervaller, ingen stegring, inga backar att
      jaga. Börjar benen kännas ansträngda är farten för hög.
    setting: either
    terrain: flat
    erg_mode: false
    main_set:
      - segment: continuous
        duration_min: "{duration_min}"
        zone: 1
        cadence_rpm: [85, 95]
        description: "Riktigt lätt (Z1). Trampa i den takt som känns naturlig och låt tankarna vandra."
    total_duration_min:
      estimated: "{duration_min}"
      flexible_range: ["{duration_min} - 10", "{duration_min} + 10"]
    zone_refs: [Z1]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Pulsen stiger över Z1 fast det känns lätt → sakta ned eller avbryt"
      - "Stelhet eller smärta som inte släpper efter 10 min → avbryt"
    coach_notes: |
      Klassiskt återhämtningsverktyg. Funkar utomhus på platt rutt eller
      på trainer med Netflix. 30 min är default-default; 45-60 om volymen
      tillåter; max 75 (då börjar det räknas som bas-pass).

  # ─────────────────────────────────────────────────────────────
  # AE2 — Aerobic Endurance (parametriserad huvudmall)
  # ─────────────────────────────────────────────────────────────

  - code: AE2_bike_template
    discipline: bike
    category: AE
    type_code: AE2
    name: "Lugn distans i samtalsfart"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 120
        range: [60, 360]
        description: |
          Total tid. 60-90 i prep, 90-180 i base, 180-300 i build_1/2.
          IM-specifika långpass når 300-360 i sen base/build_1.
    intent: |
      Lugn uthållighet. Jämnt och lugnt (Z2) — du andas tydligt men kan
      prata i hela meningar. Det är det här passet som gör att du orkar
      cykla i timmar. De flesta kör lugna pass för hårt. Undrar du om du
      cyklar för lätt gör du förmodligen rätt.
    setting: outdoor
    terrain: flat
    erg_mode: false
    main_set:
      - segment: warmup
        duration_min: 10
        zone: 1
        description: "Börja riktigt lätt (Z1) och öka långsamt till lugnt (Z2)"
      - segment: continuous
        duration_min: "{duration_min} - 15"
        zone: 2
        cadence_rpm: [85, 95]
        description: |
          Jämnt och lugnt (Z2). Styr på känslan (eller watten), inte på pulsen —
          det gör inget att pulsen kryper uppåt så länge den håller sig i Z2.
          I värme eller om du druckit för lite stiger den mer; sänk farten något.
      - segment: cooldown
        duration_min: 5
        zone: 1
    total_duration_min:
      estimated: "{duration_min}"
      flexible_range: ["{duration_min} - 15", "{duration_min} + 30"]
    zone_refs: [Z1, Z2]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Pulsen har krupit upp mer än 10 slag/min fast farten är densamma → du behöver äta eller dricka; ta paus eller avbryt"
      - "Pass över 180 min: har du inte ätit på 60 min eller mer → avbryt långpasset"
    coach_notes: |
      Mall för platta långpass utomhus. För kuperade rutter, använd
      AE2_bike_01 (Rolling Endurance). För indoor-version, använd
      AE2_bike_02 (Trainer Z2).

  # ─────────────────────────────────────────────────────────────
  # AE2 — konkreta varianter
  # ─────────────────────────────────────────────────────────────

  - code: AE2_bike_01
    discipline: bike
    category: AE
    type_code: AE2
    name: "Böljande långtur — låt backarna styra"
    phase_appropriate: [base_1, base_2, base_3, build_1]
    parameterized: true
    parameters:
      duration_min:
        default: 145
        range: [60, 300]
        description: "Total tid. 60-90 i prep/tidig base, 120-180 i base, 180-300 i sen base/build."
    intent: |
      Lång, lugn tur i kuperad terräng. Backarna ger variation av sig
      själva. Håll dig lugnt (Z2) i snitt över passet — det får bli tyngre
      en kort stund i backarna, ta det lugnare på de platta partierna.
      Växla ned tidigt i backarna så att trampfrekvensen inte faller under
      75 varv/min.
    setting: outdoor
    terrain: rolling
    outdoor_only: true
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.10
        zone: 1
        description: "Välj platta vägar i början om det går"
      - segment: continuous
        duration_pct: 0.83
        zone: 2
        cadence_rpm: [80, 95]
        description: |
          Lugnt (Z2) i snitt. I backarna får det bli lite tyngre (nedre Z3) en
          kort stund, men stanna inte där. Växla ned tidigt så att
          trampfrekvensen håller sig över 75 varv/min.
      - segment: cooldown
        duration_pct: 0.07
        zone: 1
    total_duration_min:
      estimated: 145
      flexible_range: [60, 300]
    zone_refs: [Z1, Z2, Z3]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Backarna tvingar dig upp i hård ansträngning (Z4) gång på gång → välj en plattare runda"
    coach_notes: |
      Bättre än ren platt Z2 för adepter som kommer att tävla på kuperade
      banor. Även inför platta tävlingsbanor är det värdefullt — vind
      beter sig som backar. Bra alternativ när vädret stör lång
      jämn-watt-träning.

  - code: AE2_bike_02
    discipline: bike
    category: AE
    type_code: AE2
    name: "Jämn spinn på rullen"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 90
        range: [45, 180]
        description: "60 i prep, 90 i base, 120-180 i build. Sällan över 180 inomhus."
    intent: |
      Lugnt uthållighetspass på trainern. Med låst effekt håller trainern
      dig på exakt rätt watt — bra för att lära dig hur jämnt och lugnt (Z2)
      känns. Det är tråkigare än ute, så ordna något att lyssna eller titta
      på. Träningseffekten är densamma.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.11
        zone: 1
        erg_mode: false
        description: "Öka i egen takt från riktigt lätt (Z1) till lugnt (Z2)"
      - segment: continuous
        duration_pct: 0.83
        zone: 2
        cadence_rpm: [85, 95]
        description: "Trainern låser effekten mitt i den lugna zonen (Z2, ≈ 70 % av FTP). Utan låst effekt: håll en jämn, lugn ansträngning."
      - segment: cooldown
        duration_pct: 0.06
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 90
      flexible_range: [45, 180]
    zone_refs: [Z1, Z2]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Pulsen har krupit upp mer än 10 slag/min fast effekten är densamma → ät och drick, ta paus eller avbryt"
    coach_notes: |
      Default-pass när väder/trafik gör utomhus opraktiskt. ERG-mode tar
      bort möjligheten att glida nedåt i watt (vanlig fallgrop vid trötthet).
      Skala duration efter ork — 60 i prep, 90 i base, 120 i build.

  - code: AE2_bike_03
    discipline: bike
    category: AE
    type_code: AE2
    name: "Lugn tur med sex snabbtrampningar"
    phase_appropriate: [base_1, base_2, base_3, build_1]
    parameterized: true
    parameters:
      duration_min:
        default: 80
        range: [60, 120]
        description: "6 spin-ups är fasta (≈21 min struktur). Totalen styr Z2-volymen runt."
    intent: |
      Jämn, lugn cykling (Z2) med 6 korta snabbtrampningar: i en minut
      trampar du snabbare utan att trampa hårdare. Det håller benen
      snabba och tramptekniken ren medan du bygger uthållighet, och det
      tröttar knappt alls. Ungefär som stegringar för löpare.
    setting: either
    terrain: flat
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: continuous
        duration_pct: 0.38
        zone: 2
        cadence_rpm: [85, 95]
      - segment: main
        sets: 6
        duration_min: 1
        zone: 2
        effort_descriptor: "Öka mjukt till 110-115 varv/min. Ansträngningen får stiga till nedre Z3 men inte högre. Trampa runt och mjukt — studsa inte i sadeln."
        cadence_rpm: [110, 115]
        rest_sec: 180
        description: "Cykla lugnt (Z2) mellan varje"
      - segment: continuous
        duration_pct: 0.19
        zone: 2
        cadence_rpm: [85, 95]
      - segment: cooldown
        duration_pct: 0.06
        zone: 1
    total_duration_min:
      estimated: 80
      flexible_range: [60, 120]
    zone_refs: [Z1, Z2]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Blir det tyngre än Z3 i snabbtrampningarna → trampa lättare och låt bara trampfrekvensen öka"
    coach_notes: |
      Billigt sätt att hålla snabba-ben-egenskaper i base-fasen. Spin-ups
      triggar inte träningsstress värd att räkna i veckoplaneringen. Kan
      köras både ute och inne — på trainer hjälper kadens-sensorn att
      verkligen nå 110+.

  - code: AE2_bike_04
    discipline: bike
    category: AE
    type_code: AE2
    name: "Långpass i tävlingsfart — mage och ben"
    phase_appropriate: [build_1, build_2, peak]
    parameterized: false
    intent: |
      Långpasset som tränar exakt det tävlingen kräver: långa block i din
      tävlingsfart (68-73 % av FTP) i tävlingsposition, och du äter och
      dricker som på tävlingen. Farten ligger mellan lugnt (Z2) och tempo —
      så cyklas en Ironman, varken lugn distans eller tröskelpass. Den ska
      kännas hanterbar i timmar; blir den tung efter en timme är antingen
      dagsformen eller tävlingsplanen fel.
    setting: outdoor
    terrain: flat
    erg_mode: false
    main_set:
      - segment: warmup
        duration_min: 20
        zone: 1
        description: "Cykla lätt, de sista 5 min lugnt (nedre Z2)"
      - segment: main
        sets: 3
        duration_min: 50
        rest_sec: 600
        effort_descriptor: "Tävlingsfart för Ironman: stadigt men hållbart i timmar (68-73 % av FTP), i aeroposition"
        cadence_rpm: [85, 95]
        description: |
          3 × 50 min i tävlingsfart med 10 min avslappnat och lugnt (Z2)
          mellan blocken. Ät som på tävlingen från minut 20: kolhydrater var
          15-20:e minut enligt DIN plan (se mat och dryck i profilen) — passet
          tränar magen lika mycket som benen. Ligg kvar i aeropositionen genom
          blocken; res dig bara för att äta och sträcka på dig, i samma rytm
          som på tävlingen.
      - segment: cooldown
        duration_min: 10
        zone: 1
    total_duration_min:
      estimated: 200
      flexible_range: [150, 270]
    zone_refs: [Z1, Z2, Z3]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Yrsel, illamående eller plötsligt helt slut på energi → sitt upp, cykla riktigt lätt (Z1), avbryt om det inte släpper"
      - "Pulsen kryper uppåt mer än 10 % i block 2 fast farten är densamma → sänk ansträngningen lite (5 % lägre watt) och se över vad du äter och dricker"
      - "Tävlingsfarten ger hård puls (Z4) → dagsformen sviker eller din tröskel (FTP) är fel satt; avbryt blocket och rapportera"
      - "Ryggen låser sig i aeropositionen → byt ställning oftare; sitter det i, avbryt och säg till"
    coach_notes: |
      Bankens viktigaste cykelpass i build/peak för långdistans. Skala
      via blocken: 2×45 (tidig build) → 3×50 → 3×60 (sen build). I peak:
      2×40 räcker — intensiteten kvar, volymen ner. Utfallet (watt, puls,
      intag, position) är direkt input till race-planen. Fyll INTE
      passet med extra Z2 efteråt — race-watt-blocken ÄR passet.
