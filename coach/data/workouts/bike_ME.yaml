# Cykelpass — Muskulär Uthållighet (ME)
#
# ME1 — Cruise Intervals: tröskelintervaller (Z4) av medellång längd
#                         med kort vila. Klassiskt FTP-byggande.
#
# ME2 — Hill Cruise Intervals: Z4-intervaller i backe, kombinerar
#                              tröskelarbete med backe-specifik styrka.
#
# ME3 — Crisscross: växlande Z3/Z4 utan helt återhämtning, tränar
#                   tolerans för laktatklarering vid tröskel.
#
# ME4 — Threshold Ride: längre sammanhängande Z4 (15-40 min block).
#                       Mer mentalt än ME1, samma fysiska adaption.

workouts:

  # ─────────────────────────────────────────────────────────────
  # ME1 — Cruise Intervals
  # ─────────────────────────────────────────────────────────────

  - code: ME1_bike_01
    discipline: bike
    category: ME
    type_code: ME1
    name: "Tröskelblock 4×8 min"
    phase_appropriate: [base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 70
        range: [60, 90]
        description: "4 × 8 min + 3 × 4 min vila = 44 min fasta reps."
    intent: |
      Fyra block på 8 minuter på tröskeln — den ansträngning du orkar hålla
      i ungefär en timme (Z4, ≈100 % av FTP). Totalt 32 minuter hårt, med
      4 minuters vila emellan: kort nog att tröttheten byggs på, lång nog
      att du orkar hela vägen. Styr efter känslan (eller watt om du har
      effektmätare). Pulsen hänger efter och når Z4 först från block 2.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.21
        zone: 1
        erg_mode: false
        description: "Mot slutet: 2 × 1 min där du ökar gradvis upp mot Z3"
      - segment: main
        sets: 4
        duration_min: 8
        zone: 4
        cadence_rpm: [85, 95]
        rest_sec: 240
        description: "På tröskeln (Z4, ≈100 % av FTP). Trampa lugnt i vilan (Z1–Z2)."
      - segment: cooldown
        duration_pct: 0.14
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 70
      flexible_range: [60, 90]
    zone_refs: [Z1, Z4]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Sista blocket blir klart svagare än det första (watt mer än 10 % lägre) → avbryt det och varva ned"
      - "Pulsen går över Z4 redan i första blocket → nivån är troligen för högt satt (FTP), sänk den"
    coach_notes: |
      Default ME1. På trainer (ERG) ger absolut kontroll; outdoor kräver
      rak lång rutt utan stopp. 4×8 är välbalanserad dos — utöka till 5×8
      i build_2 eller välj ME4_bike_01 för längre sammanhängande arbete.

  - code: ME1_bike_02
    discipline: bike
    category: ME
    type_code: ME1
    name: "Tröskelblock 3×12 min"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 75
        range: [65, 95]
        description: "3 × 12 min + 2 × 5 min vila = 46 min fasta reps."
    intent: |
      Tre block på 12 minuter på tröskeln — den ansträngning du orkar hålla
      i ungefär en timme (Z4). Totalt 36 minuter, med 5 minuters vila
      emellan. Längre block än i 4 × 8 min och tuffare i huvudet. Ett bra
      nästa steg efter det passet.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.20
        zone: 1
        erg_mode: false
      - segment: main
        sets: 3
        duration_min: 12
        zone: 4
        cadence_rpm: [85, 95]
        rest_sec: 300
        description: "På tröskeln (Z4, ≈98–100 % av FTP). Trampa lugnt i 5 min vila."
      - segment: cooldown
        duration_pct: 0.13
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 75
      flexible_range: [65, 95]
    zone_refs: [Z1, Z4]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Du orkar inte det tredje blocket → avbryt och avsluta passet"
    coach_notes: |
      Build-fas-specifik. Tar adepten ett steg närmare ME4 (kontinuerlig
      tröskel) utan att tappa intervall-strukturen helt.

  - code: ME1_bike_03
    discipline: bike
    category: ME
    type_code: ME1
    name: "Tröskel 5×6 min — hård start, håll emot"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 70
        range: [60, 90]
        description: "5 × 6 min + 4 × 3 min vila = 42 min fasta reps."
    intent: |
      Varje block börjar strax över tröskeln och fortsätter strax under.
      Tröskeln är den ansträngning du orkar hålla i ungefär en timme. De
      första 2 minuterna ligger mitt i Z4, de sista 4 sjunker till nedre Z4
      (98–100 % av FTP). Du tränar på att hålla trycket när benen börjar
      protestera — både kropp och huvud får jobba.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.21
        zone: 1
        erg_mode: false
      - segment: main
        sets: 5
        duration_min: 6
        zone: 4
        pattern:
          - { duration_min: 2, pct: [101, 105] }
          - { duration_min: 4, pct: [98, 100] }
        effort_descriptor: "Första 2 min: strax över tröskeln (Z4, ≈103 % av FTP). Sista 4 min: strax under (nedre Z4, 98–100 % av FTP). Effekten sjunker, men det känns lika tungt."
        cadence_rpm: [85, 95]
        rest_sec: 180
      - segment: cooldown
        duration_pct: 0.14
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 70
      flexible_range: [60, 90]
    zone_refs: [Z1, Z4]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Du orkar inte hålla Z4 de sista 4 minuterna → avbryt blocket och vila lite extra"
    coach_notes: |
      ERG-läget behöver utdesignas manuellt i Garmin Connect (varierande
      watt-target inom varje rep). Alternativt köra fast watt = 101% FTP.

  # ─────────────────────────────────────────────────────────────
  # ME2 — Hill Cruise Intervals
  # ─────────────────────────────────────────────────────────────

  - code: ME2_bike_01
    discipline: bike
    category: ME
    type_code: ME2
    name: "Tröskel i backe — 4×6 min"
    phase_appropriate: [base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 80
        range: [70, 100]
        description: "4 × 6 min + 3 × 6 min vila = 42 min fasta reps."
    intent: |
      Tröskelintervaller i backe. Hitta en backe som tar 6 minuter att
      cykla uppför (1,5–2 km, 4–6 %). Lägg dig på tröskeln — den ansträngning
      du orkar hålla i ungefär en timme (Z4, ≈100 % av FTP). Backen hjälper
      dig att hålla trycket, och den låga trampfrekvensen ger styrka i benen.
    setting: outdoor
    terrain: hilly
    outdoor_only: true
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.25
        zone: 1
        description: "Rulla till backens fot, med 2 min lugnt (Z2) på vägen"
      - segment: main
        sets: 4
        duration_min: 6
        zone: 4
        cadence_rpm: [75, 90]
        rest_sec: 360
        description: |
          På tröskeln (Z4, ≈100 % av FTP) uppför backen. Trampfrekvensen får
          sjunka mot 75 varv/min om backen är brant, men aldrig under 70.
          Rulla lugnt ned under de 6 minuternas vila.
      - segment: cooldown
        duration_pct: 0.13
        zone: 1
    total_duration_min:
      estimated: 80
      flexible_range: [70, 100]
    zone_refs: [Z1, Z4]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Fjärde backen blir klart svagare än den första (watt mer än 15 % lägre) → avbryt"
      - "Trampfrekvensen går under 65 varv/min fast du växlat ned → välj en annan backe"
    coach_notes: |
      Mer styrke-tung än ME1_bike_01 — backens lutning ger kraft-belastning
      utöver tröskel-belastningen. Bra build-pass. Kräver tillgänglig backe
      på 6-10 min i jämn lutning.

  - code: ME2_bike_02
    discipline: bike
    category: ME
    type_code: ME2
    name: "Tröskelbackar 6×4 min"
    phase_appropriate: [base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 75
        range: [65, 95]
        description: "6 × 4 min + 5 × 4 min vila = 44 min fasta reps."
    intent: |
      Sex kortare backintervaller på tröskeln — den ansträngning du orkar
      hålla i ungefär en timme (Z4). Hitta en backe som tar 4 minuter
      (≈1 km, 5–8 %). Intervallerna är kortare än vanliga tröskelblock
      (8–12 min), men du gör fler: totalt 24 minuter. Mycket backe på kort tid.
    setting: outdoor
    terrain: hilly
    outdoor_only: true
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.20
        zone: 1
      - segment: main
        sets: 6
        duration_min: 4
        zone: 4
        cadence_rpm: [75, 90]
        rest_sec: 240
        description: "Mitten till övre delen av tröskeln (Z4). Rulla ned under 4 min vila."
      - segment: cooldown
        duration_pct: 0.13
        zone: 1
    total_duration_min:
      estimated: 75
      flexible_range: [65, 95]
    zone_refs: [Z1, Z4]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Sjätte backen blir klart svagare än den första (snittwatt under 90 %) → avbryt"
    coach_notes: |
      Kortare backe = lättare att hitta. Mer fokus på tröskel-watt än
      ME2_bike_01; mindre styrkemoment per rep (men summan över 6 reps
      blir betydande).

  # ─────────────────────────────────────────────────────────────
  # ME3 — Crisscross
  # ─────────────────────────────────────────────────────────────

  - code: ME3_bike_01
    discipline: bike
    category: ME
    type_code: ME3
    name: "Vågspel kring tröskeln — 3×10 min"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 75
        range: [65, 90]
        description: "3 × 10 min + 2 × 5 min vila = 40 min fasta reps."
    intent: |
      Du växlar mellan tröskeln (Z4) och strax under (Z3) utan riktig vila.
      Tröskeln är den ansträngning du orkar hålla i ungefär en timme. Tre
      block på 10 minuter, i varje block 1 min Z4 och 1 min Z3 om vartannat.
      Kroppen lär sig att hämta sig medan du fortfarande trampar hårt. Bra
      inför en Ironman, där trycket hela tiden ändras med backar och vind.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.20
        zone: 1
        erg_mode: false
      - segment: main
        sets: 3
        duration_min: 10
        zone: 4
        pattern:
          - { duration_min: 1, zone: 4 }
          - { duration_min: 1, zone: 3 }
        effort_descriptor: "Om vartannat: 1 min strax över tröskeln (Z4, ≈105 % av FTP) och 1 min lite lättare (Z3, ≈85 % av FTP). 5 gånger var per block. Ingen vila inne i blocket."
        cadence_rpm: [85, 95]
        rest_sec: 300
      - segment: cooldown
        duration_pct: 0.13
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 75
      flexible_range: [65, 90]
    zone_refs: [Z1, Z3, Z4]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Du kommer inte upp i Z4 efter andra blocket → avbryt"
      - "De lättare minuterna känns lika tunga som Z4 → du hinner inte hämta dig, sänk de hårda minuterna"
    coach_notes: |
      Crisscross kräver ERG-läge för exakt watt-skifte. Mycket effektivt
      tröskelpass men hård dos — använd inte oftare än varannan vecka i
      build. Effort_descriptor används istället för zone eftersom passet
      växlar mellan zoner.

  - code: ME3_bike_02
    discipline: bike
    category: ME
    type_code: ME3
    name: "Långa vågor kring tröskeln — 2×15 min"
    phase_appropriate: [build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 80
        range: [70, 95]
        description: "2 × 15 min + 1 × 10 min vila = 40 min fasta reps."
    intent: |
      Samma växling som i 3 × 10 min, men längre: 2 min på tröskeln (Z4)
      och 2 min strax under (Z3) om vartannat, i två block på 15 minuter.
      Tröskeln är den ansträngning du orkar hålla i ungefär en timme.
      Totalt 16 minuter i Z4 (mot 15 i 3 × 10 min). De längre hårda
      minuterna gör att tröttheten hinner byggas på mer innan du får lätta.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.19
        zone: 1
        erg_mode: false
      - segment: main
        sets: 2
        duration_min: 15
        zone: 4
        pattern:
          - { duration_min: 2, zone: 4 }
          - { duration_min: 2, zone: 3 }
        effort_descriptor: "Om vartannat: 2 min strax över tröskeln (Z4, ≈103 % av FTP) och 2 min lite lättare (Z3, ≈85 % av FTP). 4 gånger var per block. Ingen vila inne i blocket."
        cadence_rpm: [85, 95]
        rest_sec: 600
      - segment: cooldown
        duration_pct: 0.13
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 80
      flexible_range: [70, 95]
    zone_refs: [Z1, Z3, Z4]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Du orkar inte det andra blocket → avbryt och avsluta"
    coach_notes: |
      Avancerad build_2-variant. Längre Z4-segment ger mer laktatackumulation
      per cykel. 10 min vila mellan blocken är generös — använd den för
      hydrering och mental reset.

  # ─────────────────────────────────────────────────────────────
  # ME4 — Threshold Ride
  # ─────────────────────────────────────────────────────────────

  - code: ME4_bike_01
    discipline: bike
    category: ME
    type_code: ME4
    name: "Klassikern: 2×20 min på tröskeln"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 75
        range: [65, 90]
        description: "2 × 20 min + 1 × 10 min vila = 50 min fasta reps."
    intent: |
      Två block på 20 minuter på tröskeln — den ansträngning du orkar hålla
      i ungefär en timme (mitt i Z4). "2 × 20" är ett av cyklingens mest
      beprövade pass för att höja tröskeln. Det är tufft i huvudet: efter
      en stund börjar tankarna argumentera emot. Håll jämnt tryck genom
      hela blocket och rusa inte iväg i början.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.20
        zone: 1
        erg_mode: false
        description: "Lägg in 1 × 2 min där du ökar gradvis upp mot nedre Z4"
      - segment: main
        sets: 2
        duration_min: 20
        zone: 4
        cadence_rpm: [85, 95]
        rest_sec: 600
        description: "Strax under till mitt på tröskeln (Z4, ≈96–100 % av FTP). 10 min vila, ta den lugnt."
      - segment: cooldown
        duration_pct: 0.13
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 75
      flexible_range: [65, 90]
    zone_refs: [Z1, Z4]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Andra blocket blir klart svagare än det första (watt under 90 %) → avbryt och avsluta tidigt"
      - "Pulsen går upp i Z5 redan i första blocket → för hårt, din nivå behöver troligen testas om (FTP-test)"
    coach_notes: |
      Default ME4. ERG ger maximal kontroll. För adepter som inte tål 2×20
      mentalt än, börja med ME1_bike_01 (4×8) eller ME1_bike_02 (3×12).

  - code: ME4_bike_02
    discipline: bike
    category: ME
    type_code: ME4
    name: "40 min tröskel i ett stycke"
    phase_appropriate: [build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 75
        range: [70, 100]
        description: |
          40 min Z4-block är fast (det är protokollet — kortare = annan ME4-variant).
          Totalen styr warmup/cooldown-utrymme runt det.
    intent: |
      40 minuter i ett stycke på tröskeln — den ansträngning du orkar hålla
      i ungefär en timme. Det längsta tröskelpasset: klarar du det ger det
      mycket, men det måste passa din form. Bara om du redan har kört
      tröskelblock och din nivå är stabil. Lägg dig strax under tröskeln
      (nedre Z4, ≈95–98 % av FTP).
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.27
        zone: 1
        erg_mode: false
        description: "Längre uppvärmning än vanligt. Mot slutet: 2 × 2 min lite piggare (Z2–Z3)."
      - segment: main
        duration_min: 40
        zone: 4
        cadence_rpm: [85, 95]
        description: "Strax under tröskeln (nedre Z4, ≈95–98 % av FTP). Hitta rytmen tidigt och håll den. Stäm av med dig själv var 5:e minut."
      - segment: cooldown
        duration_pct: 0.20
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 75
      flexible_range: [70, 100]
    zone_refs: [Z1, Z4]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Du tappar tydligt i 5 minuter i sträck (watt mer än 10 % lägre) → avbryt och varva ned"
      - "Pulsen går över Z4 och stannar där → avbryt"
    coach_notes: |
      Använd sparsamt — max var 3:e vecka i build_2. För hård dos om FTP
      inte är aktuell. Kör hellre 2×20 (ME4_bike_01) om osäker.

  - code: ME4_bike_03
    discipline: bike
    category: ME
    type_code: ME4
    name: "Tröskel ute på vägen — 3×15 min"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 90
        range: [80, 110]
        description: "3 × 15 min + 2 × 6 min vila = 57 min fasta reps."
    intent: |
      Tröskelpasset för utomhus: tre block på 15 minuter på tröskeln — den
      ansträngning du orkar hålla i ungefär en timme. Mittemellan korta och
      långa tröskelblock. Det går bra utan låst effekt på trainern, så länge
      vägen är lång och ganska platt. Var vaksam: utomhus glider du lätt
      ned i Z3 utan att märka det.
    setting: outdoor
    terrain: flat
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.22
        zone: 1
        description: "Lägg in 2 × 2 min där du ökar gradvis från Z2 till Z3"
      - segment: main
        sets: 3
        duration_min: 15
        zone: 4
        cadence_rpm: [85, 95]
        rest_sec: 360
        description: "På tröskeln (Z4, ≈98–100 % av FTP). Trampa lugnt i 6 min vila (Z1–Z2)."
      - segment: cooldown
        duration_pct: 0.11
        zone: 1
    total_duration_min:
      estimated: 90
      flexible_range: [80, 110]
    zone_refs: [Z1, Z2, Z4]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Tredje blocket blir klart svagare än det första (snittwatt under 92 %) → avbryt"
      - "Du måste stanna mitt i ett block, t.ex. vid rödljus → räkna inte blocket, börja gärna om"
    coach_notes: |
      För adepter som föredrar utomhus och har lång rak rutt tillgänglig.
      Mentalt ofta lättare än trainer (omgivningen bryter monotonin) men
      mer störningar (trafik, vind). Välj baserat på adeptens preferens
      och rutt-tillgång.
