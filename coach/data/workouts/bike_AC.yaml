# Cykelpass — Aerob Kapacitet (AC)
#
# AC1 — VO2Max Intervals: korta hårda intervaller på Z5 (3-5 min) eller
#                         mycket korta (30/30). Maximal syreupptag.
#
# AC2 — Pyramid Intervals: stegrande/avtagande intervaller i Z5,
#                          t.ex. 1-2-3-2-1 min.
#
# AC3 — Hill Intervals: korta Z5-intervaller i backe. Kombinerar
#                       maximal kapacitet med specifik backe-stress.

workouts:

  # ─────────────────────────────────────────────────────────────
  # AC1 — VO2Max Intervals
  # ─────────────────────────────────────────────────────────────

  - code: AC1_bike_01
    discipline: bike
    category: AC
    type_code: AC1
    name: "5×3 min där luften tar slut"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 65
        range: [55, 80]
        description: "5 × 3 min + 4 × 3 min vila = 27 min fasta reps."
    intent: |
      Klassiska maxintervaller: fem block på 3 minuter mycket hårt (Z5,
      110–120 % av FTP), totalt 15 minuter nära det hårdaste du klarar. Det
      här är passet där du undrar vad du gjorde fel i livet. Vilan är lika
      lång som jobbet, så du hinner aldrig hämta dig helt — det är meningen.
      Du andas tungt hela tiden.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.31
        zone: 1
        erg_mode: false
        description: "Lägg in 2 × 1 min där du ökar gradvis mot Z4, och 30 sek hårt (Z5) för att väcka benen"
      - segment: main
        sets: 5
        duration_min: 3
        zone: 5
        cadence_rpm: [90, 105]
        rest_sec: 180
        description: |
          Mycket hårt (mitt i Z5, ≈115 % av FTP). Trampa lugnt i vilan (Z1–Z2).
          Hitta i första intervallen en nivå du kan hålla; det är i nummer 4–5
          som passet gör nytta.
      - segment: cooldown
        duration_pct: 0.15
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 65
      flexible_range: [55, 80]
    zone_refs: [Z1, Z5]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Femte intervallen blir klart svagare än den första (watt under 90 %) → avbryt den"
      - "Pulsen kommer inte upp i Z5 fast du tar i allt du kan → du är slut för i dag, avbryt"
      - "Kraftig huvudvärk eller yrsel → avbryt direkt"
    coach_notes: |
      Default AC1. Mycket effektivt men hård dos — använd max 1-2 gånger
      per vecka i build, inte alls i prep eller base. ERG hjälper hålla
      watt när tankarna börjar argumentera mot.

  - code: AC1_bike_02
    discipline: bike
    category: AC
    type_code: AC1
    name: "30 sek på, 30 sek av — 20 varv"
    phase_appropriate: [build_1, build_2, peak]
    parameterized: true
    parameters:
      duration_min:
        default: 50
        range: [40, 60]
        description: "20 × 30 sek + 19 × 30 sek vila + sista vila = 20 min fasta reps."
    intent: |
      30 sek hårt, 30 sek lugnt, 20 gånger. Totalt 10 minuter hårt, och
      trycket är högre än i 3-minutersintervaller eftersom bitarna är så
      korta. Pulsen hinner aldrig lägga sig, så styr efter känslan. Andningen
      och hjärtat får jobba maximalt, medan benen inte blir lika slitna.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.30
        zone: 1
        erg_mode: false
        description: "Inkludera 1 × 30 sek Z5 mot slutet som öppnare"
      - segment: main
        sets: 20
        duration_sec: 30
        zone: 5
        effort_descriptor: "30 sek mycket hårt (120–130 % av FTP, ≈1,25 × FTP). Runt, jämnt tramptag och hög trampfrekvens."
        cadence_rpm: [95, 110]
        rest_sec: 30
        description: "30 sek lugn trampning — lätt motstånd, håll benen i rörelse"
      - segment: cooldown
        duration_pct: 0.20
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 50
      flexible_range: [40, 60]
    zone_refs: [Z1, Z5]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Intervall 15–20 blir klart svagare än de första fem (watt mer än 15 % lägre) → hoppa över resten"
      - "Trampfrekvensen sjunker under 85 varv/min i de hårda bitarna → benen är slut, avbryt"
    coach_notes: |
      Klassisk Tabata-inspirerad protokoll, modifierad för cykel. ERG
      krävs absolut — på 30 sek tappar man watt-target utan automation.
      Bra alternativ till AC1_bike_01 när du vill ha mindre muskulär
      stress (lättare återhämtning till nästa dag).

  - code: AC1_bike_03
    discipline: bike
    category: AC
    type_code: AC1
    name: "4×4 — hårda minuter med kort vila"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 65
        range: [55, 80]
        description: "4 × 4 min + 3 × 3 min vila = 25 min fasta reps."
    intent: |
      "Norska 4×4": fyra maxintervaller på 4 minuter mycket hårt (Z5), med
      3 minuters vila. Lite längre intervaller än i 5 × 3 min men kortare
      total tid, så benen blir mindre slitna. Ett bra mellanting, och
      forskningen (Helgerud-protokollet) pekar ut det som den bästa dosen
      för att höja syreupptagningen.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.31
        zone: 1
        erg_mode: false
      - segment: main
        sets: 4
        duration_min: 4
        zone: 5
        cadence_rpm: [90, 105]
        rest_sec: 180
        description: "Mycket hårt (nedre Z5, ≈110–115 % av FTP). Pulsen ska upp över 90 % av din maxpuls under sista minuten av varje intervall."
      - segment: cooldown
        duration_pct: 0.15
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 65
      flexible_range: [55, 80]
    zone_refs: [Z1, Z5]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Pulsen kommer inte över 90 % av maxpulsen i intervall 1–2 → du är inte tillräckligt uppvärmd, eller trött i hela kroppen"
      - "Fjärde intervallen blir klart svagare än den första (watt under 90 %) → avbryt"
    coach_notes: |
      Något lättare än AC1_bike_01 (4 min vs 3 min är paradoxalt mindre
      stressande pga längre vila). För adepter som AC1_bike_01 var för
      hård för.

  # ─────────────────────────────────────────────────────────────
  # AC2 — Pyramid Intervals
  # ─────────────────────────────────────────────────────────────

  - code: AC2_bike_01
    discipline: bike
    category: AC
    type_code: AC2
    name: "Hård pyramid — 1/2/3/2/1 min"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 55
        range: [45, 70]
        description: "Pyramid 1+2+3+2+1 + vila 1+2+3+2 = 17 min fasta reps."
    intent: |
      Maxintervaller som en pyramid: 1, 2, 3, 2, 1 min mycket hårt (Z5), med
      lika lång vila som intervallen. Växlingen gör det lättare att hålla
      fokus, och toppen på 3 minuter är där kroppen tar upp mest syre.
      Lättare i huvudet än 5 × 3 min, men ger lika mycket.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.36
        zone: 1
        erg_mode: false
      - segment: main
        duration_min: 1
        zone: 5
        cadence_rpm: [95, 110]
        rest_sec: 60
      - segment: main
        duration_min: 2
        zone: 5
        cadence_rpm: [95, 105]
        rest_sec: 120
      - segment: main
        duration_min: 3
        zone: 5
        cadence_rpm: [90, 100]
        rest_sec: 180
      - segment: main
        duration_min: 2
        zone: 5
        cadence_rpm: [95, 105]
        rest_sec: 120
      - segment: main
        duration_min: 1
        zone: 5
        cadence_rpm: [95, 110]
      - segment: cooldown
        duration_pct: 0.18
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 55
      flexible_range: [45, 70]
    zone_refs: [Z1, Z5]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Du klarar inte toppen på 3 min → kör 2 min i stället och hoppa över den sista minutintervallen"
    coach_notes: |
      Total Z5-tid: 9 min — mindre än 5×3 men distribuerat över pyramiden.
      Bra introduktion till AC1 för adept som inte kört VO2-träning förut.

  - code: AC2_bike_02
    discipline: bike
    category: AC
    type_code: AC2
    name: "Sekundpyramid — 30/60/90 och ner igen"
    phase_appropriate: [build_1, build_2, peak]
    parameterized: true
    parameters:
      duration_min:
        default: 50
        range: [40, 65]
        description: "2 pyramider med vila = ≈22 min fasta reps."
    intent: |
      Pyramid med korta intervaller: 30, 60, 90, 60, 30 sek, med lika lång
      vila som intervallen. Hårdare tryck än i minutpyramiden (≈120 % av FTP
      på 30 sek, ≈115 % på 90 sek). Pulsen hinner aldrig lägga sig, så styr
      efter känslan.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.30
        zone: 1
        erg_mode: false
      - segment: main
        duration_sec: 30
        zone: 5
        effort_descriptor: "Mycket hårt, jämnt tramptag (120 % av FTP)"
        cadence_rpm: [100, 110]
        rest_sec: 30
      - segment: main
        duration_sec: 60
        zone: 5
        effort_descriptor: "Mycket hårt (118 % av FTP)"
        cadence_rpm: [95, 105]
        rest_sec: 60
      - segment: main
        duration_sec: 90
        zone: 5
        effort_descriptor: "Hårt men kontrollerat, du ska orka hela 90 sek (115 % av FTP)"
        cadence_rpm: [95, 105]
        rest_sec: 90
      - segment: main
        duration_sec: 60
        zone: 5
        effort_descriptor: "Mycket hårt (118 % av FTP)"
        cadence_rpm: [95, 105]
        rest_sec: 60
      - segment: main
        duration_sec: 30
        zone: 5
        effort_descriptor: "Mycket hårt, jämnt tramptag (120 % av FTP)"
        cadence_rpm: [100, 110]
        rest_sec: 60
      - segment: main
        duration_sec: 30
        zone: 5
        effort_descriptor: "Pyramid 2 börjar. Mycket hårt (120 % av FTP)"
        cadence_rpm: [100, 110]
        rest_sec: 30
      - segment: main
        duration_sec: 60
        zone: 5
        effort_descriptor: "Mycket hårt (118 % av FTP)"
        cadence_rpm: [95, 105]
        rest_sec: 60
      - segment: main
        duration_sec: 90
        zone: 5
        effort_descriptor: "Hårt men kontrollerat, du ska orka hela 90 sek (115 % av FTP)"
        cadence_rpm: [95, 105]
        rest_sec: 90
      - segment: main
        duration_sec: 60
        zone: 5
        effort_descriptor: "Mycket hårt (118 % av FTP)"
        cadence_rpm: [95, 105]
        rest_sec: 60
      - segment: main
        duration_sec: 30
        zone: 5
        effort_descriptor: "Mycket hårt, jämnt tramptag (120 % av FTP)"
        cadence_rpm: [100, 110]
      - segment: cooldown
        duration_pct: 0.20
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 50
      flexible_range: [40, 65]
    zone_refs: [Z1, Z5]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Pyramid 2 blir klart svagare än den första (watt under 90 %) → avbryt den efter 90-sekundersintervallen"
    coach_notes: |
      Två pyramider i sekvens med 1 min vila mellan. Total Z5-tid: 11 min
      (vs 9 min i AC2_bike_01) men kortare reps gör det möjligt att hålla
      högre watt. Effort_descriptor pga varierande watt-target inom passet.

  # ─────────────────────────────────────────────────────────────
  # AC3 — Hill Intervals
  # ─────────────────────────────────────────────────────────────

  - code: AC3_bike_01
    discipline: bike
    category: AC
    type_code: AC3
    name: "Hårda backryck 6×2 min"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 70
        range: [60, 90]
        description: "6 × 2 min + 5 × 4 min vila = 32 min fasta reps."
    intent: |
      Korta, hårda backintervaller. Hitta en backe som tar 2 minuter (oftast
      500–700 m, 6–10 %). Kör mycket hårt (Z5, ≈115–120 % av FTP). Du tränar
      både andningen och benen i backe — det du behöver på en Ironman med
      backar eller motvind. Mycket hårt, men kort.
    setting: outdoor
    terrain: hilly
    outdoor_only: true
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.29
        zone: 1
        description: "Mot slutet: 2 × 30 sek där du ökar gradvis från Z3 till Z4"
      - segment: main
        sets: 6
        duration_min: 2
        zone: 5
        cadence_rpm: [85, 100]
        rest_sec: 240
        description: |
          Mycket hårt (mitt i Z5). Rulla lugnt ned i vilan. 4 minuter är gott
          om vila, men du behöver den för att orka sex gånger.
      - segment: cooldown
        duration_pct: 0.14
        zone: 1
    total_duration_min:
      estimated: 70
      flexible_range: [60, 90]
    zone_refs: [Z1, Z5]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Sjätte backen blir klart svagare än den första (watt under 90 %) → avbryt"
      - "Trampfrekvensen under 80 varv/min fast du växlat ned → backen är för brant, ta i lite mindre"
    coach_notes: |
      Mer specifik för IM-cykling med vind/backar än indoor VO2. Kräver
      rätt backe — 2-4 min lång med jämn lutning (4-7 %). I peak-fas kan
      reps reduceras till 4 men intensiteten ökas.

  - code: AC3_bike_02
    discipline: bike
    category: AC
    type_code: AC3
    name: "Korta backraketer — 8×90 sek"
    phase_appropriate: [build_2, peak]
    parameterized: true
    parameters:
      duration_min:
        default: 75
        range: [65, 95]
        description: "8 × 90 sek + 7 × 3 min vila = 33 min fasta reps."
    intent: |
      Kortare och ännu hårdare backintervaller. Hitta en backe som tar
      90 sekunder (400–500 m, 8–12 %). Kör nästan fullt (hög Z5 till nedre Z6,
      ≈120–125 % av FTP). Åtta gånger, med vila nog att orka hålla trycket.
      Ett pass för toppningen inför tävlingen: det vässar förmågan att ta i
      riktigt hårt.
    setting: outdoor
    terrain: hilly
    outdoor_only: true
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.27
        zone: 1
      - segment: main
        sets: 8
        duration_sec: 90
        zone: 5
        effort_descriptor: "Mycket hårt men jämnt, inte en spurt för allt du har (hög Z5 till nedre Z6, ≈120–125 % av FTP)."
        cadence_rpm: [85, 100]
        rest_sec: 180
        description: "Rulla lugnt ned till backens fot och hämta dig"
      - segment: cooldown
        duration_pct: 0.13
        zone: 1
    total_duration_min:
      estimated: 75
      flexible_range: [65, 95]
    zone_refs: [Z1, Z5]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Backe 6–8 blir klart svagare än de två första (watt under 90 %) → avbryt"
      - "Första backen känns som en spurt (Z6 eller högre) direkt → för hårt, sänk"
    coach_notes: |
      Mer intensitet, mindre total tid än AC3_bike_01. Peak-fas-pass —
      sista hårdkörningarna 4-3 veckor innan A-race. Inte för build_1
      eller tidigare; för hård dos.
