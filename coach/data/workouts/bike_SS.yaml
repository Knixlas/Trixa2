# Cykelpass — Snabbhetsfärdigheter (SS)
#
# SS1 — Spin-ups: kadensövningar för pedalteknik. Höga kadens-target
#                 (100-120 rpm), watt är sekundärt. Parametriserad mall.
#
# SS2 — Isolated Leg: ett ben i taget för att förbättra rund pedaltramp.
#                     Avslöjar svaga punkter i pedalcykeln (typiskt
#                     dödläge upptill och uppdrag-fasen).

workouts:

  # ─────────────────────────────────────────────────────────────
  # SS1 — Spin-ups (parametriserad mall)
  # ─────────────────────────────────────────────────────────────

  - code: SS1_bike_template
    discipline: bike
    category: SS
    type_code: SS1
    name: "Snabba ben — lek med trampfrekvensen"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2, peak]
    parameterized: true
    parameters:
      sets:
        default: 8
        range: [4, 12]
        description: "Antal spin-up-reps; skala efter pass-fokus"
      target_cadence:
        default: 115
        range: [105, 125]
        description: |
          Övre kadens-target. 105-110 i prep, 110-115 i base,
          115-120 i build/peak. Adepter med god teknik kan gå mot 125.
      duration_min_total:
        default: 60
        range: [40, 90]
        description: "Totalt pass-tid; resten utfylls med Z1-Z2"
    intent: |
      Snabbtrampningar lär benen att trampa snabbt och mjukt utan att du
      studsar i sadeln. Det är trampfrekvensen som räknas: ansträngningen
      får stiga till Z3 men ska inte bli hög. Börjar du studsa i sadeln
      eller gunga med höften är trampfrekvensen för hög — sänk. Bättre 110
      varv/min mjukt än 120 varv/min hackigt.
    setting: either
    terrain: flat
    erg_mode: false
    main_set:
      - segment: warmup
        duration_min: 15
        zone: 1
        description: "Avsluta med 2-3 ökningar på 30 sek där trampfrekvensen gradvis går upp till 100 varv/min"
      - segment: continuous
        duration_min: "({duration_min_total} - 35) / 2"
        zone: 2
        cadence_rpm: [85, 95]
      - segment: main
        sets: "{sets}"
        duration_min: 1
        zone: 2
        effort_descriptor: "Öka under 30 sek från din vanliga trampfrekvens till {target_cadence} varv/min och håll den resten av minuten. Ansträngningen får stiga till nedre-mitten av Z3, men det är inte den du jagar."
        cadence_rpm: [105, "{target_cadence}"]
        rest_sec: 120
        description: "Cykla lätt (Z1-Z2) i den takt som känns naturlig"
      - segment: continuous
        duration_min: "({duration_min_total} - 35) / 2"
        zone: 2
        cadence_rpm: [85, 95]
      - segment: cooldown
        duration_min: 5
        zone: 1
    total_duration_min:
      estimated: "{duration_min_total}"
      flexible_range: ["{duration_min_total} - 10", "{duration_min_total} + 10"]
    zone_refs: [Z1, Z2, Z3]
    equipment: [power_meter, hr_strap, cadence_sensor]
    abort_conditions:
      - "Du studsar i sadeln eller gungar med höften → trampfrekvensen är för hög, sänk"
      - "Knäsmärta när du trampar snabbt → avbryt och få cykelns inställning kontrollerad"
    coach_notes: |
      Det parametriserade fältet på sets gör samma mall användbar genom
      hela året — 4 sets i prep som introduktion, 12 sets i peak som
      neuromuskulär underhåll. Lägg gärna in som "B-pass" på dagar
      med annan huvudfokus (efter ett tröskelpass dagen innan).

  # ─────────────────────────────────────────────────────────────
  # SS2 — Isolated Leg (parametriserad mall)
  # ─────────────────────────────────────────────────────────────

  - code: SS2_bike_template
    discipline: bike
    category: SS
    type_code: SS2
    name: "Ett ben i taget — rund tramp"
    phase_appropriate: [prep, base_1, base_2, base_3]
    parameterized: true
    parameters:
      sets_per_leg:
        default: 4
        range: [2, 6]
        description: "Antal isolated-leg-reps per ben"
      rep_duration_sec:
        default: 45
        range: [30, 90]
        description: "Längd på varje isolated-leg-rep i sekunder"
      duration_min_total:
        default: 50
        range: [40, 70]
        description: "Totalt pass-tid; resten utfylls med Z1-Z2"
    intent: |
      Med ett ben i taget märks det var trampet tappar kraft — benet måste
      själv driva pedalen hela varvet runt. En klassisk teknikövning. Det
      blir tydligt var det hackar (oftast högst upp, mellan klockan 11 och
      1). Motståndet är lågt, det är rundheten som räknas. Det andra benet
      vilar avlastat på sin pedal — sätt det inte ut åt sidan.
    setting: indoor
    requires_trainer: true
    erg_mode: false
    main_set:
      - segment: warmup
        duration_min: 15
        zone: 1
        description: "Avsluta med 2 min lugnt (Z2) med båda benen, jämnt och runt"
      - segment: continuous
        duration_min: 5
        zone: 2
        cadence_rpm: [85, 95]
      - segment: main
        sets: "{sets_per_leg}"
        duration_sec: "{rep_duration_sec}"
        zone: 1
        effort_descriptor: "Trampa med bara höger ben, 80-90 varv/min. Lätt motstånd (Z1). Trampa runt: inget stopp högst upp, inget ryck när pedalen börjar gå nedåt."
        cadence_rpm: [80, 90]
        rest_sec: 30
        description: "Vila: byt ben, 30 sek innan det är vänster bens tur"
      - segment: main
        sets: "{sets_per_leg}"
        duration_sec: "{rep_duration_sec}"
        zone: 1
        effort_descriptor: "Trampa med bara vänster ben, 80-90 varv/min. Samma fokus."
        cadence_rpm: [80, 90]
        rest_sec: 60
      - segment: continuous
        duration_min: "{duration_min_total} - 25 - ({sets_per_leg} * {rep_duration_sec} / 30)"
        zone: 2
        cadence_rpm: [85, 95]
        description: "Lugn cykling med båda benen, tänk på att trampa mjukt och runt"
      - segment: cooldown
        duration_min: 5
        zone: 1
    total_duration_min:
      estimated: "{duration_min_total}"
      flexible_range: ["{duration_min_total} - 10", "{duration_min_total} + 10"]
    zone_refs: [Z1, Z2]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Smärta i höft eller knä → avbryt, det är inte värt det"
      - "Du klarar inte 80 varv/min på ett ben utan att kroppen hjälper till → sänk till 70-75 varv/min eller hoppa över övningen"
    coach_notes: |
      Kräver trainer — utomhus försvinner avlastade benet snabbt (lutar
      ut, tappar pedalen). Vissa adepter klarar bara 30-sek-reps i början;
      bygg upp till 60-90 sek. Underrapporterat övning som ger snabb
      teknisk vinst för adepter med dödläge — ofta märkbart bättre
      pedalkraft inom 2-3 veckors regelbunden träning.
