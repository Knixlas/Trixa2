# Styrkepass — Max Transition (MT)
#
# Protokoll MT enligt strength.yaml. Passar base_1 (första halvan).
# Bryggan mellan AA:s adaptation och MS:s maxstyrka — introducerar
# yttre last på de stora mönstren med fortfarande måttlig intensitet.
#
# Last: RIR-styrd, måttlig (RIR 3). Reps i mellanspannet (10–12). Här
# vänjer kroppen sig vid att hantera vikt på compound-rörelser innan
# MS-fasens tunga uttag.
#
# Samma readiness-gate och alt-swap som övriga banken.

workouts:

  - code: MT_strength_01
    discipline: strength
    category: ST
    type_code: MT
    name: "Styrka med måttlig vikt — hela kroppen"
    parametrized: true
    parameters:
      sets:
        default: 3
        range: [2, 3]
        description: "Lägg grunden för MS-fasens volym"
      reps:
        default: 11
        range: [10, 12]
        description: "Mellanspann — styrka börjar, uthållighet kvar"
      rir:
        default: 3
        range: [2, 4]
        description: "Måttligt. Tyngre än AA, lättare än MS"
    phase_appropriate: [base_1]
    intent: |
      Steget mellan lätt grundstyrka och tung styrka. Du lägger på vikt
      för ben, baksida lår, drag och press — men inte till max. Kroppen
      vänjer sig vid rörelserna du sedan kör tungt. Mest maskiner, lugna
      och kontrollerade rörelser.
    main_set:
      - segment: warmup
        type: general
        duration_min: 8
        description: "Lätt cykling eller rodd, dynamisk höftböjarstretch och diagonallyft på alla fyra, 2 omgångar à 8"

      - segment: strength_block
        order: 1
        exercise: leg_press_machine
        prescription: {sets: 3, reps: 11, rir: 3, rest_sec: 120}
        load_pct: "måttlig"
        alt: goblet_squat
        note: "Öka vikten lite i taget, vecka för vecka."

      - segment: strength_block
        order: 2
        exercise: leg_curl_machine
        prescription: {sets: 3, reps: 11, rir: 3, rest_sec: 90}
        load_pct: "måttlig"
        alt: hip_thrust
        note: "Stärk baksidan av låren redan nu, innan marklyften i de tunga passen."

      - segment: strength_block
        order: 3
        exercise: seated_row_machine
        prescription: {sets: 3, reps: 11, rir: 3, rest_sec: 90}
        load_pct: "måttlig"
        alt: chest_press_machine
        note: "Handflatorna mot varandra. Känns det i bicepsen: byt till bröstpress."

      - segment: strength_block
        order: 4
        exercise: chest_press_machine
        prescription: {sets: 3, reps: 11, rir: 3, rest_sec: 90}
        load_pct: "måttlig"
        note: "Känns det i axeln: gå inte lika djupt, eller hoppa över övningen."

      - segment: strength_block
        order: 5
        exercise: pallof_press
        prescription: {sets: 2, reps: 12, rir: 3, rest_sec: 45}
        load_pct: "lätt–måttlig"
        alt: dead_bug
        note: "Håll bålen stilla när kabeln drar dig åt sidan. 12 per sida."

      - segment: cooldown
        type: mobility
        duration_min: 5
        description: "Bröstryggsrotation och höftböjarstretch"

    total_duration_min:
      estimated: 45
      flexible_range: [35, 55]
    zone_refs: []
    load_model: rir
    equipment: [leg_press, leg_curl, seated_row, chest_press, cable]
    abort_conditions:
      - "Känns det i axeln eller bicepsen: byt övning eller hoppa över den."
      - "Låg dagsform (readiness under 30): välj så lätt vikt att du orkar en till utöver det som står, eller gör bara 2 omgångar."
    coach_notes: |
      MT är där du sätter arbetsvikterna du sedan progredierar genom MS.
      Logga lasten noga här — den blir referenspunkten. Inget hjältemod,
      poängen är att komma till MS-fasen med mönstren intrimmade.
