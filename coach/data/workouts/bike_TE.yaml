# Cykelpass — Tempo (TE)
#
# TE1 — Tempo Endurance: cykling i Z3, "bekvämt obekvämt".
# Bygger tempotålighet och utvecklar förmågan att hålla under-tröskel-watt
# över längre sammanlagd tid. Mycket relevant för IM-watt (IM-effekt ligger
# typiskt i nedre/mitten av Z3).

workouts:

  - code: TE1_bike_01
    discipline: bike
    category: TE
    type_code: TE1
    name: "Tempopasset — bekvämt obekvämt"
    phase_appropriate: [base_2, base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 60
        range: [45, 90]
        description: "Total tid. Z3-blocket skalar med totalen (det är poängen)."
    intent: |
      Ett långt, sammanhängande block i tempo (Z3). Det ska kännas "bekvämt
      obekvämt" — du jobbar, men du behöver inte ta ut dig. Du andas djupt
      men kontrollerat. Styr på känslan (eller watten); pulsen hinner upp i
      Z3 först efter ungefär 5 min.
    setting: either
    terrain: flat
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.25
        zone: 1
        erg_mode: false
        description: "Öka gradvis, de sista 2 min lugnt (Z2)"
      - segment: build
        duration_pct: 0.05
        zone: 2
        erg_mode: false
        description: "Öka från lugnt (Z2) till nedre Z3 — känn in tempot"
      - segment: continuous
        duration_pct: 0.53
        zone: 3
        cadence_rpm: [85, 95]
        description: "Jämnt tempo, mitt i Z3 (≈ 82 % av FTP). Hitta en andningsrytm tidigt och håll den."
      - segment: cooldown
        duration_pct: 0.17
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 60
      flexible_range: [45, 90]
    zone_refs: [Z1, Z2, Z3]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Du orkar inte hålla tempot i 5 min i sträck (watten sjunker mer än 10 %) → avbryt huvudblocket och varva ned"
    coach_notes: |
      Default tempo-pass. 30 min är en bra dos när TE introduceras i base_2.
      Kan utökas till 40-45 min i build_1. På trainer ger ERG bäst kontroll;
      utomhus väljer du en rak rutt utan stopp.

  - code: TE1_bike_02
    discipline: bike
    category: TE
    type_code: TE1
    name: "Tempoblock 3×20 min"
    phase_appropriate: [base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 95
        range: [85, 115]
        description: "3×20 + 2×5 vila = 70 min fasta reps. Totalen styr warmup/cooldown-utrymme."
    intent: |
      Tre tempoblock med kort vila emellan. Totalt 60 min i tempo (Z3) —
      mer än i något sammanhängande pass, men uppdelat i tre block blir
      det lättare att orka i huvudet. Andra och tredje blocket är viktigare
      än det första; håll ansträngningen även när det börjar ta emot.
    setting: either
    terrain: flat
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.16
        zone: 1
        erg_mode: false
      - segment: main
        sets: 3
        duration_min: 20
        zone: 3
        cadence_rpm: [85, 95]
        rest_sec: 300
        description: "Tempo, mitt i Z3 (≈ 82 % av FTP). Cykla lätt (Z1-Z2) mellan blocken."
      - segment: cooldown
        duration_pct: 0.11
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 95
      flexible_range: [85, 115]
    zone_refs: [Z1, Z2, Z3]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Du orkar inte hålla tempot i block 3 (watten mer än 15 % lägre än i block 1) → avbryt sista blocket"
      - "Pulsen ligger mer än 15 slag/min högre i block 3 än i block 1 vid samma ansträngning → du behöver äta och dricka"
    coach_notes: |
      Standardpass för Z3-tålighet. 5 min vila ger nästan full återhämtning
      mellan reps; målet är inte intervall-känsla utan att kunna upprepa
      ett tempopass tre gånger.

  - code: TE1_bike_03
    discipline: bike
    category: TE
    type_code: TE1
    name: "Strax under tröskeln — 4×12 min"
    phase_appropriate: [base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 85
        range: [75, 105]
        description: "4×12 + 3×3 vila = 57 min fasta reps."
    intent: |
      Strax under tröskeln — tröskeln är den ansträngning du orkar hålla i
      ungefär en timme (övre Z3 / nedre Z4, 88-93 % av FTP). Du får mycket
      träning per minut, både för uthålligheten och för tröskeln. Det är
      inte tröskelfart, men nära nog för att ge mer än vanligt tempo. Bra
      när du har ont om tid.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.18
        zone: 1
        erg_mode: false
      - segment: main
        sets: 4
        duration_min: 12
        zone: 4
        effort_descriptor: "Strax under tröskeln (88-93 % av FTP, övre Z3 / nedre Z4). Du andas tydligt men kontrollerat och kan prata i korta meningar."
        cadence_rpm: [85, 95]
        rest_sec: 180
      - segment: cooldown
        duration_pct: 0.12
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 85
      flexible_range: [75, 105]
    zone_refs: [Z1, Z2, Z3, Z4]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Det blir så hårt som mitt i Z4 → för hårt, sänk"
      - "Du orkar inte hålla nivån i block 4 (mer än 10 % lägre än i block 1) → avbryt sista blocket"
    coach_notes: |
      Effort_descriptor istället för zone — Sweet Spot är ett känt koncept
      som ligger mellan zoner. ERG krävs för att hålla det rätt; outdoor
      blir det Z3 i snitt med Z4-spikar och Z2-glidning.

  - code: TE1_bike_04
    discipline: bike
    category: TE
    type_code: TE1
    name: "Långa tempoblock 2×30 min"
    phase_appropriate: [build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 105
        range: [95, 125]
        description: "2×30 + 8 vila = 68 min fasta reps."
    intent: |
      Mycket tempo: två block på 30 min mitt i Z3 med kort vila. Totalt
      60 min tempo i två stora bitar — det prövar både kropp och huvud.
      Det är de sista 5 minuterna av block 2 som ger mest.
    setting: either
    terrain: flat
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.14
        zone: 1
        erg_mode: false
      - segment: main
        sets: 2
        duration_min: 30
        zone: 3
        cadence_rpm: [85, 95]
        rest_sec: 480
        description: "Tempo, mitten till övre delen av Z3 (≈ 83-85 % av FTP). Cykla lätt (Z1-Z2) i 8 min mellan blocken."
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 105
      flexible_range: [95, 125]
    zone_refs: [Z1, Z2, Z3]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Du orkar inte hålla tempot i block 2 (watten mer än 15 % lägre än i block 1) → avsluta i förtid"
    coach_notes: |
      Build-fas-pass. Längre block än TE1_bike_02 (30 vs 20), färre reps
      (2 vs 3) — men summa Z3-tid är samma 60 min. Mentalt jobbigare;
      använd den när adepten ska vänja sig vid längre sammanhängande
      tröskel-nära arbete inför IM.

  - code: TE1_bike_05
    discipline: bike
    category: TE
    type_code: TE1
    name: "Tempopyramid 10/15/20/15/10"
    phase_appropriate: [base_3, build_1]
    parameterized: true
    parameters:
      duration_min:
        default: 110
        range: [100, 130]
        description: "Pyramid 10/15/20/15/10 + 4×3 vila = 82 min fasta reps."
    intent: |
      Pyramid med block på 10, 15, 20, 15 och 10 min i tempo (Z3), kort
      vila emellan. Samma ansträngning hela vägen, bara blocken byter
      längd. Det gör ett långt tempopass lättare att orka i huvudet.
    setting: either
    terrain: flat
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.14
        zone: 1
        erg_mode: false
      - segment: main
        duration_min: 10
        zone: 3
        cadence_rpm: [85, 95]
        rest_sec: 180
      - segment: main
        duration_min: 15
        zone: 3
        cadence_rpm: [85, 95]
        rest_sec: 180
      - segment: main
        duration_min: 20
        zone: 3
        cadence_rpm: [85, 95]
        rest_sec: 180
      - segment: main
        duration_min: 15
        zone: 3
        cadence_rpm: [85, 95]
        rest_sec: 180
      - segment: main
        duration_min: 10
        zone: 3
        cadence_rpm: [85, 95]
      - segment: cooldown
        duration_pct: 0.09
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 110
      flexible_range: [100, 130]
    zone_refs: [Z1, Z2, Z3]
    equipment: [power_meter, hr_strap]
    abort_conditions:
      - "Du orkar inte hålla 20-minutersblocket → avbryt och avsluta passet"
    coach_notes: |
      Totalt 70 min Z3 — det mest Z3-tid av TE1-passen. Pyramiden
      är en mental knep; fysiskt är det jämn jämn ansträngning. Bra
      som "stor tempo-vecka-höjdpunkt" en gång per 2-3 veckor i build.
