# Löppass — Tester (T)
#
# Tester följer standardprotokoll — själva testet är fast.
# Bara warmup och cooldown skalas med budget. Range är smalt eftersom
# det inte är meningsfullt att skala ett test mer än marginellt.

workouts:

  - code: RunTest_run_01
    discipline: run
    category: T
    type_code: RunTest
    name: "Testlopp: 30 minuter jämnt och hårt"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 65
        range: [60, 70]
        description: "Stridor + rest + 30 min test = 38 min FAST"
    intent: |
      Klassiskt test (Joe Friels): spring så fort du orkar hålla i 30
      minuter. Det ger din tröskel — ungefär den fart du orkar hålla i
      en timme — som dina zoner räknas fram ur:

      - tröskelfart = snittfarten de sista 20 minuterna
      - tröskelpuls = snittpulsen de sista 20 minuterna

      Bara de sista 20 minuterna räknas, så att en för snabb start inte
      ger fel värde. De första 10 minuterna räknas inte.
    main_set:
      - segment: warmup
        duration_pct: 0.50
        zone: 1
        description: "Lugn jogg, sista minuten i nedre Z2"
      - segment: build
        sets: 4
        duration_sec: 20
        zone: 4
        effort_descriptor: "stegringar, öka gradvis upp till nedre Z4"
        rest_sec: 40
      - segment: rest
        duration_min: 3
        description: "Lugn jogg eller stå still. Ställ in dig på testet."
      - segment: test
        duration_min: 30
        zone: 4
        effort_descriptor: "Den snabbaste fart du kan hålla i 30 min — ingen spurt, inget lugnt tempo. Farten ska räcka precis 30 minuter, inte mer."
        description: "VIKTIGT: starta FÖRSIKTIGT — de första 5 min ska kännas 'för lätta'. De flesta börjar för fort. Skriv ner total tid, total sträcka, snittpuls och snittfart de sista 20 min."
      - segment: cooldown
        duration_pct: 0.50
        zone: 1
    total_duration_min:
      estimated: 65
      flexible_range: [60, 70]
    zone_refs: [Z1, Z2, Z4]
    terrain: flat
    surface: track
    equipment: []
    abort_conditions:
      - "Om dagsformen är klart dålig (pulsen rusar de första 5 min fast farten är lätt) — avbryt och gör testet en annan dag"
      - "Plötslig smärta — avbryt direkt"
    coach_notes: |
      Bästa underlag: 400m-bana (exakt distans, ingen vind-skugga,
      ingen kuperning). På väg: helt platt slinga eller punkt-till-punkt
      med GPS-mätning.
      
      Räkna med ~24-48h ordinär trötthet efteråt. Schemalägg som
      kvalitetspass i veckan, inte som "extra".

  - code: RunTest_run_02
    discipline: run
    category: T
    type_code: RunTest
    name: "Testlopp: 2×8 min allt du har"
    phase_appropriate: [base_2, base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 55
        range: [50, 60]
        description: "Stridor + 2×8 min + 4 min vila = 25 min FAST"
    intent: |
      Ett annat löptest: två block på 8 min med 4 min vila.
      Snittpuls och snittfart i de två blocken ger en uppskattning av
      din tröskel. Lättare än 30-minuterstestet om du inte gjort tester
      förut — börjar du för fort kostar det mindre.
    main_set:
      - segment: warmup
        duration_pct: 0.50
        zone: 1
      - segment: build
        sets: 4
        duration_sec: 20
        zone: 4
        effort_descriptor: "stegringar"
        rest_sec: 40
      - segment: test
        sets: 1
        duration_min: 8
        zone: 5
        effort_descriptor: "Den snabbaste fart du kan hålla i 8 min. Börja försiktigt och håll jämn fart."
      - segment: rest
        duration_min: 4
        description: "Lugn jogg eller gång — pulsen ska komma ned"
      - segment: test
        sets: 1
        duration_min: 8
        zone: 5
        effort_descriptor: "Den snabbaste fart du kan hålla i 8 min. Helst lite snabbare än första blocket."
        description: "Skriv ner tid, snittpuls och snittfart för varje block."
      - segment: cooldown
        duration_pct: 0.50
        zone: 1
    total_duration_min:
      estimated: 55
      flexible_range: [50, 60]
    zone_refs: [Z1, Z4, Z5]
    terrain: flat
    surface: track
    equipment: []
    coach_notes: |
      Formel: snittpace över de två blocken = uppskattat
      threshold_pace_sec_per_km. Lägg på ~3-5% (saktare) om värdet
      ska användas konservativt, eftersom 8 min är något snabbare
      än sann steady-state-tröskel.
