# Simpass — Aerob Uthållighet (AE)
#
# AE är basvolym. Två typer:
#   AE1 — Recovery: lätt, teknikfokus, korta pass
#   AE2 — Aerobic Endurance: längre intervaller eller kontinuerligt i Z2
#
# Alla pass är parametriserade — `duration_pct` på kontinuerliga segment
# och `sets: {default, range}` på huvudintervaller skalar passet mot
# adeptens veckobudget. För skalbarhet finns ofta ett `continuous` segment
# som absorberar resterande budget när intervallblocken inte fyller den.

workouts:

  # ─────────────────────────────────────────────────────────────
  # AE1 — Recovery
  # ─────────────────────────────────────────────────────────────

  - code: AE1_swim_template_01
    discipline: swim
    category: AE
    type_code: AE1
    name: "Lätt i vattnet — kort återhämtning"
    parameterized: true
    parameters:
      duration_min: { min: 20, max: 45, default: 30 }
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2, peak, race, recovery]
    intent: |
      Lätt simning för aktiv återhämtning. Pulsen ska aldrig krypa upp.
      Fokus på flyt och känsla för vattnet, inte tempo.
    main_set:
      - segment: warmup
        duration_pct: 0.20
        zone: 1
        description: "Lugnt igång, valfritt simsätt"
      - segment: continuous
        duration_pct: 0.60
        zone: 1
        description: "Stadig, lätt fart. Andas avslappnat. Byt simsätt var 200 m om det känns bra."
      - segment: cooldown
        duration_pct: 0.20
        zone: 1
    total_duration_min:
      estimated: 30
      flexible_range: [20, 45]
    zone_refs: [Z1]
    equipment: []
    coach_notes: |
      Funkar dagen efter ett hårt pass eller som inlägg när man har
      ont om tid och bara vill röra sig i vattnet.

  - code: AE1_swim_01
    discipline: swim
    category: AE
    type_code: AE1
    name: "Teknikvila — lugna teknikövningar"
    parameterized: true
    parameters:
      duration_min:
        default: 40
        range: [25, 75]
        description: "Skala till veckans budget"
    phase_appropriate: [prep, base_1, base_2, recovery]
    intent: |
      Lugnt pass med fokus på teknik. Du växlar mellan tre grundläggande
      teknikövningar. Pulsen stannar låg — det är hjärnan som jobbar.
    main_set:
      - segment: warmup
        duration_pct: 0.20
        zone: 1
        description: "Valfritt simsätt, känn in vattnet"
      - segment: drills
        sets: {default: 6, range: [4, 10]}
        distance_m: 50
        rest_sec: 20
        drills: [single_arm, six_kick_switch, fingertip_drag]
        description: "Växla: 2 × enarmssim, 2 × sex sparkar och byt, 2 × fingrarna längs ytan"
      - segment: main
        sets: {default: 4, range: [3, 8]}
        distance_m: 100
        zone: 1
        rest_sec: 15
        description: "Lugn frisim. Använd det du just övat på."
      - segment: continuous
        duration_pct: 0.28
        zone: 1
        description: "Fortsätt lugnt och byt teknikfokus var 100 m, om du har tid kvar"
      - segment: cooldown
        duration_pct: 0.15
        zone: 1
    total_distance_m: 1800
    total_duration_min:
      estimated: 40
      flexible_range: [25, 75]
    zone_refs: [Z1]
    equipment: []

  - code: AE1_swim_02
    discipline: swim
    category: AE
    type_code: AE1
    name: "Benspark och glid — lätta ben, långt glid"
    parameterized: true
    parameters:
      duration_min:
        default: 40
        range: [25, 70]
        description: "Skala till veckans budget"
    phase_appropriate: [prep, base_1, base_2, recovery]
    intent: |
      Lätt pass med fokus på benspark och glid. Benen vänjer sig vid att
      sparka utan att armar och axlar belastas. Bra dagen efter ett tungt
      cykel- eller löppass.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
      - segment: kick
        sets: {default: 6, range: [4, 10]}
        distance_m: 50
        rest_sec: 20
        equipment: [kickboard]
        zone: 1
        description: "Långsam, kraftfull benspark. Håll sparkarna små och smala."
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
        drills: [superman_glide, side_kick]
        description: "Fokus på glidet: tre andetag på ena sidan innan du byter till den andra"
      - segment: main
        sets: {default: 3, range: [2, 6]}
        distance_m: 200
        zone: 1
        rest_sec: 20
        description: "Frisim med långa tag. Känn glidet från teknikövningarna."
      - segment: continuous
        duration_pct: 0.15
        zone: 1
        description: "Extra lugn frisim om du har tid kvar"
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
    total_distance_m: 1700
    total_duration_min:
      estimated: 40
      flexible_range: [25, 70]
    zone_refs: [Z1]
    equipment: [kickboard]

  # ─────────────────────────────────────────────────────────────
  # AE2 — Aerobic Endurance
  # ─────────────────────────────────────────────────────────────

  - code: AE2_swim_template_01
    discipline: swim
    category: AE
    type_code: AE2
    name: "Lugn distans i ett svep"
    parameterized: true
    parameters:
      duration_min: { min: 30, max: 90, default: 60 }
    phase_appropriate: [base_1, base_2, base_3, build_1]
    intent: |
      Lugn uthållighet (Z2). Stadig fart, inget hårt, ingen jakt på tid.
      Bygger uthållighet utan att slita på dig.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
        description: "Öka farten gradvis. De sista 100 m i lugn fart (nedre Z2)."
      - segment: continuous
        duration_pct: 0.70
        zone: 2
        description: "Stadigt och lugnt (Z2). Öka aldrig till hårdare. Andas på vart tredje eller femte armtag."
      - segment: cooldown
        duration_pct: 0.15
        zone: 1
    total_duration_min:
      estimated: 60
      flexible_range: [30, 90]
    zone_refs: [Z1, Z2]
    equipment: []
    coach_notes: |
      Den här mallen är arbetshäst i base-fasen. Variera durationen efter
      veckans volymmål. Inkludera kort drill-set i början om passet är >50 min.

  - code: AE2_swim_01
    discipline: swim
    category: AE
    type_code: AE2
    name: "Klassiska 400 m i lugn fart"
    parameterized: true
    parameters:
      duration_min:
        default: 55
        range: [35, 110]
        description: "Skala till veckans budget"
    phase_appropriate: [base_1, base_2, base_3, build_1]
    intent: |
      Lugn uthållighet (Z2) i långa intervaller. De korta vilorna ger dig
      tid att andas och hitta rytmen igen, utan att farten sjunker.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
        drills: [superman_glide, six_kick_switch, fingertip_drag, single_arm]
      - segment: main
        sets: {default: 4, range: [3, 7]}
        distance_m: 400
        zone: 2
        rest_sec: 20
        description: "Samma lugna fart på alla 400 m. Andas på vart tredje armtag."
      - segment: continuous
        duration_pct: 0.20
        zone: 2
        description: "Fortsätt i samma lugna fart om du har tid kvar"
      - segment: cooldown
        duration_pct: 0.07
        zone: 1
    total_distance_m: 2800
    total_duration_min:
      estimated: 55
      flexible_range: [35, 110]
    zone_refs: [Z1, Z2]
    equipment: []
    abort_conditions:
      - "Tappar du mer än 5 s per 100 m mot slutet: simma nästa intervall lugnare (nedre Z2) eller hoppa över den"
    coach_notes: |
      Funkar i alla base-perioder. Skala till 3×400 vid lägre volymveckor,
      5-7×400 vid högre.

  - code: AE2_swim_02
    discipline: swim
    category: AE
    type_code: AE2
    name: "8 × 200 m — korta pauser, jämnt flyt"
    parameterized: true
    parameters:
      duration_min:
        default: 55
        range: [35, 100]
        description: "Skala till veckans budget"
    phase_appropriate: [base_2, base_3, build_1]
    intent: |
      Längre lugnt uthållighetspass. Vilan är kortare än i passet med
      400 m, så det känns mer som att simma utan stopp. Du vänjer dig
      vid att hålla lugn fart (Z2) länge.
    main_set:
      - segment: warmup
        duration_pct: 0.15
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
        drills: [single_arm, six_kick_switch]
      - segment: main
        sets: {default: 8, range: [5, 14]}
        distance_m: 200
        zone: 2
        rest_sec: 15
        description: "Kort vila — det hela ska kännas som ett enda långt pass"
      - segment: continuous
        duration_pct: 0.18
        zone: 2
        description: "Fortsätt i samma lugna fart om du har tid kvar"
      - segment: cooldown
        duration_pct: 0.07
        zone: 1
    total_distance_m: 2600
    total_duration_min:
      estimated: 55
      flexible_range: [35, 100]
    zone_refs: [Z1, Z2]
    equipment: []

  - code: AE2_swim_03
    discipline: swim
    category: AE
    type_code: AE2
    name: "Långsimmet — distans utan stopp"
    parameterized: true
    parameters:
      duration_min:
        default: 45
        range: [25, 180]
        description: "Skala till veckans budget — vid stora budgetar blir det 3000m+ kontinuerligt"
    phase_appropriate: [base_2, base_3, build_1, build_2]
    intent: |
      Lång simning utan stopp i lugn fart (Z2). Kropp och huvud vänjer
      sig vid att simma länge utan att stanna — viktigt för
      Ironmandistansen och för att orka långa pass i huvudet. Normalt blir det
      ungefär 1500 m utan stopp; har du 3 timmar blir det 3–4 km.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 6]}
        distance_m: 50
        rest_sec: 15
        drills: [single_arm, six_kick_switch]
      - segment: continuous
        duration_pct: 0.68
        zone: 2
        description: "Utan stopp. Byt sida du andas åt var 500 m, så bryts enformigheten."
      - segment: cooldown
        duration_pct: 0.10
        zone: 1
    total_distance_m: 2200
    total_duration_min:
      estimated: 45
      flexible_range: [25, 180]
    zone_refs: [Z1, Z2]
    equipment: []
    abort_conditions:
      - "Om du blir allt långsammare fast du tar i lika mycket: sänk till mycket lugnt (Z1) och avsluta i förtid"

  - code: AE2_swim_04
    discipline: swim
    category: AE
    type_code: AE2
    name: "Pyramiden — 100 m upp till 500 m och ner"
    parameterized: true
    parameters:
      duration_min:
        default: 55
        range: [50, 70]
        description: "Pyramidens struktur är fixerad — bara warmup/cooldown skalar"
    phase_appropriate: [base_2, base_3, build_1]
    intent: |
      Lugn uthållighet (Z2) i intervaller av olika längd. Pyramiden ger
      omväxling och lär dig hålla farten: de korta intervallerna i slutet
      ska kännas lika lugna som de korta i början.
    main_set:
      - segment: warmup
        duration_pct: 0.12
        zone: 1
      - segment: main
        sets: 1
        distance_m: 100
        zone: 2
        rest_sec: 15
      - segment: main
        sets: 1
        distance_m: 200
        zone: 2
        rest_sec: 20
      - segment: main
        sets: 1
        distance_m: 300
        zone: 2
        rest_sec: 25
      - segment: main
        sets: 1
        distance_m: 400
        zone: 2
        rest_sec: 30
      - segment: main
        sets: 1
        distance_m: 500
        zone: 2
        rest_sec: 30
      - segment: main
        sets: 1
        distance_m: 400
        zone: 2
        rest_sec: 25
      - segment: main
        sets: 1
        distance_m: 300
        zone: 2
        rest_sec: 20
      - segment: main
        sets: 1
        distance_m: 200
        zone: 2
        rest_sec: 15
      - segment: main
        sets: 1
        distance_m: 100
        zone: 2
        rest_sec: 0
      - segment: cooldown
        duration_pct: 0.06
        zone: 1
    total_distance_m: 3100
    total_duration_min:
      estimated: 55
      flexible_range: [50, 70]
    zone_refs: [Z1, Z2]
    equipment: []

  - code: AE2_swim_05
    discipline: swim
    category: AE
    type_code: AE2
    name: "Öppet vatten — sikta, ligg i rygg, vänd"
    phase_appropriate: [base_3, build_1, build_2, peak]
    parameterized: false
    intent: |
      Passet som gör dig från bassängsimmare till simmare i öppet vatten.
      Du övar på att titta framåt utan att tappa rytmen, simma rakt utan
      linje på botten, vända runt en boj och (med sällskap) ligga i rygg
      på någon, bakom fötterna eller vid höften. Ingen fart att jaga —
      färdigheterna ÄR passet. Den som siktar dåligt simmar 200–400 m
      extra på en Ironman.
    main_set:
      - segment: warmup
        duration_min: 10
        zone: 1
        description: "Simma in längs stranden eller kanten, vänj dig vid vattnet och temperaturen"
      - segment: main
        sets: 4
        duration_min: 6
        rest_sec: 60
        zone: 2
        description: |
          Titta framåt: lyft blicken var 6–9:e armtag ("krokodilögon" —
          bara ögonen över ytan, andas åt sidan efteråt). Välj ett fast
          landmärke för varje block. Kolla efteråt: hamnade du där du
          siktade?
      - segment: main
        sets: 4
        duration_min: 3
        rest_sec: 45
        zone: 2
        description: |
          Vändningar runt boj: simma mot märket och vänd tätt runt (korta
          tag med armen närmast bojen, sparka snabbare ut ur vändningen).
          Med sällskap: ligg bakom fötterna eller vid höften på den andra
          varannan vändning — känn hur mycket kraft det sparar.
      - segment: cooldown
        duration_min: 5
        zone: 1
        description: "Lugnt in mot land, gärna lite ryggsim"
    total_distance_m: 2000
    total_duration_min:
      estimated: 55
      flexible_range: [40, 70]
    zone_refs: [Z1, Z2]
    equipment: [open_water]
    abort_conditions:
      - "Simma aldrig ensam i öppet vatten — ingen kompis eller livräddare med = passet ställs in"
      - "Så kallt att händer eller fötter domnar eller rörelserna blir klumpiga: upp direkt"
      - "Ont i axeln av våtdräktens motstånd: ta av dräkten eller avbryt, och rapportera det"
    coach_notes: |
      Kör i våtdräkt om tävlingen är wetsuit-legal — dräkten ändrar
      vattenläge och armtagsmotstånd och måste vara invand, inte ny på
      race-dagen. Sighting-drillen (se drill-katalogen) kan förövas i
      pool. OBS: kräver pool_type=open_water i adeptens utrustning för
      att väljas av planern.

  - code: AE2_swim_06
    discipline: swim
    category: AE
    type_code: AE2
    name: "3 × 1000 m i tävlingsfart — loppet i bitar"
    phase_appropriate: [build_2, peak]
    parameterized: false
    intent: |
      Ironman-simningen på 3,8 km i hanterbara bitar: 3 × 1000 m i den
      fart du ska simma på tävlingen, med kort paus. Tävlingsfarten är
      LUGNARE än din tröskelfart i simning (CSS) — några sekunder
      långsammare per 100 m, en fart du kan hålla i över en timme medan
      du tittar framåt och simmar i trängsel. Passet ställer in känslan:
      efter sista 1000 m ska det kännas som att en till hade gått.
    main_set:
      - segment: warmup
        duration_min: 10
        zone: 1
        description: "Med 4 × 50 m där du ökar upp till tävlingsfart"
      - segment: main
        sets: 3
        distance_m: 1000
        rest_sec: 90
        effort_descriptor: "Kontrollerad tävlingsfart för Ironman (din tröskelfart i simning, CSS, plus 4–6 s per 100 m). Andas på vartannat eller vart tredje armtag efter behov."
        description: |
          I öppet vatten: titta framåt var 8:e armtag. I bassäng: skjut
          ifrån väggen så lite som möjligt (mjuk vändning, ingen glidning
          under vattnet), så att farten liknar den i öppet vatten.
          Simma i våtdräkt om den är tillåten på tävlingen.
      - segment: cooldown
        duration_min: 5
        zone: 1
    total_distance_m: 3600
    total_duration_min:
      estimated: 90
      flexible_range: [75, 100]
    zone_refs: [Z1, Z2]
    equipment: []
    abort_conditions:
      - "Tappar du mer än 5 s per 100 m på tredje 1000 m: simma klart lugnt. Tävlingsfarten är satt för högt"
      - "Ont i axeln (särskilt i våtdräkt): avbryt och rapportera det"
      - "I öppet vatten: simma aldrig ensam"
    coach_notes: |
      Bankens race-kalibrator för sim. Snittpacet per tusning + hur set 3
      kändes är direkt input till race-planens simsplit. Körs 2-3 gånger
      totalt i build_2/peak — sista gången senast 2 veckor före race.
      Väljs med fördel som OW-pass i våtdräkt när vattnet tillåter.
