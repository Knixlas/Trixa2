# Cykelpass — Tester (T)
#
# FTP-test (Functional Threshold Power) — bestämmer adeptens FTP-watt,
# som driver alla cykelzoner. Tre etablerade protokoll:
#
#   FTP_20min  — 20-min all-out × 0.95. Guldstandard, mentalt tuff.
#   FTP_2x8min — Två 8-min all-out, snitt × 0.90. Mellanting.
#   FTP_Ramp   — Stegrande ramp till utmattning. Lättast på trötta ben.
#
# Trixa/Nils väljer protokoll baserat på:
#   - Adeptens vana med FTP-test (guldstandard kräver erfarenhet)
#   - Dagsform (Ramp är lättare på trötta ben)
#   - Tidigare testhistorik (samma protokoll = jämförbara resultat)
#
# Standardrekommendation: 20-min för adepter med tidigare 20-min-tester
# i historiken (jämförbarhet). Ramp för förstagångstest eller efter
# längre uppehåll.

workouts:

  # ─────────────────────────────────────────────────────────────
  # 20-min FTP-test (guldstandard)
  # ─────────────────────────────────────────────────────────────

  - code: T_bike_FTP_20min
    discipline: bike
    category: T
    type_code: FTP_20min
    name: "Formtest: 20 minuter allt du har"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2]
    parameterized: true
    parameters:
      duration_min:
        default: 65
        range: [50, 90]
        description: "Protokoll fast: 5 öppnare + 5 rest + 20 test = 30 min. Totalen styr warmup/cooldown."
    intent: |
      Testet som mäter din tröskel — den ansträngning du orkar hålla i
      ungefär en timme (FTP). Du cyklar 20 min så hårt du orkar hålla
      jämnt. Målet är så hög snittwatt som möjligt över hela tiden, INTE
      att öppna för hårt och dö. Snittwatten × 0,95 ger din tröskel (FTP).
      Det är tungt i huvudet: under första halvan vill du rusa iväg, under
      andra halvan testas du på riktigt. Andas djupt och håll watten.
    setting: indoor
    requires_trainer: true
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.31
        zone: 1
        description: |
          Uppvärmning i steg:
          - lätt → lugnt → kort tempo → lätt → kort och hårt → lätt (Z1 → Z2 → kort Z3 → Z1 → kort Z4 → Z1)
          (Stegen följer passets längd; räkna med ungefär 20 min.)
      - segment: main
        duration_min: 5
        zone: 4
        description: "Öppnare: 5 min nära tröskeln (nedre Z4) så att kroppen är redo"
      - segment: rest
        duration_min: 5
        zone: 1
        description: "Cykla lätt och vila upp dig innan testet"
      - segment: test
        duration_min: 20
        zone: 4
        effort_descriptor: "Så hårt du orkar hålla jämnt i 20 min. Börja kontrollerat — håll igen ungefär 5 % i början och ge allt de sista 5 min. Snittwatten × 0,95 = din tröskel (FTP)."
        cadence_rpm: [85, 100]
        description: "Skriv upp snittwatt, snittpuls, genomsnittlig trampfrekvens och högsta puls"
      - segment: cooldown
        duration_pct: 0.23
        zone: 1
    total_duration_min:
      estimated: 65
      flexible_range: [50, 90]
    zone_refs: [Z1, Z2, Z3, Z4]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Watten sjunker mer än 15 % i över 60 sek mitt i testet → testet gäller inte; avbryt och gör om det om 3-5 dagar"
      - "Tecken på sjukdom eller kraftig huvudvärk → avbryt"
    coach_notes: |
      Beräkning: FTP_watt = snitt_20min_watt × 0.95
      
      Justering om snitt-HR i testet > 105% av aktuell LTHR → FTP är något
      högt; överväg att ta 0.94 istället för 0.95 som multiplier.
      
      Trainer rekommenderas starkt — utomhus blir terräng-variationer och
      trafik störande. Om utomhus krävs: hitta absolut platt rak 8-10 km
      sträcka utan korsningar.
      
      För adepter som inte gjort 20-min-test förut: kör T_bike_FTP_Ramp
      först för att få en uppskattning, sedan 20-min nästa testcykel.

  # ─────────────────────────────────────────────────────────────
  # 2×8 min FTP-test
  # ─────────────────────────────────────────────────────────────

  - code: T_bike_FTP_2x8
    discipline: bike
    category: T
    type_code: FTP_2x8
    name: "Formtest: 2×8 min — två chanser"
    phase_appropriate: [prep, base_1, base_2, base_3]
    parameterized: true
    parameters:
      duration_min:
        default: 70
        range: [55, 85]
        description: "Protokoll fast: 3+5+8+10+8 = 34 min. Totalen styr warmup/cooldown."
    intent: |
      Ett mellanting mellan 20-minuterstestet och trapptestet. Två block på
      8 min där du ger allt, med 10 min vila emellan. Snittet av båda × 0,90
      ger din tröskel — den ansträngning du orkar hålla i ungefär en timme
      (FTP). Lättare i huvudet än 20 minuter, noggrannare än trappan. Ett
      bra val om 20-minuterstestet inte passar dig.
    setting: indoor
    requires_trainer: true
    erg_mode: false
    main_set:
      - segment: warmup
        duration_pct: 0.29
        zone: 1
        description: "Samma uppvärmning i steg som i 20-minuterstestet, anpassad efter passets längd"
      - segment: main
        duration_min: 3
        zone: 4
        description: "Öppnare: 3 min nära tröskeln (nedre Z4)"
      - segment: rest
        duration_min: 5
        zone: 1
      - segment: test
        duration_min: 8
        zone: 5
        effort_descriptor: "Block 1: så hårt du orkar hålla jämnt i 8 min, lite över tröskeln (≈ 105-110 % av uppskattad FTP). Skriv upp snittet."
        cadence_rpm: [85, 100]
      - segment: rest
        duration_min: 10
        zone: 1
        description: "Gott om vila — du ska vara helt återhämtad"
      - segment: test
        duration_min: 8
        zone: 5
        effort_descriptor: "Block 2: så hårt du orkar hålla jämnt i 8 min. Helst samma eller lite högre än block 1."
        cadence_rpm: [85, 100]
      - segment: cooldown
        duration_pct: 0.14
        zone: 1
    total_duration_min:
      estimated: 70
      flexible_range: [55, 85]
    zone_refs: [Z1, Z2, Z3, Z4, Z5]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Block 2 blir under 85 % av block 1 → du hann inte återhämta dig eller öppnade för hårt i block 1; testet gäller inte"
    coach_notes: |
      Beräkning: FTP_watt = ((snitt_block_1 + snitt_block_2) / 2) × 0.90
      
      Coggan/Allen-protokollet. Något konservativare än 20-min × 0.95
      (resultatet brukar bli 2-4 watt lägre) men mindre känsligt för
      misjudged pacing. För nya adepter där 20-min-pacing känns oöverskådligt.

  # ─────────────────────────────────────────────────────────────
  # Ramp Test
  # ─────────────────────────────────────────────────────────────

  - code: T_bike_FTP_Ramp
    discipline: bike
    category: T
    type_code: FTP_Ramp
    name: "Formtest: trappan upp tills det tar stopp"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, recovery]
    parameterized: true
    parameters:
      duration_min:
        default: 40
        range: [30, 50]
        description: "Ramp-testet är ≈20 min (variera med adeptens nivå). Totalen styr warmup/cooldown."
    intent: |
      Trapptest: motståndet ökar med 20 W varje minut tills du inte längre
      orkar hålla trampfrekvensen över 60 varv/min. Det lättaste testet på
      trötta ben — de första 10-12 minuterna är lugna, och det som mäts är
      din snittwatt de sista 60 sek. Den × 0,75 ger din tröskel — den
      ansträngning du orkar hålla i ungefär en timme (FTP). Snabbt, lätt
      att göra om och passar nybörjare.
    setting: indoor
    requires_trainer: true
    erg_mode: true
    main_set:
      - segment: warmup
        duration_pct: 0.25
        zone: 1
        erg_mode: false
        description: "Lugn uppvärmning utan hårda inslag — spara benen till testet"
      - segment: test
        duration_min: 20
        zone: 3
        effort_descriptor: |
          Trappan: börja på 100 W och öka 20 W per minut. Trampa jämnt och
          mjukt, 85-95 varv/min. Fortsätt tills trampfrekvensen faller under
          60 varv/min i mer än 5 sek. Skriv upp snittwatten för de sista
          60 sek innan du tog stopp.
        cadence_rpm: [85, 95]
        description: |
          Trainerns app kan sköta trappan åt dig med låst effekt. Annars
          ökar du motståndet själv var 60:e sekund. Testet tar 12-25 min
          beroende på din nivå — tiden i planen är en uppskattning.
      - segment: cooldown
        duration_pct: 0.25
        zone: 1
        erg_mode: false
    total_duration_min:
      estimated: 40
      flexible_range: [30, 50]
    zone_refs: [Z1, Z2, Z3, Z4, Z5]
    equipment: [power_meter, hr_strap, trainer]
    abort_conditions:
      - "Kraftig huvudvärk eller yrsel → avbryt omedelbart"
    coach_notes: |
      Beräkning: FTP_watt = peak_1min_watt × 0.75
      
      Zwift-standard. Tenderar ge något lägre FTP än 20-min (typiskt 2-3%)
      eftersom ramp testar VO2max-end snarare än sustained tröskel-watt.
      För adepter med högre anaerob kapacitet (rena cyklister, sprinter-typer)
      ger Ramp överskattat FTP — håll 20-min för dem.
      
      Bäst för:
        - Förstagångstest (etablera baseline)
        - Adept med trötta ben från annan träning
        - Recovery-fas där 20-min är för stressande
        - Snabbt återtest efter sjukdom eller längre uppehåll
      
      Mindre bra för: adepter med stort gap mellan VO2-kapacitet och
      sustained tröskel (eller om historik är 20-min och jämförelse är
      önskvärd).
