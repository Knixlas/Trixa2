# Simpass — Tester (T)
#
# CSS-Test: Critical Swim Speed-test enligt Swim Smooth-protokollet.
# Resultatet kalibrerar samtliga simzoner.
#
# Genomför CSS-test:
#   - I början av varje träningscykel (innan prep)
#   - Efter ~6-8 veckor i base-fasen
#   - 4-6 veckor innan A-tävling
#   - När pace börjar drifta i ME-pass utan att övriga signaler förklarar det
#
# Test-pass har SMAL range — testprotokollets distanser är fixerade och får inte
# ändras (det skulle bryta jämförelsen mot tidigare tester). Endast warmup/cooldown
# och vila kring testet kan skala med budget.

workouts:

  - code: CSS_Test_swim_01
    discipline: swim
    category: T
    type_code: CSS_Test
    name: "Simtest: 400 + 200 för din tröskelfart"
    parameterized: true
    parameters:
      duration_min:
        default: 42
        range: [35, 55]
        description: "Smal range — testprotokollets 400+200 är fixt"
    phase_appropriate: [prep, base_1, base_2, base_3, build_1, build_2]
    intent: |
      Testet räknar fram din tröskelfart i simning (CSS), ungefär den fart
      du orkar hålla över 1500 m. Du simmar 400 m och 200 m så fort du kan,
      med vila emellan. Upplägget kommer från Swim Smooth.

      Uträkning: (tid på 400 m − tid på 200 m) / 2 = din tröskelfart
      i sekunder per 100 m. Räkna tiderna i sekunder.
    main_set:
      - segment: warmup
        duration_pct: 0.12
        zone: 1
        description: "Lugn frisim"
      - segment: drills
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 15
        drills: [single_arm, fingertip_drag, six_kick_switch]
      - segment: build
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 15
        description: "Öka farten från lugnt (Z2) till ganska hårt (Z4). Kroppen vaknar inför testet."
      - segment: rest
        rest_sec: 120
        description: "Vila och ladda inför första testet"
      - segment: test
        sets: 1
        distance_m: 400
        zone: 5
        description: "400 m så fort du kan hålla hela vägen. Jämn fart, börja inte för hårt de första 100 m."
        notes: "Tidtagning krävs. Notera exakt tid i sekunder."
      - segment: rest
        rest_sec: 300
        description: "5 minuter lugn frisim eller stå still. Låt pulsen gå ner."
      - segment: test
        sets: 1
        distance_m: 200
        zone: 5
        description: "200 m så fort du kan hålla hela vägen. Snabbare än på 400 m, men ingen ren spurt."
        notes: "Tidtagning krävs. Notera exakt tid i sekunder."
      - segment: cooldown
        duration_pct: 0.22
        zone: 1
    total_distance_m: 1800
    total_duration_min:
      estimated: 42
      flexible_range: [35, 55]
    zone_refs: [Z1, Z2, Z4, Z5]
    equipment: []
    abort_conditions:
      - "Avbryt om du känner dig sjuk eller sliten — testet ska göras när du är pigg"
    coach_notes: |
      För bäst noggrannhet: gör testet i samma bassäng/distans/temperatur
      varje gång. Logga både tider och faktorer (sömn senaste natten,
      stress, dagar sedan senaste hårda pass) — det förklarar variation
      mellan tester.

      Räknat exempel:
        T400 = 6:20 (380 sek)
        T200 = 3:00 (180 sek)
        CSS = (380 - 180) / 2 = 100 sek/100m → 1:40/100m

  - code: CSS_Test_swim_02
    discipline: swim
    category: T
    type_code: CSS_Test
    name: "Simtest: 1500 m på tid — tävlingsfacit"
    parameterized: true
    parameters:
      duration_min:
        default: 55
        range: [45, 70]
        description: "Smal range — 1500m time trial är fix distans"
    phase_appropriate: [build_1, build_2, peak]
    intent: |
      Ett annat sätt att ta fram din tröskelfart i simning (CSS): 1500 m
      så fort du kan hålla hela vägen. Du får din fart på en lång
      tävlingssträcka direkt, utan att räkna om från 400 m och 200 m.

      Uträkning: tid på 1500 m i sekunder / 15 ≈ din tröskelfart
      i sekunder per 100 m.

      Testet liknar tävlingen mer, men du måste själv orka hålla farten
      jämn i 25–30 minuter.
    main_set:
      - segment: warmup
        duration_pct: 0.13
        zone: 1
      - segment: drills
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 15
      - segment: build
        sets: {default: 4, range: [3, 5]}
        distance_m: 50
        rest_sec: 10
      - segment: rest
        rest_sec: 180
        description: "Vila och ladda inför testet"
      - segment: test
        sets: 1
        distance_m: 1500
        zone: 4
        description: "1500 m så fort du kan hålla hela vägen. Jämn fart, gärna andra halvan lite snabbare än den första."
        notes: "Tidtagning krävs. Logga splits per 100m om möjligt."
      - segment: cooldown
        duration_pct: 0.13
        zone: 1
    total_distance_m: 2500
    total_duration_min:
      estimated: 55
      flexible_range: [45, 70]
    zone_refs: [Z1, Z2, Z4]
    equipment: []
    coach_notes: |
      Lämpligt 4-6 veckor innan A-tävling som ren race-pace-indikator.
      Tidigare i säsongen är 400+200-protokollet mer praktiskt.
