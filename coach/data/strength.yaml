# Styrketräning per träningsfas (källa: 3.5 Styrketräning i Olika Träningsfaser,
# korrigerad 2026-07-02 efter expertgranskning: MS/SM-parametrarna var inverterade).
# VIKTIGT: Anpassa alltid övningarna för att undvika att belasta skadade kroppsdelar.

protocol_types:
  AA: Anatomical Adaptation
  MT: Max Transition
  MS: Max Strength
  SM: Strength Maintenance

# Parametrar per PROTOKOLL (inte per fas — base_1 växlar MT→MS mitt i perioden).
# Dessa vinner över fas-blockens värden. sessions_per_week = [min, max] pass/vecka.
protocol_parameters:
  AA:
    reps: [12, 15]
    sets: [2, 3]
    intensity: light_to_moderate
    sessions_per_week: [2, 3]
  MT:
    # Övergång mot tunga lyft: lär rörelsemönstren med måttlig vikt.
    reps: [10, 15]
    sets: [3, 4]
    intensity: moderate
    sessions_per_week: [2, 2]
  MS:
    # Maxstyrka: få reps, tung vikt (~80-90% 1RM), full vila mellan set.
    # Kräver att rörelsemönstren sitter (MT genomförd).
    reps: [3, 6]
    sets: [2, 3]
    intensity: heavy
    sessions_per_week: [2, 2]
  SM:
    # Underhåll under tävlingssäsong: ETT kort pass/vecka, 1-2 set.
    # Styrkan byggdes i base — nu ska den bara bevaras medan sport-specifik
    # intensitet ökar. Mer än så konkurrerar med nyckelpassen.
    reps: [6, 10]
    sets: [1, 2]
    intensity: moderate
    sessions_per_week: [1, 1]
  light_maintenance:
    reps: [10, 15]
    sets: [1, 2]
    intensity: very_light
    sessions_per_week: [1, 1]

# Styrkeprotokoll per fas: mål, fokus och övningsval.
# Reps/sets/intensitet kommer från protocol_parameters ovan.
strength_by_phase:

  prep:
    protocol: AA
    goal: Skapa grundläggande styrka och uthållighet
    focus: Teknik och korrekt utförande
    exercises:
      bodyweight:
        - armhävningar
        - knäböj
        - utfallssteg
      core:
        - plankan
        - sidoplankan
        - rygglyft
      stability:
        - balansövningar på bosuboll
        - enbensstående med hantlar

  base:
    protocol_by_period:
      base_1:
        first_half: MT   # första halvan
        second_half: MS  # andra halvan
      base_2: MS
      base_3: MS
    goal: Bygga maximal styrka medan sport-intensiteten fortfarande är låg
    focus: >
      Tunga baslyft med perfekt teknik. Full vila mellan set (2-4 min).
      Styrkan som byggs här underhålls sedan hela säsongen.
    exercises:
      compound:
        - marklyft
        - bänkpress
        - rodd
      core:
        - russian twists
        - leg raises
      legs:
        - benpress
        - vadpress
        - utfall med vikt

  build:
    protocol: SM
    goal: Bevara styrkan från base utan att störa den sport-specifika träningen
    focus: >
      Underhåll — ett kort pass per vecka med måttlig vikt. Intensiteten
      i sim/cykel/löp ökar nu; styrketräningen får inte konkurrera med
      nyckelpassen eller addera återhämtningsskuld.
    note: Ange alltid set, repetitioner och vikter för varje övning.
    exercises:
      heavy_compound:
        - knäböj
        - marklyft
        - militärpress
      isolation:
        - hamstring curls
        - biceps curls
        - triceps extensions

  peak:
    protocol: SM
    goal: Bevara styrka och minska skaderisken
    focus: Bevara styrka utan att trötta ut musklerna; rörlighet och skadeprevention
    note: Minska vikter och volym jämfört med tidigare faser.
    exercises:
      maintenance:
        - knäböj med kroppsvikt
        - hantelpress
      mobility:
        - dynamiska stretchövningar
        - yoga
      core:
        - plankan
        - russian twists

  race:
    protocol: SM
    goal: Minimal belastning, bibehåll skärpa
    focus: Bibehåll rörelsemönster utan att trötta ut
    note: Mycket lätt belastning, högst ett kort pass under fasen.

  transition:
    protocol: light_maintenance
    goal: Bibehåll muskeltonus och förebygg skador
    focus: Kroppsviktsövningar och lätta vikter
    note: Inkludera gärna alternativa former (yoga, pilates).
